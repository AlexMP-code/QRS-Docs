    PatientRegisterRequest:
      type: object
      required: [cid, first_name, last_name, phone_number, birth_date, right_type_id]
      properties:
        cid:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9]{13}$"
          description: เลขบัตรประชาชน 13 หลัก (unique)
          example: "1234567890123"
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          pattern: "^[0-9]{10}$"
          description: เบอร์โทร 10 หลัก (unique)
          example: "0812345678"
        birth_date:
          type: string
          format: date
          example: "1990-01-15"
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
        right_type_id:
          type: integer
          description: ID ของสิทธิ์การรักษา (ต้องมีอยู่ในระบบ)
        main_hospital_name:
          type: string
          maxLength: 255
          nullable: true
