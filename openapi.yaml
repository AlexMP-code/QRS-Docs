  /v1/staff/health-centers:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายชื่อ รพ.สต. (dropdown สำหรับ walk-in / จัดการผู้ใช้ / แก้ไขศูนย์)
      description: |
        SUPER_ADMIN: เห็นทุกศูนย์ **แบบรายละเอียดเต็ม** (รวมถึงศูนย์ที่ปิดสมบูรณ์ INACTIVE) — ใช้ 401+role เพราะ SUPER_ADMIN
        ไม่ต้องส่ง health_center_id
        HC_ADMIN/STAFF: เห็นเฉพาะศูนย์ตัวเอง **แบบย่อ (dropdown)** — เห็นเฉพาะศูนย์ที่เปิดรับจอง (ACTIVE) หรืออยู่ระหว่างปิดรับจอง (CLOSING) เท่านั้น; ศูนย์ที่ปิดสมบูรณ์ (INACTIVE) จะถูกซ่อน
      operationId: staffListHealthCenters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        description: SUPER_ADMIN → HealthCenterDetail (ทุกศูนย์); อื่น ๆ → object ย่อ (dropdown)
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/StaffHealthCenterDropdown"
                            - $ref: "#/components/schemas/HealthCenterDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/health-centers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Health Center ID

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขข้อมูล รพ.สต. (ชื่อ, ที่อยู่, พิกัด / SUPER_ADMIN เพิ่มรหัสศูนย์)
      description: |
        แก้ไขข้อมูลศูนย์บริการสุขภาพแบบ full-profile (partial update — ส่งเฉพาะ field ที่ต้องการ)

        สิทธิ์:
        - HEALTH_CENTER_ADMIN: แก้ไขเฉพาะศูนย์ของตนเอง — ชื่อ, เบอร์โทร, ตำบล/อำเภอ/จังหวัด, ที่อยู่เต็ม, ละติจูด/ลองจิจูด
        - SUPER_ADMIN: แก้ไขศูนย์ใดก็ได้ และเพิ่มได้เฉพาะของตนเอง: รหัสศูนย์ `code`
        - `status` และ `discord_webhook_url` ไม่สามารถแก้ไขผ่าน endpoint นี้ (status → toggle-status; webhook → route แยกต่างหาก)

        ข้อกำหนด:
        - HEALTH_CENTER_ADMIN — ไม่ต้องส่ง health_center_id (ระบบใช้ศูนย์ของตัวเอง); ไม่ตรงกับ `{id}` → 404
        - SUPER_ADMIN — ต้องส่ง `health_center_id` ให้ตรงกับ `{id}` (ไม่ตรง → 404) และสามารถส่ง `code` ได้
        - การใช้ `code` ที่ซ้ำกับศูนย์อื่น → 422
        - ทุกการแก้ไขถูกบันทึก audit_logs (UPDATE_HEALTH_CENTER — เก็บค่าก่อน/หลัง เฉพาะ field ที่เปลี่ยน)
      operationId: staffUpdateHealthCenter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHealthCenterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขข้อมูลสถานพยาบาลสำเร็จ"
                      data:
                        $ref: "#/components/schemas/HealthCenterDetail"
        "403":
          description: STAFF ไม่มีสิทธิ์ / SUPER_ADMIN ส่ง code ผิดเงื่อนไข เป็นต้น
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  SUPER_ADMIN เท่านั้น — ข้ามศูนย์
  # ══════════════════════════════════════════════════════════

  /v1/staff/admin/health-centers/{id}/toggle-status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Health Center ID

    patch:
      tags: [SUPER_ADMIN]
      summary: สลับสถานะเปิด/ปิดรับการจองของศูนย์ (ACTIVE ↔ CLOSING / INACTIVE → ACTIVE)
      description: |
        ควบคุมสถานะเปิด/ปิดรับการจองของศูนย์บริการสุขภาพ (SUPER_ADMIN เท่านั้น)

        สถานะ 3 ระดับ:
        - ACTIVE: เปิดรับจอง
        - CLOSING: ปิดรับการจองใหม่ แต่ยังให้บริกร (เคลียร์คิวที่ค้าง) — ผู้ป่วย/เจ้าหน้าที่ยังเห็นและจัดการคิวค้างได้
        - INACTIVE: ปิดสมบูรณ์ (ซ่อนจากผู้ป่วย)

        ผลการสลับ (toggle):
        - ACTIVE → CLOSING (เริ่มปิดรับจอง)
        - CLOSING → ACTIVE (ยกเลิกการปิดรับจอง)
        - INACTIVE → ACTIVE (เปิดใหม่) — สถานะ INACTIVE จะถูกตั้งให้อัตโนมัติเท่านั้น เมื่อคิว CONFIRMED ทั้งหมดสิ้นสุด

        เงื่อนไข:
        - ต้องส่ง `health_center_id` ให้ตรงกับ `{id}` (ไม่ตรง → 404)
        - ในสถานะ CLOSING: บล็อกการจองใหม่ / Available Slots / Walk-in (422) แต่ยังดู/ยกเลิกคิวเดิมได้
        - ทุกการสลับถูกบันทึก audit_logs (UPDATE_HEALTH_CENTER_STATUS — เก็บจาก/เป็น)
      operationId: staffToggleHealthCenterStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health_center_id]
              properties:
                health_center_id:
                  type: integer
                  description: ต้องตรงกับ id ใน path เสมอ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เปิดให้บริการรับการจองแล้ว"
                      data:
                        $ref: "#/components/schemas/HealthCenterStatusToggle"
        "403":
          description: ไม่ใช่ SUPER_ADMIN
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/discord/webhook:
    patch:
      tags: [SUPER_ADMIN]
      summary: ตั้งค่า/ลบ Discord Webhook ของ รพ.สต.
      description: |
        ตั้งค่า Discord Webhook URL สำหรับรับแจ้งเตือนนัดหมายใหม่
        - ระบุ health_center_id เพื่อเลือก รพ.สต. ที่จะแก้ (cross-tenant)
        - ส่ง null เพื่อลบ webhook
      operationId: staffUpdateDiscordWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiscordWebhookRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ตั้งค่า Discord Webhook สำเร็จ"
                      data:
                        type: object
                        properties:
                          health_center:
                            type: string
                            example: "รพ.สต. บ้านดงแสน"
                          webhook_url_set:
                            type: boolean
                            description: true = มี webhook, false = ลบแล้ว
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  TIME SLOT MANAGEMENT — SUPER_ADMIN / HEALTH_CENTER_ADMIN
  # ══════════════════════════════════════════════════════════

  /v1/staff/admin/time-slots:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายการช่วงเวลาของศูนย์ (หรือทุกศูนย์สำหรับ Super Admin)
      description: |
        ดึงรายการ time slots ของศูนย์ (เรียงตาม sort_order)
        - HC_ADMIN: เฉพาะศูนย์ของตนเอง
        - SUPER_ADMIN: ทุกศูนย์ (หรือกรองด้วย ?health_center_id=)
        - เฉพาะ SUPER_ADMIN / HEALTH_CENTER_ADMIN เท่านั้น (STAFF เข้าไม่ได้ — 403)
        - items = TimeSlotResource: id, health_center_id, label, start_time, end_time, sort_order, is_active
        - หมายเหตุ: จำนวนคิวล่วงหน้า (future_appointments_count) ไม่ถูกส่งกลับใน response
      operationId: staffListTimeSlots
      parameters:
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TimeSlotResource"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [SUPER_ADMIN]
      summary: เพิ่มช่วงเวลาใหม่
      description: |
        เพิ่ม time slot ใหม่ให้ศูนย์สุขภาพ (label และ sort_order คำนวณอัตโนมัติจาก start_time/end_time)
        - SUPER_ADMIN เท่านั้น (ต้องระบุ health_center_id)
        - ห้าม start_time/end_time ทับซ้อนกับ slot ที่มีอยู่แล้วในศูนย์เดียวกัน
      operationId: staffCreateTimeSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTimeSlotRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เพิ่มช่วงเวลาสำเร็จ"
                      data:
                        $ref: "#/components/schemas/TimeSlotResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/admin/time-slots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Time Slot ID

    put:
      tags: [SUPER_ADMIN]
      summary: แก้ไขช่วงเวลา
      description: |
        แก้ไข time slot (start_time, end_time, is_active)
        - label และ sort_order จะถูกคำนวณใหม่ถ้าแก้ start/end time
        - ห้าม start_time/end_time ทับซ้อนกับ slot อื่น
      operationId: staffUpdateTimeSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeSlotRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขช่วงเวลาสำเร็จ"
                      data:
                        $ref: "#/components/schemas/TimeSlotResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [SUPER_ADMIN]
      summary: ลบช่วงเวลา
      description: |
        ลบ time slot แบบถาวร (Hard Delete)
        - ห้ามลบถ้ามีคิว (appointment) อ้างอิงช่วงเวลานี้อยู่ — ทุกสถานะและทุกวัน รวมคิวที่ผ่านไปแล้ว (422)
          วิธีที่แนะนำคือ เปิด/ปิด (toggle-status) แทน
        - pivot service_time_slot จะถูกลบอัตโนมัติ (cascade)
      operationId: staffDeleteTimeSlot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลบช่วงเวลาเรียบร้อยแล้ว"
        "422":
          description: "ไม่สามารถลบได้ เนื่องจากมีคิวที่ใช้ช่วงเวลานี้อยู่ (ทุกสถานะ รวมคิวที่ผ่านไปแล้ว)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/admin/time-slots/{id}/toggle-status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Time Slot ID

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: เปิด/ปิดสถานะช่วงเวลา
      description: |
        สลับ is_active ของ time slot (true ↔ false)
        - ใช้ปิด slot แทนการลบ เมื่อมีคิวใช้ช่วงเวลาอยู่
        - HC_ADMIN: เฉพาะศูนย์ของตนเอง / SUPER_ADMIN: ต้องระบุ health_center_id ให้ตรงกับศูนย์ของ slot
      operationId: staffToggleTimeSlotStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ปรับปรุงสถานะช่วงเวลาสำเร็จ"
                      is_active:
                        type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  STAFF เท่านั้น — เจ้าหน้าที่ห้องตรวจ
  # ══════════════════════════════════════════════════════════

  /v1/staff/appointments/walk-in:
    post:
      tags: [STAFF]
      summary: ออกคิว Walk-in (เจ้าหน้าที่สร้างแทนผู้ป่วย)
      description: |
        เงื่อนไขปฏิเสธ (422): ศูนย์ของบริการนั้นอยู่ในสถานะไม่รับการจองใหม่ (CLOSING / INACTIVE),
        บริการ/ช่วงเวลาไม่อยู่ใน Operating Days, staff ประจำบริการลาทั้งหมด (หรือหมอที่ส่งลาทั้งหมด), ศูนย์เต็ม เป็นต้น
        - สำหรับบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true): ต้องส่ง staff_id
          (หมอที่ผูกกับบริการ, สถานะ ACTIVE, ไม่ลา, ยังไม่เต็ม round นั้น) — ไม่ส่ง/ส่งซ้ำ/หมอลา/ไม่ผูก → 422
        - booked_by_type = STAFF เสมอสำหรับ walk-in
      operationId: staffWalkInBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkInBookingRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ออกคิว Walk-in สำเร็จ"
                      appointment:
                        type: object
                        properties:
                          id:
                            type: integer
                          queue_no:
                            type: string
                            example: "Q-001"
                          patient_name:
                            type: string
                            example: "สมชาย ใจดี"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  PATIENT — ผู้รับบริการ
  # ══════════════════════════════════════════════════════════

  /v1/patient/me:
    get:
      tags: [Patient]
      summary: ข้อมูลผู้รับบริการปัจจุบัน (masked)
      operationId: patientMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PatientProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/services/{id}/staff:
    get:
      tags: [Patient]
      summary: รายชื่อหมอ/เจ้าหน้าที่ที่เลือกได้สำหรับบริการ
      description: |
        ใช้ก่อนจองคิวสำหรับบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true)
        - เห็นเฉพาะหมอที่ผูกกับบริการ (service_staff) + สถานะ ACTIVE + ไม่ลาวันที่ระบุ
        - ถ้าบริการไม่ได้เปิดให้เลือกหมอ → คืน staff เป็น []
      operationId: patientGetServiceStaff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Service ID
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: วันที่ต้องการตรวจ (default = วันนี้)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      date:
                        type: string
                        format: date
                        description: วันที่ (คืนค่าเฉพาะเมื่อบริการเปิดให้เลือกหมอ allow_staff_selection=true)
                      staff:
                        type: array
                        description: รายชื่อหมอที่เลือกได้ (ถ้าไม่เปิดให้เลือกหมอ → คืน [] และไม่มี key date)
                        items:
                          $ref: "#/components/schemas/SelectableStaff"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/book:
    post:
      tags: [Patient]
      summary: จองคิวนัดหมาย
      description: |
        เงื่อนไขปฏิเสธ (422): ศูนย์ของบริการนั้นอยู่ในสถานะไม่รับการจองใหม่ (CLOSING / INACTIVE),
        ศูนย์เต็ม, บริการปิดใช้งาน, จองซ้ำวันเดียวกัน, ไม่อยู่ใน Operating Days, staff ลาทั้งหมด เป็นต้น
        - สำหรับบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true): ต้องส่ง staff_id
          (หมอที่ผูกกับบริการ, สถานะ ACTIVE, ไม่ลา, ยังไม่เต็ม round นั้น) — ไม่ส่ง/ส่งซ้ำ/หมอลา/ไม่ผูก → 422
      operationId: patientBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAppointmentRequest"
      responses:
        "201":
          description: จองสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "จองคิวสำเร็จ"
                      data:
                        $ref: "#/components/schemas/BookingResult"
        "422":
          description: จองไม่สำเร็จ (คิวเต็ม / ซ้ำ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/appointments:
    get:
      tags: [Patient]
      summary: ประวัตินัดหมายของฉัน
      operationId: patientListAppointments
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Appointment"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    get:
      tags: [Patient]
      summary: รายละเอียดนัดหมาย 1 รายการ
      operationId: patientShowAppointment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      ticket:
                        $ref: "#/components/schemas/Appointment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/appointments/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Patient]
      summary: ยกเลิกนัดหมาย (เฉพาะ CONFIRMED)
      description: |
        ยกเลิกได้เฉพาะสถานะ CONFIRMED และยังยกเลิกทัน:
        - นัดวันหลัง → ยกเลิกได้ทั้งวัน
        - นัดวันนี้ → ยกเลิกได้เฉพาะก่อนช่วงเวลาสิ้นสุด (end_time) ของรอบนั้น
        - เลยแล้ว/ไม่ใช่คิวของเรา → 404
        เหตุผลเริ่มต้น (ถ้าไม่ระบุ): "ผู้ป่วยขอยกเลิกเองผ่านระบบ"
      operationId: patientCancelAppointment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: เหตุผลการยกเลิก (ถ้าไม่ระบุจะใช้ "ผู้ป่วยขอยกเลิกเองผ่านระบบ")
      responses:
        "200":
          description: ยกเลิกสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ยกเลิกการจองคิวเรียบร้อยแล้ว"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Service ID
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Appointment ID
    HealthCenterIdFilter:
      name: health_center_id
      in: query
      required: false
      schema:
        type: integer
      description: กรองตาม รพ.สต. (SUPER_ADMIN เท่านั้น — role อื่นถูกจำกัดที่ รพ.สต. ของตัวเองโดยอัตโนมัติ)

  responses:
    Unauthorized:
      description: ไม่ได้ยืนยันตัวตน (Unauthenticated)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Unauthorized"
    ValidationError:
      description: ข้อมูลไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "The given data was invalid."
            errors:
              username:
                - "ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง"
    Forbidden:
      description: ไม่มีสิทธิ์เข้าถึง (Forbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Forbidden"
    NotFound:
      description: ไม่พบข้อมูลที่ร้องขอ (Not Found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Not Found"

  schemas:
    # ---- Generic ----
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      description: Meta แบบ custom ของ /v1/patient/appointments (มีแค่ 4 key — ไม่มี links/first_page_url ฯลฯ)
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    LaravelPaginator:
      type: object
      description: "โครงสร้าง standard Laravel LengthAwarePaginator (ใช้ในหน้า admin: users/patients/health-centers)"
      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          description: รายการลิงก์หน้าต่าง ๆ (label ภาษาไทยจากตาราง, {url,label,active})
          items:
            $ref: "#/components/schemas/PaginatorLink"
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
          description: URL ฐานของรายการนี้
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    PaginatorLink:
      type: object
      properties:
        url:
          type: string
          nullable: true
        label:
          type: string
          description: "ข้อความปุ่ม (เช่น &laquo; Previous, 1, 2, 3, Next &raquo;) — label แปลตาม locale app"
        active:
          type: boolean

    PaginatedUsers:
      type: object
      description: ผลลัพธ์แบบ standard Laravel paginator (admin users list)
      allOf:
        - $ref: "#/components/schemas/LaravelPaginator"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UserResource"

    PaginatedPatients:
      type: object
      description: ผลลัพธ์แบบ standard Laravel paginator (admin patients list)
      allOf:
        - $ref: "#/components/schemas/LaravelPaginator"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/StaffPatientResource"

    PaginatedHealthCenters:
      type: object
      description: ผลลัพธ์แบบ standard Laravel paginator (admin health-centers list)
      allOf:
        - $ref: "#/components/schemas/LaravelPaginator"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/StaffHealthCenterResource"

    StaffPatientResource:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        cid:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        birth_date:
          type: string
        gender:
          type: string
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        created_at:
          type: string

    StaffHealthCenterResource:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        phone_number:
          type: string
          nullable: true
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: string
        has_webhook:
          type: boolean

    # ---- Staff ----
    StaffUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [STAFF, HEALTH_CENTER_ADMIN, SUPER_ADMIN]
        health_center:
          type: object
          nullable: true
          description: รพ.สต. ต้นสังกัด (null สำหรับ SUPER_ADMIN กลาง)
          properties:
            id:
              type: integer
            name:
              type: string
            code:
              type: string

    StaffResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        health_center:
          allOf:
            - $ref: "#/components/schemas/HealthCenter"
            - type: object
              nullable: true
          description: รพ.สต. ต้นสังกัด (null สำหรับ SUPER_ADMIN กลาง)
        roles:
          type: array
          items:
            type: string

    StaffMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]
        effective_status:
          type: string
          nullable: true
          enum: [ACTIVE, LEAVE]
          description: สถานะจริง ณ วันที่ระบุ (เฉพาะเมื่อส่ง query param ?date=) — cross-reference กับ staff_leaves
        category:
          $ref: "#/components/schemas/Category"
        health_center:
          $ref: "#/components/schemas/HealthCenter"
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string

    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
          description: จำนวนคิวทั้งหมด
        waiting:
          type: integer
          description: รอรับบริการ (CONFIRMED)
        completed:
          type: integer
          description: เสร็จแล้ว (COMPLETED)
        cancelled:
          type: integer
          description: ยกเลิก (CANCELLED)
        no_show:
          type: integer
          description: ไม่มา (NO_SHOW)

    # ---- Patient ----
    PatientProfile:
      type: object
      properties:
        id:
          type: integer
        masked_cid:
          type: string
          example: "1-****-*****-23"
          description: เลขบัตรที่ซ่อน (รูปแบบ 1-****-*****-xx)
        masked_name:
          type: string
          example: "สม*** ใจ***"
          description: ชื่อที่ซ่อน (อักขระ 2 ตัวแรก + *** ของชื่อและนามสกุล)
        masked_phone:
          type: string
          example: "081-***-5678"
          description: เบอร์โทรที่ซ่อน (รูปแบบ xxx-***-xxxx)
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        rights:
          type: array
          items:
            $ref: "#/components/schemas/PatientRight"

    PatientRight:
      type: object
      properties:
        id:
          type: integer
        right_type:
          $ref: "#/components/schemas/RightType"
        main_hospital_name:
          type: string
          nullable: true
        is_primary:
          type: boolean
        card_number:
          type: string
          nullable: true
        expire_date:
          type: string
          format: date
          nullable: true

    RightType:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: "SSS"
        name:
          type: string
          example: "ประกันสังคม"
        description:
          type: string
          nullable: true

    UnmaskedPatient:
      type: object
      description: ข้อมูลจริงของผู้ป่วย (endpoint มี audit log — UNMASK_PATIENT_DATA)
      properties:
        id:
          type: integer
        cid:
          type: string
          description: เลขบัตร 13 หลัก
          example: "1234567890123"
        full_name:
          type: string
          description: ชื่อ-นามสกุลเต็ม (first_name last_name)
          example: "สมชาย ใจดี"
        phone_number:
          type: string
          example: "0812345678"
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        address:
          type: string
          description: ที่อยู่เต็ม (full_address)
        rights:
          type: array
          description: สิทธิการรักษาของผู้ป่วย (โหลด right_type ด้วย)
          items:
            $ref: "#/components/schemas/PatientRight"

    PatientContactUpdate:
      type: object
      description: ผลลัพธ์การแก้ไขเบอร์โทรผู้รับบริการ
      properties:
        id:
          type: integer
        full_name:
          type: string
          example: "สมชาย ใจดี"
        phone_number:
          type: string
          example: "0899999999"

    PatientLoginSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        is_registered:
          type: boolean
          example: true
        token:
          type: string
          nullable: false
        patient:
          type: object
          properties:
            id:
              type: integer
            masked_name:
              type: string
            masked_phone:
              type: string

    PatientLoginNotRegistered:
      type: object
      properties:
        success:
          type: boolean
          example: true
        is_registered:
          type: boolean
          example: false
        message:
          type: string
          example: "ไม่พบประวัติผู้รับบริการ กรุณาลงทะเบียนใหม่"
        token:
          type: string
          nullable: true
        patient:
          type: object
          nullable: true

    # ---- Services ----
    PatientServiceBrief:
      type: object
      description: |
        บริการฉบับย่อ (response ของ GET /v1/patient/health-centers/{id}/services)
        — projection แบบจำกัด: ไม่มี is_active / allow_staff_selection / assigned_staff / selectable_staff
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity_type:
          type: string
          enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
        category:
          $ref: "#/components/schemas/Category"
        capacity:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            max_per_slot:
              type: integer
              nullable: true
            max_per_day:
              type: integer
              nullable: true
        time_slots:
          type: array
          description: ช่วงเวลาให้บริการ พร้อมวันเปิดให้บริการ (จาก Service::slotsWithDays — แบบ {time_slot_id, days})
          items:
            $ref: "#/components/schemas/ServiceTimeSlotDayInput"

    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "ตรวจสุขภาพทั่วไป"
        description:
          type: string
          nullable: true
        capacity_type:
          type: string
          enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
        is_active:
          type: boolean
        allow_staff_selection:
          type: boolean
          description: เปิด/ปิดให้ผู้ป่วยเลือกหมอ/เจ้าหน้าที่ (เปิดได้เฉพาะ capacity_type=PER_MASSEUSE และต้องมีหมอผูกไว้แล้ว)
        category:
          $ref: "#/components/schemas/Category"
        capacity:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            max_per_slot:
              type: integer
              nullable: true
            max_per_day:
              type: integer
              nullable: true
        time_slots:
          type: array
          description: ช่วงเวลาเปิดให้บริการของบริการนี้ พร้อมวันเปิดให้บริการ (days) ต่อช่วง
          items:
            $ref: "#/components/schemas/ServiceTimeSlotHours"
        assigned_staff:
          type: array
          description: เจ้าหน้าที่ที่ได้รับมอบหมายให้ดูแลบริการนี้ (มีเฉพาะตอน include staff)
          items:
            $ref: "#/components/schemas/StaffSummary"
        selectable_staff:
          type: array
          description: หมอ/เจ้าหน้าที่ที่ผู้ป่วยเลือกได้ (service_staff) — มีเฉพาะเมื่อโหลดมาใน response
          items:
            $ref: "#/components/schemas/SelectableStaffWithStatus"

    SelectableStaff:
      type: object
      description: หมอ/เจ้าหน้าที่ที่เลือกได้ (จาก GET /v1/patient/services/{id}/staff)
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
          nullable: true

    SelectableStaffWithStatus:
      type: object
      description: หมอ/เจ้าหน้าที่ที่เลือกได้ พร้อมสถานะ (ใน ServiceResource.selectable_staff)
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]

    StaffSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "แพทย์แผนไทย"
        icon:
          type: string
          nullable: true
        sort_order:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    TimeSlot:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
          example: "08:30 - 09:30 น."
        start_time:
          type: string
          example: "08:30:00"
        end_time:
          type: string
          example: "09:30:00"
        sort_order:
          type: integer
          description: ลำดับการเรียง (คำนวณจากนาทีของ start_time)
        is_active:
          type: boolean
          description: สถานะเปิด/ปิดใช้งานช่วงเวลานี้

    ServiceTimeSlotHours:
      type: object
      description: ช่วงเวลาเปิดให้บริการของบริการ พร้อมวันเปิดให้บริการรายสัปดาห์ (1=จันทร์ … 7=อาทิตย์)
      allOf:
        - $ref: "#/components/schemas/TimeSlot"
        - type: object
          properties:
            days:
              type: array
              description: "วันเปิดให้บริการของช่วงเวลานี้ (ISO 8601: 1=จันทร์, 2=อังคาร, … 7=อาทิตย์)"
              items:
                type: integer
                minimum: 1
                maximum: 7
              example: [1, 3, 5]

    AvailableSlot:
      type: object
      properties:
        time_slot_id:
          type: integer
        time_label:
          type: string
          example: "08:00-09:00"
        start_time:
          type: string
        end_time:
          type: string
        max_capacity:
          type: integer
          description: จำนวนคิวสูงสุดตาม capacity_type
        available_count:
          type: integer
          description: จำนวนคิวที่เหลือ
        is_full:
          type: boolean
        staff:
          type: array
          nullable: true
          description: รายละเอียดรายหมอต่อรอบเวลา (มีเฉพาะเมื่อบริการ allow_staff_selection=true) — แต่ละหมอรองรับ 1 คิวต่อรอบ
          items:
            type: object
            properties:
              staff_id:
                type: integer
              name:
                type: string
              position:
                type: string
                nullable: true
              available:
                type: boolean
                description: หมอคนนี้ยังว่างในรอบเวลานี้หรือไม่

    # ---- Appointment ----
    Appointment:
      type: object
      properties:
        id:
          type: integer
        queue_no:
          type: string
          description: หมายเลขคิว (รูปแบบ Q-xxx เช่น Q-007)
          example: "Q-007"
        appointment_number:
          type: integer
          description: ลำดับคิวในวันนั้น
        status:
          type: string
          enum: [CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
        booked_by_type:
          type: string
          enum: [SELF, STAFF]
          description: วิธีการจอง (SELF = ผู้ป่วยจองเอง / STAFF = เจ้าหน้าที่ออกคิว walk-in ให้)
        appointment_date:
          type: string
          format: date
        cancellation_reason:
          type: string
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        health_center:
          $ref: "#/components/schemas/HealthCenter"
        service:
          $ref: "#/components/schemas/Service"
        time_slot:
          $ref: "#/components/schemas/TimeSlot"
        staff:
          type: object
          nullable: true
          description: หมอ/เจ้าหน้าที่ที่รับผิดชอบคิวนี้ (null = ระบบจัดสรรอัตโนมัติ)
          properties:
            id:
              type: integer
            name:
              type: string
            position:
              type: string
              nullable: true
        patient:
          type: object
          properties:
            id:
              type: integer
            masked_name:
              type: string
            masked_phone:
              type: string
        patient_right:
          $ref: "#/components/schemas/PatientRight"

    BookingResult:
      type: object
      properties:
        appointment_id:
          type: integer
        queue_no:
          type: string
          example: "Q-001"
        health_center:
          type: string
          example: "รพ.สต. บ้านดงแสน"
        service_name:
          type: string
          example: "ตรวจสุขภาพทั่วไป"
        appointment_date:
          type: string
          format: date
        time_slot:
          type: string
          example: "08:00-09:00"
        staff:
          type: object
          nullable: true
          description: หมอ/เจ้าหน้าที่ที่เลือก (null = ระบบจัดสรรอัตโนมัติ)
          properties:
            id:
              type: integer
            name:
              type: string
            position:
              type: string
              nullable: true

    # ---- Health Center ----
    HealthCenter:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: "51010"
        name:
          type: string
          example: "รพ.สต. บ้านดงแสน"
        phone_number:
          type: string
          nullable: true
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum: [ACTIVE, CLOSING, INACTIVE]
          description: สถานะศูนย์ (ACTIVE เปิดรับจอง / CLOSING กำลังปิด / INACTIVE ปิดสมบูรณ์)

    HealthCenterDetail:
      type: object
      description: รายละเอียด รพ.สต. สำหรับหน้ารายละเอียด (ไม่รวม discord_webhook_url)
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        phone_number:
          type: string
          nullable: true
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true

    StaffHealthCenterDropdown:
      type: object
      description: รายการย่อสำหรับ dropdown (STAFF / HEALTH_CENTER_ADMIN — เฉพาะศูนย์ที่เปิดรับจอง ACTIVE หรือ CLOSING; ซ่อน INACTIVE)
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        has_webhook:
          type: boolean
          description: มี Discord Webhook ตั้งค่าแล้วหรือไม่
        status:
          type: string
          enum: [ACTIVE, CLOSING]
          description: สถานะศูนย์ (ผู้ใช้ทั่วไปเห็นได้เฉพาะ ACTIVE / CLOSING — INACTIVE ถูกซ่อน)

    UpdateHealthCenterRequest:
      type: object
      description: |
        Partial update — ส่งเฉพาะ field ที่ต้องการแก้ไข
        HEALTH_CENTER_ADMIN / SUPER_ADMIN เท่านั้น; `code` แก้ไขได้เฉพาะ SUPER_ADMIN
      properties:
        health_center_id:
          type: integer
          description: |
            รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุให้ตรงกับ id ใน path เสมอ)
            HEALTH_CENTER_ADMIN ไม่ต้องส่ง — ระบบใช้ รพ.สต. ของตัวเอง
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: รหัสสถานพยาบาล (เฉพาะ SUPER_ADMIN; ซ้ำกับศูนย์อื่น → 422)
        name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
      example:
        name: "รพ.สต.ท่าพระ"
        phone_number: "024111111"
        province: "กรุงเทพมหานคร"
        latitude: 13.7346
        longitude: 100.4871

    HealthCenterStatusToggle:
      type: object
      description: ผลการสลับสถานะศูนย์
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [ACTIVE, CLOSING, INACTIVE]
          description: สถานะใหม่ของศูนย์หลังสลับ

    NearbyCenter:
      allOf:
        - $ref: "#/components/schemas/HealthCenter"
        - type: object
          properties:
            distance_km:
              type: number
              format: double
              description: ระยะทางเป็นกิโลเมตร
            services:
              type: array
              items:
                $ref: "#/components/schemas/Service"

    # ---- Requests ----
    CreateServiceRequest:
      type: object
      required: [category_id, name, capacity_type, time_slots]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        category_id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: string
        capacity_type:
          type: string
          enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
        allow_staff_selection:
          type: boolean
          enum: [false]
          default: false
          description: |
            ไม่สามารถเปิดให้เลือกหมอตอนสร้างบริการได้ (value ต้องเป็น false/0)
            - สร้างบริการก่อน → ผูกหมอที่เลือกได้ (PUT /v1/staff/services/{id}/staff) → เปิด allow_staff_selection ผ่านการแก้ไขบริการ
        max_per_slot:
          type: integer
          minimum: 1
          description: Required when capacity_type = PER_SLOT
        max_per_day:
          type: integer
          minimum: 1
          description: Required when capacity_type = PER_DAY
        time_slots:
          type: array
          minItems: 1
          description: ช่วงเวลาเปิดให้บริการ อย่างน้อย 1 ช่วง พร้อมวันเปิดให้บริการ (days) ต่อช่วง
          items:
            $ref: "#/components/schemas/ServiceTimeSlotDayInput"

    UpdateServiceRequest:
      type: object
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        name:
          type: string
          maxLength: 255
        description:
          type: string
        category_id:
          type: integer
        capacity_type:
          type: string
          enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
        allow_staff_selection:
          type: boolean
          description: |
            เปิด/ปิดให้ผู้ป่วยเลือกหมอ — เปิดได้เฉพาะ services ที่ capacity_type=PER_MASSEUSE และต้องมีหมอผูกไว้แล้ว (service_staff);
            การปิดต้องไม่มีคิว CONFIRMED ในอนาคตที่ผูกกับหมอไว้ (422)
        max_per_slot:
          type: integer
          minimum: 1
        max_per_day:
          type: integer
          minimum: 1
        time_slots:
          type: array
          minItems: 1
          description: ช่วงเวลาเปิดให้บริการ พร้อมวันเปิดให้บริการ (days) ต่อช่วง
          items:
            $ref: "#/components/schemas/ServiceTimeSlotDayInput"

    ServiceTimeSlotDayInput:
      type: object
      description: รายการ (ช่วงเวลา, วันเปิดให้บริการ) สำหรับเชื่อมบริการ
      required: [time_slot_id, days]
      properties:
        time_slot_id:
          type: integer
          description: ID ของช่วงเวลา (ต้องมีอยู่ในระบบ)
        days:
          type: array
          minItems: 1
          description: วันเปิดให้บริการรายสัปดาห์ (1=จันทร์ … 7=อาทิตย์)
          items:
            type: integer
            minimum: 1
            maximum: 7
          example: [1, 2, 3, 4, 5]

    SyncServiceTimeSlotDaysRequest:
      type: object
      description: ตั้งค่าวันเปิดให้บริการ (Operating Days) รายช่วงเวลาของบริการหนึ่ง (แบบ Full Replace)
      required: [time_slots]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ; HC_ADMIN ไม่ต้องส่ง — ใช้ศูนย์ของตัวเอง)
        time_slots:
          type: array
          minItems: 1
          description: ชุด (ช่วงเวลา, วันเปิดให้บริการ) ทั้งหมดที่จะใช้แทนข้อมูลเดิม — อย่างน้อย 1 ช่วง และบริการ Active ต้องมี shaded (ช่วง, วัน) อย่างน้อย 1 รายการ
          items:
            $ref: "#/components/schemas/ServiceTimeSlotDayInput"

    StaffLeaveResource:
      type: object
      properties:
        id:
          type: integer
        leave_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        staff_user_id:
          type: integer
          description: ID ของผู้ใช้ (STAFF) ที่ลางาน
        health_center_id:
          type: integer
          description: รพ.สต. ต้นสังกัดของวันลา
        created_by:
          type: integer
          nullable: true
          description: ID ของผู้ใช้ที่สร้างบันทึกวันลา
        staff_user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            username:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreLeaveRequest:
      type: object
      required: [staff_user_id, leave_date]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุ)
        staff_user_id:
          type: integer
          description: ID เจ้าหน้าที่ (STAFF ลงให้ตัวเอง, HC_ADMIN ลงให้ลูกน้อง)
        leave_date:
          type: string
          format: date
          description: วันที่ลางาน (ต้อง >= วันนี้)
        reason:
          type: string
          maxLength: 500
          description: เหตุผล (ไม่บังคับ)

    SyncAssigneesRequest:
      type: object
      required: [user_ids]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        user_ids:
          type: array
          description: รายการ user_id ของ STAFF ที่ต้องมอบหมาย ([] = ถอดทั้งหมด)
          items:
            type: integer

    SyncServiceStaffRequest:
      type: object
      required: [staff_ids]
      description: ผูก/ถอด หมอ/เจ้าหน้าที่ที่ผู้ป่วยเลือกได้ (Selectable Staff) ประจำบริการ
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ; HC_ADMIN ไม่ต้องส่ง — ใช้ศูนย์ของตัวเอง)
        staff_ids:
          type: array
          description: |
            รายการ staff_id ของหมอ/เจ้าหน้าที่ที่ผู้ป่วยเลือกได้ ([] = ถอดทั้งหมด)
            - ต้องเป็นบุคลากรของศูนย์เดียวกันกับบริการ และอยู่ในหมวดหมู่เดียวกับบริการ (422)
            - แกะหมอที่มีคิว CONFIRMED ในอนาคตค้างอยู่ไม่ได้ (422)
          items:
            type: integer

    ReassignStaffRequest:
      type: object
      required: [staff_id]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        staff_id:
          type: integer
          description: ID หมอ/เจ้าหน้าที่คนใหม่ (ต้องผูกกับ service_staff ของบริการในคิวนี้)

    WalkInBookingRequest:
      type: object
      required: [cid, first_name, last_name, phone_number, birth_date, service_id, time_slot_id]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        cid:
          type: string
          minLength: 13
          maxLength: 13
          description: เลขบัตรประชาชน 13 หลัก
          example: "1234567890123"
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          pattern: "^[0-9]{10}$"
          example: "0812345678"
        birth_date:
          type: string
          format: date
          example: "1990-01-15"
        service_id:
          type: integer
          description: ต้องเป็นบริการของ รพ.สต. ต้นสังกัด และต้องเปิดให้บริการในวันนัดหมาย
        time_slot_id:
          type: integer
          description: ต้องเป็น time slot ที่เชื่อมกับ service นี้ และต้องเป็นวันที่เปิดให้บริการ (อยู่ใน Operating Days) ของบริการ/ช่วงเวลานั้น
        staff_id:
          type: integer
          nullable: true
          description: ID หมอ/เจ้าหน้าที่ที่ออกคิวให้ (required เมื่อบริการ allow_staff_selection=true; ต้องผูกกับ service_staff ของบริการนี้)
        patient_right_id:
          type: integer
          nullable: true
          description: ID ของสิทธิ์การรักษา (ต้องเป็นของผู้ป่วยคนนี้)

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        status:
          type: string
          enum: [COMPLETED, CANCELLED, NO_SHOW]
        cancellation_reason:
          type: string
          maxLength: 500
          description: required when status = CANCELLED

    BookAppointmentRequest:
      type: object
      required: [service_id, time_slot_id, appointment_date]
      properties:
        service_id:
          type: integer
          description: ต้องเป็นบริการที่เปิดให้บริการในวันนัดหมาย (อยู่นอก Operating Days → 422)
        time_slot_id:
          type: integer
          description: ต้องเป็น time slot ที่เชื่อมกับ service นี้ และต้องเป็นวันที่เปิดให้บริการของ (บริการ, ช่วงเวลา) นั้น
        appointment_date:
          type: string
          format: date
          description: ต้อง >= วันนี้ และต้องตรงกับวันเปิดให้บริการ (Operating Days) ของบริการ/ช่วงเวลา
        staff_id:
          type: integer
          nullable: true
          description: ID หมอ/เจ้าหน้าที่ที่เลือก (required เมื่อบริการ allow_staff_selection=true; ต้องผูกกับ service_staff ของบริการนี้)
        patient_right_id:
          type: integer
          nullable: true
          description: ID ของสิทธิ์การรักษา

    CreateStaffMemberRequest:
      type: object
      required: [name, status]
      properties:
        health_center_id:
          type: integer
          description: รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        category_id:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 255
        position:
          type: string
          maxLength: 100
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]

    UpdateDiscordWebhookRequest:
      type: object
      properties:
        health_center_id:
          type: integer
          description: ระบุ รพ.สต. ที่จะแก้ webhook (SUPER_ADMIN เท่านั้น)
        webhook_url:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^https://discord\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+$"
          description: |
            Discord Webhook URL
            - ใส่ URL เพื่อตั้งค่า
            - ส่ง null เพื่อลบ webhook
          example: "https://discord.com/api/webhooks/1234567890/abcdefg..."

    TimeSlotResource:
      type: object
      description: ข้อมูลช่วงเวลา (ใช้ใน response ของ time-slot endpoints)
      properties:
        id:
          type: integer
        health_center_id:
          type: integer
          nullable: true
        label:
          type: string
          example: "08:30 - 09:30 น."
        start_time:
          type: string
          example: "08:30:00"
        end_time:
          type: string
          example: "09:30:00"
        sort_order:
          type: integer
        is_active:
          type: boolean

    StoreTimeSlotRequest:
      type: object
      required: [start_time, end_time]
      properties:
        start_time:
          type: string
          description: เวลาเริ่มต้น (HH:MM)
          example: "09:00"
        end_time:
          type: string
          description: เวลาสิ้นสุด (HH:MM, ต้องมากกว่า start_time)
          example: "10:00"

    UpdateTimeSlotRequest:
      type: object
      properties:
        start_time:
          type: string
          description: เวลาเริ่มต้นใหม่ (HH:MM)
          example: "09:00"
        end_time:
          type: string
          description: เวลาสิ้นสุดใหม่ (HH:MM)
          example: "10:00"
        is_active:
          type: boolean
          description: เปิด/ปิดสถานะช่วงเวลา

    UserResource:
      type: object
      description: ข้อมูลผู้ใช้
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        health_center:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        roles:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string

    StoreUserRequest:
      type: object
      required: [name, username, password, role_ids]
      properties:
        health_center_id:
          type: integer
          nullable: true
          description: ID รพ.สต. (null = SUPER_ADMIN กลาง)
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 50
          description: ต้องไม่ซ้ำ
        email:
          type: string
          format: email
          nullable: true
        phone_number:
          type: string
          maxLength: 20
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
        role_ids:
          type: array
          minItems: 1
          items:
            type: integer
          description: _ids ของ roles (1=SUPER_ADMIN, 2=HEALTH_CENTER_ADMIN, 3=STAFF)
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    UpdateUserRequest:
      type: object
      properties:
        health_center_id:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          nullable: true
        phone_number:
          type: string
          maxLength: 20
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          nullable: true
          description: ส่งค่าว่างเพื่อไม่แก้ไข
        role_ids:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    UpdatePatientContactRequest:
      type: object
      required: [phone_number]
      properties:
        phone_number:
          type: string
          pattern: "^[0-9]{10}$"
          example: "0899999999"
          description: เบอร์โทรใหม่ 10 หลัก (ต้องไม่ซ้ำกับผู้รับบริการท่านอื่น — ใช้เป็น credentials login)
        health_center_id:
          type: integer
          description: |
            รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
            STAFF / HEALTH_CENTER_ADMIN ไม่ต้องส่ง — ระบบใช้ รพ.สต. ของตัวเอง

    UpdatePatientProfileRequest:
      type: object
      description: |
        Partial update — ส่งเฉพาะ field ที่ต้องการแก้ไข
        (แก้ไขได้เฉพาะ HEALTH_CENTER_ADMIN / SUPER_ADMIN)
      properties:
        health_center_id:
          type: integer
          description: |
            รพ.สต. เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
            HEALTH_CENTER_ADMIN ไม่ต้องส่ง — ระบบใช้ รพ.สต. ของตัวเอง
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        cid:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9]{13}$"
          description: เลขบัตรประชาชน 13 หลัก (แก้ไขเฉพาะกรณีพิมพ์ผิด; ต้อง unique — ซ้ำกับผู้อื่น → 422)
        birth_date:
          type: string
          format: date
          example: "1990-01-15"
          description: ต้องเป็นวันในอดีต (ก่อนวันนี้)
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
      example:
        first_name: "สมชาย"
        last_name: "ใจดี"
        birth_date: "1990-01-15"
