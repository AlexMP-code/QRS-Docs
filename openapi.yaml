              $ref: "#/components/schemas/BookAppointmentRequest"
      responses:
        "201":
          description: จองสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "จองคิวสำเร็จ"
                      data:
                        $ref: "#/components/schemas/BookingResult"
        "422":
          description: จองไม่สำเร็จ (คิวเต็ม / ซ้ำ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/appointments:
    get:
      tags: [Patient]
      summary: ประวัตินัดหมายของฉัน
      operationId: patientListAppointments
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Appointment"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    get:
      tags: [Patient]
      summary: รายละเอียดนัดหมาย 1 รายการ
      operationId: patientShowAppointment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      ticket:
                        $ref: "#/components/schemas/Appointment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/patient/appointments/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Patient]
      summary: ยกเลิกนัดหมาย (เฉพาะ CONFIRMED)
      description: |
        ยกเลิกได้เฉพาะสถานะ CONFIRMED และยังยกเลิกทัน:
        - นัดวันหลัง → ยกเลิกได้ทั้งวัน
        - นัดวันนี้ → ยกเลิกได้เฉพาะก่อนช่วงเวลาสิ้นสุด (end_time) ของรอบนั้น
        - เลยแล้ว/ไม่ใช่คิวของเรา → 404
        เหตุผลเริ่มต้น (ถ้าไม่ระบุ): "ผู้รับบริการขอยกเลิกเองผ่านระบบ"
        ถ้าศูนย์อยู่ในสถานะ CLOSING: หลัง cancel จะ trigger auto-close job (ปิดศูนย์เป็น INACTIVE เมื่อไม่มีคิว CONFIRMED เหลือ)
      operationId: patientCancelAppointment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: เหตุผลการยกเลิก (ถ้าไม่ระบุจะใช้ "ผู้รับบริการขอยกเลิกเองผ่านระบบ")
      responses:
        "200":
          description: ยกเลิกสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ยกเลิกการจองคิวเรียบร้อยแล้ว"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Service ID
    CenterServiceConfigId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: |
        รหัสแถวตั้งค่าของศูนย์ (health_center_service) ไม่ใช่รหัสบริการในรายการกลาง
        ได้จาก config_id ในรายการบริการของศูนย์
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Appointment ID
    HealthCenterIdFilter:
      name: health_center_id
      in: query
      required: false
      schema:
        type: integer
      description: กรองตาม ศูนย์สุขภาพ (SUPER_ADMIN เท่านั้น — role อื่นถูกจำกัดที่ ศูนย์สุขภาพ ของตัวเองโดยอัตโนมัติ)
    HealthCenterIdRequired:
      name: health_center_id
      in: query
      required: false
      schema:
        type: integer
      description: |
        ศูนย์เป้าหมายของคำสั่งนี้
        - SUPER_ADMIN: **ต้องระบุ** — ไม่ส่ง = 422, ศูนย์ไม่มีอยู่ = 404
        - HEALTH_CENTER_ADMIN: ไม่ต้องส่ง และค่าที่ส่งมาจะถูกบังคับเป็นศูนย์ตนเอง

  responses:
    Unauthorized:
      description: ไม่ได้ยืนยันตัวตน (Unauthenticated)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Unauthorized"
    ValidationError:
      description: ข้อมูลไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "The given data was invalid."
            errors:
              username:
                - "ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง"
    Forbidden:
      description: ไม่มีสิทธิ์เข้าถึง (Forbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Forbidden"
    NotFound:
      description: ไม่พบข้อมูลที่ร้องขอ (Not Found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Not Found"

  schemas:
    # ---- Generic ----
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      description: Meta แบบ custom ของ /v1/patient/appointments (มีแค่ 4 key — ไม่มี links/first_page_url ฯลฯ)
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    LaravelPaginator:
      type: object
      description: "โครงสร้าง standard Laravel LengthAwarePaginator (ใช้ในหน้า admin: users/patients/health-centers)"
      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          description: รายการลิงก์หน้าต่าง ๆ (label ภาษาไทยจากตาราง, {url,label,active})
          items:
            $ref: "#/components/schemas/PaginatorLink"
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
          description: URL ฐานของรายการนี้
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    PaginatorLink:
      type: object
      properties:
        url:
          type: string
          nullable: true
        label:
          type: string
          description: "ข้อความปุ่ม (เช่น &laquo; Previous, 1, 2, 3, Next &raquo;) — label แปลตาม locale app"
        active:
          type: boolean

    PaginatedUsers:
      type: object
      description: ผลลัพธ์แบบ standard Laravel paginator (admin users list)
      allOf:
        - $ref: "#/components/schemas/LaravelPaginator"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UserResource"

    PaginatedPatients:
      type: object
      description: ผลลัพธ์แบบ standard Laravel paginator (admin patients list)
      allOf:
        - $ref: "#/components/schemas/LaravelPaginator"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/StaffPatientResource"

    PaginatedHealthCenters:
      type: object
      description: ผลลัพธ์แบบ standard Laravel paginator (admin health-centers list)
      allOf:
        - $ref: "#/components/schemas/LaravelPaginator"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/StaffHealthCenterResource"

    StaffPatientResource:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        cid:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        birth_date:
          type: string
        gender:
          type: string
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        patient_rights:
          type: array
          description: |
            สิทธิการรักษาที่ผู้รับบริการมี ใช้เติมฟอร์มนัดหมายเดินเข้ารับบริการที่หน้าเคาน์เตอร์
            คืนทุกรายการ ไม่ใช่เฉพาะสิทธิหลัก เพื่อให้ผู้ดูแลศูนย์เลือกได้
          items:
            $ref: "#/components/schemas/PatientRight"
        created_at:
          type: string

    StaffHealthCenterResource:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        phone_number:
          type: string
          nullable: true
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: string
        has_webhook:
          type: boolean

    # ---- Staff ----
    StaffUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [STAFF, HEALTH_CENTER_ADMIN, SUPER_ADMIN]
        health_center:
          type: object
          nullable: true
          description: ศูนย์สุขภาพ ต้นสังกัด (null สำหรับ SUPER_ADMIN กลาง)
          properties:
            id:
              type: integer
            name:
              type: string
            code:
              type: string

    StaffResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        health_center:
          allOf:
            - $ref: "#/components/schemas/HealthCenter"
            - type: object
              nullable: true
          description: ศูนย์สุขภาพ ต้นสังกัด (null สำหรับ SUPER_ADMIN กลาง)
        roles:
          type: array
          items:
            type: string

    StaffMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]
        effective_status:
          type: string
          nullable: true
          enum: [ACTIVE, LEAVE]
          description: สถานะจริง ณ วันที่ระบุ (เฉพาะเมื่อส่ง query param ?date=) — cross-reference กับ staff_leaves
        category:
          $ref: "#/components/schemas/Category"
        health_center:
          $ref: "#/components/schemas/HealthCenter"
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string

    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
          description: จำนวนคิวทั้งหมด
        waiting:
          type: integer
          description: รอรับบริการ (CONFIRMED)
        completed:
          type: integer
          description: เสร็จแล้ว (COMPLETED)
        cancelled:
          type: integer
          description: ยกเลิก (CANCELLED)
        no_show:
          type: integer
          description: ไม่มา (NO_SHOW)

    # ---- Patient ----
    PatientProfile:
      type: object
      properties:
        id:
          type: integer
        masked_cid:
          type: string
          example: "1-****-*****-23"
          description: เลขบัตรที่ซ่อน (รูปแบบ 1-****-*****-xx)
        masked_name:
          type: string
          example: "สม*** ใจ***"
          description: ชื่อที่ซ่อน (อักขระ 2 ตัวแรก + *** ของชื่อและนามสกุล)
        masked_phone:
          type: string
          example: "081-***-5678"
          description: เบอร์โทรที่ซ่อน (รูปแบบ xxx-***-xxxx)
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        rights:
          type: array
          items:
            $ref: "#/components/schemas/PatientRight"

    PatientRight:
      type: object
      properties:
        id:
          type: integer
        right_type:
          $ref: "#/components/schemas/RightType"
        main_hospital_name:
          type: string
          nullable: true
        is_primary:
          type: boolean
          description: สิทธิหลักของผู้รับบริการหนึ่งคนมีได้เพียงรายการเดียว (ฐานข้อมูลบังคับด้วย unique index)
        card_number:
          type: string
          nullable: true
        expire_date:
          type: string
          format: date
          nullable: true

    RightType:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: "SSS"
        name:
          type: string
          example: "ประกันสังคม"
        description:
          type: string
          nullable: true

    UnmaskedPatient:
      type: object
      description: ข้อมูลจริงของผู้รับบริการ (endpoint มี audit log — UNMASK_PATIENT_DATA)
      properties:
        id:
          type: integer
        cid:
          type: string
          description: เลขบัตร 13 หลัก
          example: "1234567890123"
        full_name:
          type: string
          description: ชื่อ-นามสกุลเต็ม (first_name last_name)
          example: "สมชาย ใจดี"
        phone_number:
          type: string
          example: "0812345678"
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        address:
          type: string
          description: ที่อยู่เต็ม (full_address)
        rights:
          type: array
          description: สิทธิการรักษาของผู้รับบริการ (โหลด right_type ด้วย)
          items:
            $ref: "#/components/schemas/PatientRight"

    PatientContactUpdate:
      type: object
      description: ผลลัพธ์การแก้ไขเบอร์โทรผู้รับบริการ
      properties:
        id:
          type: integer
        full_name:
          type: string
          example: "สมชาย ใจดี"
        phone_number:
          type: string
          example: "0899999999"

    PatientLoginSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        is_registered:
          type: boolean
          example: true
        token:
          type: string
          nullable: false
        patient:
          type: object
          properties:
            id:
              type: integer
            masked_name:
              type: string
            masked_phone:
              type: string

    PatientLoginNotRegistered:
      type: object
      properties:
        success:
          type: boolean
          example: true
        is_registered:
          type: boolean
          example: false
        message:
          type: string
          example: "ไม่พบประวัติผู้รับบริการ กรุณาลงทะเบียนใหม่"
        token:
          type: string
          nullable: true
        patient:
          type: object
          nullable: true

    # ---- Services ----
    PatientServiceBrief:
      type: object
      description: |
        บริการที่ศูนย์หนึ่งแห่งให้บริการจริง
        (response ของ GET /v1/patient/health-centers/{id}/services)
        - ระบบส่งเฉพาะบริการที่ศูนย์เปิดอยู่ **และ** มีช่วงเวลาเปิดอย่างน้อยหนึ่งช่วง
          และอยู่ในหมวดหมู่ที่เปิดใช้งาน
        - ค่าของศูนย์ไม่ได้อยู่แบนรวมกับบริการ แต่อยู่ใต้คีย์ `center_service`
        - คืนชื่อบุคลากรที่ดูแลและที่ผู้รับบริการเลือกได้ พร้อมกัน
          หน้าจอจองจึงแสดงได้ว่าใครอยู่เวรโดยไม่ต้องเรียกอีก endpoint
        - ไม่มี created_at / updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/Category"
        center_service:
          $ref: "#/components/schemas/HealthCenterService"

    Service:
      type: object
      description: |
        บริการในรายการกลาง — ตัวบริการมีเท่านี้ หมวดหมู่ ชื่อ คำอธิบาย
        โควตา วันให้บริการ ผู้รับผิดชอบ บุคลากรที่ผู้รับบริการเลือกได้
        และสถานะเปิด/ปิด เป็นค่าของศูนย์ ไม่ใช่ค่าของบริการ
        จึงไม่มีใน schema นี้ — ดู HealthCenterService ที่มาจากแถวตั้งค่าของศูนย์
      properties:
        id:
          type: integer
        name:
          type: string
          example: "ตรวจสุขภาพทั่วไป"
        description:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/Category"

    HealthCenterService:
      type: object
      description: |
        แถวตั้งค่าของศูนย์หนึ่งแห่งสำหรับบริการหนึ่ง — ค่าทั้งหมดใน schema นี้เป็นของศูนย์
        บริการหนึ่งบริการถูกหลายศูนย์เปิดใช้พร้อมกันได้ แต่ละศูนย์ตั้งค่าของตัวเอง
        - คืนจากการเปิด/แก้ไข/อ่านรายการของศูนย์ และฝังอยู่ใต้คีย์ `service`
          ของนัดหมาย (เฉพาะสามคีย์ capacity_type, allow_staff_selection, is_active)
        - **ค่าบนนัดหมายเก่าเป็นค่าปัจจุบันของศูนย์ ไม่ใช่ค่าที่ใช้ตอนจอง**
          เพราะระบบไม่ได้เก็บภาพค่าไว้ ณ วันที่จอง หน้าจอที่กำลังดูนัดหมายเก่า
          ถามว่า "ที่ศูนย์นี้เป็นอย่างไร" ไม่ใช่ "ตอนจองเป็นอย่างไร"
      properties:
        config_id:
          type: integer
          description: รหัสแถวตั้งค่านี้ ใช้กับ PATCH /v1/staff/health-center-services/{id} และ toggle-status
        id:
          type: integer
          description: รหัสแถวตั้งค่า (รูปแบบเต็มของแถว ใช้ใน response ฝั่งผู้รับบริการ)
        health_center_id:
          type: integer
          description: ศูนย์เจ้าของแถวตั้งค่านี้
        service_id:
          type: integer
          description: บริการในรายการกลางที่แถวนี้ตั้งค่าให้
        is_configured:
          type: boolean
          description: ตั้งค่าครบจนเปิดให้บริการได้หรือยัง — ดู ActivateCenterServiceRequest
        is_active:
          type: boolean
          description: ศูนย์นี้เปิดให้บริการได้อยู่หรือไม่
        capacity_type:
          type: string
          enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
          nullable: true
          description: วิธีนับโควตา
        allow_staff_selection:
          type: boolean
          description: เปิดให้ผู้รับบริการเลือกบุคลากรเองหรือไม่ — เปิดได้เฉพาะ capacity_type = PER_MASSEUSE
        max_per_slot:
          type: integer
          nullable: true
          description: โควตาสูงสุดต่อช่วงเวลา (ใช้เมื่อ capacity_type = PER_SLOT)
        max_per_day:
          type: integer
          nullable: true
          description: โควตาสูงสุดต่อวัน (ใช้เมื่อ capacity_type = PER_DAY)
        time_slots:
          type: array
          description: ช่วงเวลาที่ศูนย์นี้เปิดให้บริการ พร้อมวันในสัปดาห์ต่อช่วง
          items:
            $ref: "#/components/schemas/ServiceTimeSlotDayOutput"
        assigned_staff:
          type: array
          description: |
            บัญชีเจ้าหน้าที่ปฏิบัติงานที่ได้รับมอบหมายให้ดูแลบริการนี้ที่ศูนย์นี้
            กำหนดว่าใครเห็นและจัดการคิวของบริการนี้ได้
          items:
            $ref: "#/components/schemas/StaffSummary"
        selectable_staff:
          type: array
          description: |
            บุคลากรที่ผู้รับบริการเลือกได้เมื่อเปิด allow_staff_selection
            ต้องมีอย่างน้อย 1 คน ไม่งั้นแถวนี้จะไม่นับว่าตั้งค่าครบ
          items:
            $ref: "#/components/schemas/SelectableStaffWithStatus"

    CenterService:
      allOf:
        - $ref: "#/components/schemas/Service"
        - $ref: "#/components/schemas/HealthCenterService"
      description: |
        บริการในรายการกลางที่ทับด้วยค่าตั้งของศูนย์หนึ่งแห่ง
        (GET /v1/staff/health-centers/{id}/services)
        บริการที่ศูนย์ยังไม่ได้ตั้งค่า จะมีแต่ส่วนของ Service — ไม่มีคีย์ค่าของศูนย์เลย
        เพราะผู้ดูแลศูนย์ต้องเห็นบริการที่ยังเลือกเปิดได้

    CatalogService:
      allOf:
        - $ref: "#/components/schemas/Service"
        - $ref: "#/components/schemas/HealthCenterService"
        - type: object
          properties:
            centers:
              type: array
              description: |
                ศูนย์ที่เปิดบริการนี้ไว้ทั้งจังหวัด
                คืนเสมอทุกรายการในรายการกลาง ไม่ว่าจะกรองด้วย health_center_id หรือไม่
                เพราะผู้ดูแลระบบดูแลทุกศูนย์ จึงต้องรู้ว่าบริการนี้ถูกเปิดที่ศูนย์ไหนบ้าง
              items:
                $ref: "#/components/schemas/CenterOffering"
      description: |
        บริการในรายการกลาง (GET /v1/staff/admin/services)
        ถ้าไม่ระบุ health_center_id จะไม่มีคีย์ค่าของศูนย์ใด ๆ
        มีแต่ `centers[]` ที่บอกว่าศูนย์ไหนเปิดอยู่และตั้งค่าครบแค่ไหน

    CenterOffering:
      type: object
      description: สรุปว่าศูนย์หนึ่งแห่งเปิดบริการนี้ไว้ในสถานะใด
      properties:
        health_center_id:
          type: integer
        health_center_name:
          type: string
          nullable: true
        health_center_code:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_configured:
          type: boolean
          description: ศูนย์นั้นตั้งค่าครบจนเปิดให้บริการได้หรือยัง

    SelectableStaffWithStatus:
      type: object
      description: บุคลากรที่ผู้รับบริการเลือกได้ พร้อมสถานะ (ใน HealthCenterService.selectable_staff)
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]

    StaffSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "แพทย์แผนไทย"
        icon:
          type: string
          nullable: true
        sort_order:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    TimeSlot:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
          example: "08:30 - 09:30 น."
        start_time:
          type: string
          example: "08:30:00"
        end_time:
          type: string
          example: "09:30:00"
        sort_order:
          type: integer
          description: ลำดับการเรียง (คำนวณจากนาทีของ start_time)
        is_active:
          type: boolean
          description: สถานะเปิด/ปิดใช้งานช่วงเวลานี้
        health_center:
          allOf:
            - $ref: "#/components/schemas/HealthCenter"
          description: |
            ศูนย์เจ้าของช่วงเวลา — คืนเฉพาะ endpoint รายการช่วงเวลาของผู้ดูแล เท่านั้น
            ที่อื่นที่ฝัง time_slot (เช่น นัดหมายของผู้รับบริการ) จะไม่มี field นี้

    AvailableSlot:
      type: object
      properties:
        time_slot_id:
          type: integer
        time_label:
          type: string
          example: "08:00-09:00"
        start_time:
          type: string
        end_time:
          type: string
        max_capacity:
          type: integer
          description: จำนวนคิวสูงสุดตาม capacity_type
        available_count:
          type: integer
          description: จำนวนคิวที่เหลือ
        is_full:
          type: boolean
        staff:
          type: array
          nullable: true
          description: รายละเอียดรายหมอต่อรอบเวลา (มีเฉพาะเมื่อบริการ allow_staff_selection=true) — แต่ละหมอรองรับ 1 คิวต่อรอบ
          items:
            type: object
            properties:
              staff_id:
                type: integer
              name:
                type: string
              position:
                type: string
                nullable: true
              available:
                type: boolean
                description: หมอคนนี้ยังว่างในรอบเวลานี้หรือไม่

    # ---- Appointment ----
    Appointment:
      type: object
      properties:
        id:
          type: integer
        queue_no:
          type: string
          description: หมายเลขคิว (รูปแบบ Q-xxx เช่น Q-007)
          example: "Q-007"
        appointment_number:
          type: integer
          description: ลำดับคิวในวันนั้น
        status:
          type: string
          enum: [CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
        booked_by_type:
          type: string
          enum: [SELF, STAFF]
          description: วิธีการจอง (SELF = ผู้รับบริการจองเอง / STAFF = เจ้าหน้าที่ออกคิว walk-in ให้)
        appointment_date:
          type: string
          format: date
        cancellation_reason:
          type: string
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        health_center:
          $ref: "#/components/schemas/HealthCenter"
        service:
          allOf:
            - $ref: "#/components/schemas/Service"
            - type: object
              description: |
                บริการพร้อมค่าของศูนย์ที่นัดหมายนั้นอยู่ ซึ่งทับลงบนข้อมูลตัวบริการ
                ค่าทั้งสามเป็น **ค่าปัจจุบันของศูนย์ ไม่ใช่ค่าที่ใช้ตอนจอง**
                เพราะระบบไม่ได้เก็บภาพค่าไว้ ณ วันที่จอง
                หน้าจอที่ดูนัดหมายเก่าจึงเห็นโควตาและสวิตช์ของวันนี้ของศูนย์
                ไม่ใช่ของวันที่จอง
                คีย์เหล่านี้จะไม่ปรากฏ ถ้าจุดเรียกนั้นไม่ได้ขอค่าของศูนย์มาด้วย
              properties:
                capacity_type:
                  type: string
                  enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
                  nullable: true
                allow_staff_selection:
                  type: boolean
                is_active:
                  type: boolean
                  description: ศูนย์นี้ยังเปิดให้บริการนี้อยู่หรือไม่
        time_slot:
          $ref: "#/components/schemas/TimeSlot"
        staff:
          type: object
          nullable: true
          description: หมอ/เจ้าหน้าที่ที่รับผิดชอบคิวนี้ (null = ระบบจัดสรรอัตโนมัติ)
          properties:
            id:
              type: integer
            name:
              type: string
            position:
              type: string
              nullable: true
        patient:
          type: object
          properties:
            id:
              type: integer
            masked_name:
              type: string
            masked_phone:
              type: string
        patient_right:
          $ref: "#/components/schemas/PatientRight"

    BookingResult:
      type: object
      properties:
        appointment_id:
          type: integer
        queue_no:
          type: string
          example: "Q-001"
        health_center:
          type: string
          example: "ศูนย์สุขภาพ บ้านดงแสน"
        service_name:
          type: string
          example: "ตรวจสุขภาพทั่วไป"
        appointment_date:
          type: string
          format: date
        time_slot:
          type: string
          example: "08:00-09:00"
        staff:
          type: object
          nullable: true
          description: หมอ/เจ้าหน้าที่ที่เลือก (null = ระบบจัดสรรอัตโนมัติ)
          properties:
            id:
              type: integer
            name:
              type: string
            position:
              type: string
              nullable: true

    # ---- Health Center ----
    HealthCenter:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: "51010"
        name:
          type: string
          example: "ศูนย์สุขภาพ บ้านดงแสน"
        phone_number:
          type: string
          nullable: true
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum: [ACTIVE, CLOSING, INACTIVE]
          description: สถานะศูนย์ (ACTIVE เปิดรับจอง / CLOSING กำลังปิด / INACTIVE ปิดสมบูรณ์)

    HealthCenterDetail:
      type: object
      description: รายละเอียด ศูนย์สุขภาพ สำหรับหน้ารายละเอียด (ไม่รวม discord_webhook_url)
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        phone_number:
          type: string
          nullable: true
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum: [ACTIVE, CLOSING, INACTIVE]
          description: สถานะศูนย์ (ACTIVE / CLOSING — หน้าผู้รับบริการจะได้ 404 ถ้า INACTIVE)

    StaffHealthCenterDropdown:
      type: object
      description: รายการย่อสำหรับ dropdown (STAFF / HEALTH_CENTER_ADMIN — เฉพาะศูนย์ที่เปิดรับจอง ACTIVE หรือ CLOSING; ซ่อน INACTIVE)
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        has_webhook:
          type: boolean
          description: มี Discord Webhook ตั้งค่าแล้วหรือไม่
        status:
          type: string
          enum: [ACTIVE, CLOSING]
          description: สถานะศูนย์ (ผู้ใช้ทั่วไปเห็นได้เฉพาะ ACTIVE / CLOSING — INACTIVE ถูกซ่อน)

    UpdateHealthCenterRequest:
      type: object
      description: |
        Partial update — ส่งเฉพาะ field ที่ต้องการแก้ไข
        HEALTH_CENTER_ADMIN / SUPER_ADMIN เท่านั้น; `code` แก้ไขได้เฉพาะ SUPER_ADMIN
      properties:
        health_center_id:
          type: integer
          description: |
            ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุให้ตรงกับ id ใน path เสมอ)
            HEALTH_CENTER_ADMIN ไม่ต้องส่ง — ระบบใช้ ศูนย์สุขภาพ ของตัวเอง
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: รหัสสถานพยาบาล (เฉพาะ SUPER_ADMIN; ซ้ำกับศูนย์อื่น → 422)
        name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
      example:
        name: "ศูนย์สุขภาพท่าพระ"
        phone_number: "024111111"
        province: "กรุงเทพมหานคร"
        latitude: 13.7346
        longitude: 100.4871

    HealthCenterStatusToggle:
      type: object
      description: ผลการสลับสถานะศูนย์
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [ACTIVE, CLOSING, INACTIVE]
          description: สถานะใหม่ของศูนย์หลังสลับ

    NearbyCenter:
      allOf:
        - $ref: "#/components/schemas/HealthCenter"
        - type: object
          properties:
            distance_km:
              type: number
              format: double
              description: ระยะทางเป็นกิโลเมตร
            services:
              type: array
              items:
                $ref: "#/components/schemas/Service"

    # ---- Requests ----
    StoreCatalogServiceRequest:
      type: object
      required: [category_id, name]
      description: |
        เพิ่มบริการเข้ารายการกลาง — มีเฉพาะตัวบริการ
        ไม่มีช่องโควตา ช่วงเวลา ผู้รับผิดชอบ หรือบุคลากรที่เลือกได้
        เพราะทั้งหมดนั้นเป็นค่าของศูนย์ ตั้งตอนเปิดบริการให้ศูนย์หนึ่งแห่ง
      properties:
        category_id:
          type: integer
          description: ต้องมีอยู่จริง
        name:
          type: string
          maxLength: 255
          description: ชื่อบริการ — ต้องไม่ซ้ำทั้งระบบ (รวมชื่อที่เคยลบออกไปแล้ว)
        description:
          type: string
          nullable: true

    UpdateCatalogServiceRequest:
      type: object
      description: |
        แก้ไขบริการในรายการกลาง — ส่งเฉพาะช่องที่ต้องการเปลี่ยน
        ค่าที่เป็นของศูนย์แก้ที่นี่ไม่ได้
      properties:
        category_id:
          type: integer
        name:
          type: string
          maxLength: 255
          description: ชื่อบริการ — ต้องไม่ซ้ำทั้งระบบ (รวมชื่อที่เคยลบออกไปแล้ว)
        description:
          type: string
          nullable: true

    ActivateCenterServiceRequest:
      type: object
      required: [service_id, capacity_type, time_slots, assignee_ids]
      description: |
        เปิดบริการในรายการกลางให้ศูนย์หนึ่งแห่ง พร้อมตั้งค่าให้ครบในคำขอเดียว
        (POST /v1/staff/health-centers/{id}/services)

        **"ครบ" มีหกข้อ** ถ้าขาดข้อใดข้อหนึ่ง ระบบปฏิเสธทั้งคำขอ
        ไม่เหลือแถวตั้งค่าค้างไว้ และข้อความจะระบุรายการที่ขาดทั้งหมดพร้อมกัน:
        1. `capacity_type` — วิธีนับโควตา
        2. โควตาตัวเลข ถ้าวิธีที่เลือกต้องใช้ — `max_per_slot` เมื่อ PER_SLOT, `max_per_day` เมื่อ PER_DAY
        3. ถ้าเปิด `allow_staff_selection` ต้องเป็น PER_MASSEUSE
        4. ถ้าเปิด `allow_staff_selection` ต้องมี `selectable_staff_ids` อย่างน้อย 1 คน
        5. `time_slots` อย่างน้อย 1 ช่วง และแต่ละช่วงต้องมีวันอย่างน้อย 1 วัน
        6. `assignee_ids` อย่างน้อย 1 คน — ผู้รับผิดชอบบริการของศูนย์นี้
      properties:
        service_id:
          type: integer
          description: บริการในรายการกลางที่จะเปิด
        capacity_type:
          type: string
          enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
        max_per_slot:
          type: integer
          minimum: 1
          nullable: true
          description: บังคับเมื่อ capacity_type = PER_SLOT
        max_per_day:
          type: integer
          minimum: 1
          nullable: true
          description: บังคับเมื่อ capacity_type = PER_DAY
        allow_staff_selection:
          type: boolean
          default: false
          description: |
            เปิดให้ผู้รับบริการเลือกบุคลากรเอง — ได้เฉพาะ capacity_type = PER_MASSEUSE
            เพราะการเลือกบุคลากรจะกลายเป็นการสัญญาว่าจะให้บริการ
            โดยที่โควตาไม่ได้รับผลกระทบ
        selectable_staff_ids:
          type: array
          minItems: 1
          description: |
            บุคลากรที่ผู้รับบริการเลือกได้ — บังคับเมื่อ allow_staff_selection = true
            แต่ละคนต้องเป็นบุคลากรของศูนย์เดียวกัน และอยู่ในหมวดหมู่เดียวกับบริการ
          items:
            type: integer
        time_slots:
          type: array
          minItems: 1
          description: ช่วงเวลาที่ศูนย์นี้เปิดให้บริการ พร้อมวันในสัปดาห์ต่อช่วง
          items:
            $ref: "#/components/schemas/ServiceTimeSlotDayInput"
        assignee_ids:
          type: array
          minItems: 1
          description: |
            บัญชีเจ้าหน้าที่ที่ได้รับมอบหมายให้ดูแลบริการนี้
            แต่ละบัญชีต้องมีบทบาท STAFF และสังกัดศูนย์เดียวกัน
          items:
            type: integer

    UpdateCenterServiceConfigRequest:
      description: |
        แก้ไขค่าตั้งของบริการที่ศูนย์เปิดไว้ — ส่งเฉพาะช่องที่ต้องการเปลี่ยน
        (PATCH /v1/staff/health-center-services/{id})

        ใช้ชุดกติกาเดียวกับการเปิด แต่ทุกช่องเป็น "ถ้าส่งมา" ไม่ใช่ "ต้องส่ง"
        แถวที่เปิดอยู่ต้องยังให้บริการได้จริงหลังแก้ ค่าที่ขาดจะถูกปฏิเสธ
        พร้อมรายการที่ขาดทั้งหมด ส่วนแถวที่ปิดอยู่เก็บค่าตั้งค้างไว้ได้
      allOf:
        - $ref: "#/components/schemas/ActivateCenterServiceRequest"

    ServiceTimeSlotDayInput:
      type: object
      description: รายการ (ช่วงเวลา, วันเปิดให้บริการ) สำหรับเชื่อมบริการ
      required: [time_slot_id, days]
      properties:
        time_slot_id:
          type: integer
          description: ID ของช่วงเวลา (ต้องมีอยู่ในระบบ)
        days:
          type: array
          minItems: 1
          description: วันเปิดให้บริการรายสัปดาห์ (1=จันทร์ … 7=อาทิตย์)
          items:
            type: integer
            minimum: 1
            maximum: 7
          example: [1, 2, 3, 4, 5]

    ServiceTimeSlotDayOutput:
      type: object
      description: |
        ช่วงเวลาของศูนย์ใน **คำตอบ** — ตัวช่วงเวลาเต็มพร้อมวันในสัปดาห์
        รูปร่างมาจาก `TimeSlotResource` ตัวเดียวกับที่ใช้ที่อื่น แล้วเสริมด้วย `time_slot_id` และ `days`
        ต่างจาก `ServiceTimeSlotDayInput` ที่เป็นคำขอ (มีแค่ id กับวัน)
      required: [id, label, start_time, end_time, time_slot_id, days]
      properties:
        id:
          type: integer
          description: ID ของช่วงเวลา
        label:
          type: string
          description: ชื่อช่วงเวลาที่แสดงผล
          example: "09:00 - 09:30 น."
        start_time:
          type: string
          example: "09:00"
        end_time:
          type: string
          example: "09:30"
        sort_order:
          type: integer
          nullable: true
        is_active:
          type: boolean
        time_slot_id:
          type: integer
          description: ค่าเดียวกับ `id` — เก็บไว้ทั้งคู่เพื่อให้ผู้เรียกสลับคีย์ได้
        days:
          type: array
          description: วันในสัปดาห์ที่เปิดให้บริการ (1=วันจันทร์ … 7=วันอาทิตย์) ถอดจาก bitmask
          items:
            type: integer
            minimum: 1
            maximum: 7
          example: [1, 3, 5]

    StaffLeaveResource:
      type: object
      description: |
        บันทึกวันลา (StaffLeaveResource) — whitelist ฟิลด์เท่านั้น:
        ไม่ expose created_at / updated_at
      properties:
        id:
          type: integer
        leave_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        staff_user_id:
          type: integer
          description: ID ของผู้ใช้ (STAFF) ที่ลางาน
        health_center_id:
          type: integer
          description: ศูนย์สุขภาพ ต้นสังกัดของวันลา
        created_by:
          type: integer
          nullable: true
          description: ID ของผู้ใช้ที่สร้างบันทึกวันลา
        staff_user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            username:
              type: string

    StoreLeaveRequest:
      type: object
      required: [staff_user_id, leave_date]
      properties:
        health_center_id:
          type: integer
          description: ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุ)
        staff_user_id:
          type: integer
          description: ID เจ้าหน้าที่ (STAFF ลงให้ตัวเอง, HC_ADMIN ลงให้ลูกน้อง)
        leave_date:
          type: string
          format: date
          description: วันที่ลางาน (ต้อง >= วันนี้)
        reason:
          type: string
          maxLength: 500
          description: เหตุผล (ไม่บังคับ)

    ReassignStaffRequest:
      type: object
      required: [staff_id]
      properties:
        health_center_id:
          type: integer
          description: ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        staff_id:
          type: integer
          description: ID บุคลากรคนใหม่ (ต้องอยู่ในรายชื่อที่ศูนย์นั้นให้เลือก — health_center_service_staff)

    RescheduleAppointmentRequest:
      type: object
      required: [appointment_date, time_slot_id]
      properties:
        health_center_id:
          type: integer
          description: ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        appointment_date:
          type: string
          format: date
          description: วันที่ต้องการเลื่อนไป (ต้องไม่ย้อนหลังกว่าวันนี้)
          example: "2026-10-05"
        time_slot_id:
          type: integer
          description: ช่วงเวลาใหม่ (ต้องเป็นของศูนย์เดิม และต้องเปิดให้บริการในวันที่ระบุ)
        staff_id:
          type: integer
          nullable: true
          description: บุคลากรคนใหม่ — ไม่ส่ง = ใช้คนเดิม (ต้องผูกบริการ ไม่ลาวันนั้น และไม่เต็มรอบ)

    WalkInBookingRequest:
      type: object
      required: [cid, first_name, last_name, phone_number, birth_date, service_id, time_slot_id]
      properties:
        health_center_id:
          type: integer
          description: ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        cid:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9]{13}$"
          description: |
            เลขบัตรประชาชน 13 หลัก (ตัวเลขล้วน)
            ถ้าเป็นผู้รับบริการเดิม: ใช้เลขนี้ค้นหา และเบอร์โทรกับวันเกิดต้องตรงกับที่มีอยู่
            ไม่ตรง → 422 (เพราะอาจไม่ใช่คนเดียวกัน)
          example: "5100000000011"
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          pattern: "^[0-9]{10}$"
          description: |
            เบอร์โทรศัพท์ 10 หลัก
            ใช้คู่กับวันเกิดเป็นตัวยืนยันตัวตนของผู้รับบริการในการเข้าสู่ระบบครั้งถัดไป
          example: "0812345678"
        birth_date:
          type: string
          format: date
          description: วันเดือนปีเกิด ใช้ยืนยันตัวตนคู่กับเบอร์โทรศัพท์
          example: "1990-01-15"
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
        right_type_id:
          type: integer
          nullable: true
          description: |
            ID ของประเภทสิทธิการรักษา (ไม่บังคับ — หน้าเคาน์เตอร์ไม่ต้องถามทุกครั้ง)
            ต้องเป็นประเภทที่ status = ACTIVE (ประเภทที่ปิดแล้วใช้ไม่ได้ → 422)
            ไม่ส่ง → ผู้รับบริการเข้าจองได้ก่อน แต่นัดหมายจะไม่มีสิทธิการรักษาผูกไว้
            ผู้รับบริการใหม่: ระบบสร้างสิทธิหลักให้จากค่านี้
            ผู้รับบริการเดิมที่มีสิทธิหลักแล้ว: ใช้สิทธิหลักเดิม ไม่สร้างซ้ำ
            และค่าที่ส่งมาจะไม่ถูกใช้ (ดู patient_right_id ถ้าต้องการเลือกสิทธิเฉพาะรายการ)
        main_hospital_name:
          type: string
          maxLength: 255
          nullable: true
        service_id:
          type: integer
          description: ต้องเป็นบริการของ ศูนย์สุขภาพ ต้นสังกัด และต้องเปิดให้บริการในวันนัดหมาย
        time_slot_id:
          type: integer
          description: ต้องเป็น time slot ที่เชื่อมกับ service นี้ และต้องเป็นวันที่เปิดให้บริการ (อยู่ใน Operating Days) ของบริการ/ช่วงเวลานั้น — ตรวจด้วยวันที่จอง ไม่ใช่วันที่กด
        appointment_date:
          type: string
          format: date
          nullable: true
          description: |
            วันที่ที่ต้องการจอง — ไม่บังคับ
            ไม่ส่ง = วันนี้ (ผู้รับบริการมาถึงหน้าเคาน์เตอร์)
            ส่ง = จองล่วงหน้าให้ผู้รับบริการที่ไม่มีอุปกรณ์ แล้วพิมพ์ใบนัดให้เขา
            ต้องไม่ย้อนหลังกว่าวันนี้ → 422
            วันลาของบุคลากรก็ถูกตรวจด้วยวันนี้ ไม่ใช่วันที่กด
          example: "2026-10-05"
        staff_id:
          type: integer
          nullable: true
          description: |
            ID บุคลากรที่ให้บริการ (required เมื่อศูนย์เปิด allow_staff_selection)
            ต้องอยู่ในรายชื่อที่ศูนย์นั้นให้เลือก (health_center_service_staff) และต้อง ACTIVE ไม่ลา และยังไม่เต็ม
            ถ้าศูนย์ไม่ได้เปิดให้เลือกบุคลากร: ไม่ต้องส่ง และระบบจัดสรรให้เอง
        patient_right_id:
          type: integer
          nullable: true
          description: |
            ID ของสิทธิการรักษาที่ต้องการใช้ (ต้องเป็นของผู้รับบริการคนนี้)
            ไม่ส่ง → ใช้สิทธิหลักของผู้รับบริการ

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        health_center_id:
          type: integer
          description: ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
        status:
          type: string
          enum: [COMPLETED, CANCELLED, NO_SHOW]
        cancellation_reason:
          type: string
          maxLength: 500
          description: required when status = CANCELLED

    BookAppointmentRequest:
      type: object
      required: [service_id, health_center_id, time_slot_id, appointment_date]
      properties:
        service_id:
          type: integer
          description: ต้องเป็นบริการที่เปิดให้บริการในวันนัดหมาย (อยู่นอก Operating Days → 422)
        health_center_id:
          type: integer
          description: |
            ID ของศูนย์ที่จอง — **required**
            ช่วงเวลาและโควตาเป็นของศูนย์นั้น ไม่ใช่ของบริการ
            บริการในรายการกลางไม่มีศูนย์ในตัวเอง คำขอจึงต้องระบุเสมอ
            ไม่ระบุ → 422 "กรุณาระบุศูนย์สุขภาพ"
            ระบุศูนย์ที่ไม่ได้เปิดบริการนี้ → 422 "บริการนี้ยังไม่ได้เปิดให้บริการในศูนย์สุขภาพนี้"
        time_slot_id:
          type: integer
          description: ต้องเป็น time slot ที่เชื่อมกับบริการนี้ในศูนย์ที่ระบุ และต้องเป็นวันที่เปิดให้บริการของช่วงเวลานั้น
        appointment_date:
          type: string
          format: date
          description: ต้อง >= วันนี้ และต้องตรงกับวันเปิดให้บริการ (Operating Days) ของบริการ/ช่วงเวลา
        staff_id:
          type: integer
          nullable: true
          description: ID บุคลากรที่เลือก (required เมื่อศูนย์เปิด allow_staff_selection; ต้องอยู่ในรายชื่อที่ศูนย์นั้นให้เลือก)
        patient_right_id:
          type: integer
          nullable: true
          description: ID ของสิทธิ์การรักษา

    CreateStaffMemberRequest:
      type: object
      required: [user_id, name, status]
      properties:
        user_id:
          type: integer
          description: >
            บัญชีเจ้าของโปรไฟล์ ต้องยังไม่ถูกลบและยังไม่เคยมีโปรไฟล์บุคลากร
            ศูนย์สุขภาพของโปรไฟล์มาจากบัญชีนี้อัตโนมัติ
          example: 42
        category_id:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 255
        position:
          type: string
          maxLength: 100
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]

    UpdateDiscordWebhookRequest:
      type: object
      properties:
        health_center_id:
          type: integer
          description: ระบุ ศูนย์สุขภาพ ที่จะแก้ webhook (SUPER_ADMIN เท่านั้น)
        webhook_url:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^https://discord\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+$"
          description: |
            Discord Webhook URL
            - ใส่ URL เพื่อตั้งค่า
            - ส่ง null เพื่อลบ webhook
          example: "https://discord.com/api/webhooks/1234567890/abcdefg..."

    TimeSlotResource:
      type: object
      description: ข้อมูลช่วงเวลา (ใช้ใน response ของ time-slot endpoints) — resource ไม่คืน health_center_id
      properties:
        id:
          type: integer
        label:
          type: string
          example: "08:30 - 09:30 น."
        start_time:
          type: string
          example: "08:30:00"
        end_time:
          type: string
          example: "09:30:00"
        sort_order:
          type: integer
        is_active:
          type: boolean

    StoreTimeSlotRequest:
      type: object
      required: [health_center_id, start_time, end_time]
      properties:
        health_center_id:
          type: integer
          description: ศูนย์เป้าหมาย — จำเป็น (SUPER_ADMIN เท่านั้น) ไม่ส่ง = 422, ศูนย์ไม่มีอยู่ = 404
        start_time:
          type: string
          description: เวลาเริ่มต้น (HH:MM)
          example: "09:00"
        end_time:
          type: string
          description: เวลาสิ้นสุด (HH:MM, ต้องมากกว่า start_time)
          example: "10:00"
        is_active:
          type: boolean
          description: สร้างแล้วเปิดใช้หรือปิดใช้ทันที (ไม่ส่ง = เปิดใช้)

    UpdateTimeSlotRequest:
      type: object
      required: [health_center_id]
      properties:
        health_center_id:
          type: integer
          description: "ศูนย์เจ้าของช่วงเวลา (SUPER_ADMIN เท่านั้น) — ช่วงเวลาต้องเป็นของศูนย์นี้ ไม่ส่ง = 422, ต่างศูนย์ = 404"
        start_time:
          type: string
          description: เวลาเริ่มต้นใหม่ (HH:MM)
          example: "09:00"
        end_time:
          type: string
          description: เวลาสิ้นสุดใหม่ (HH:MM)
          example: "10:00"
        is_active:
          type: boolean
          description: เปิด/ปิดสถานะช่วงเวลา

    UserResource:
      type: object
      description: |
        ข้อมูลผู้ใช้ (AdminUserResource) — whitelist ไม่มี created_at / updated_at /
        ไม่ expose discord_webhook_url ของ ศูนย์สุขภาพ
        roles เป็น array ของชื่อ role (string)
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        health_center:
          allOf:
            - $ref: "#/components/schemas/HealthCenter"
            - type: object
              nullable: true
          description: ศูนย์สุขภาพ ต้นสังกัด (null สำหรับ SUPER_ADMIN กลาง)
        roles:
          type: array
          description: ชื่อ role ทั้งหมดของผู้ใช้ (pluck) — array ของ string
          items:
            type: string

    StoreUserRequest:
      type: object
      required: [name, username, password, role_ids, category_id]
      properties:
        health_center_id:
          type: integer
          description: >
            ID ศูนย์สุขภาพ — ต้องไม่ว่าง เพราะทุกบัญชีต้องมีโปรไฟล์บุคลากร
            และโปรไฟล์ต้องอยู่ในศูนย์ (ส่ง null = 422)
        name:
          type: string
          maxLength: 255
          description: ชื่อบุคลากร (ใช้สร้างโปรไฟล์บุคลากรพร้อมกัน)
        category_id:
          type: integer
          description: หมวดหมู่ของบุคลากร (ใช้สร้างโปรไฟล์บุคลากรพร้อมกัน)
        position:
          type: string
          maxLength: 100
          nullable: true
          description: ตำแหน่งของบุคลากร
        username:
          type: string
          maxLength: 50
          description: ต้องไม่ซ้ำ (รวมชื่อของบัญชีที่ soft delete แล้ว)
        email:
          type: string
          format: email
          nullable: true
        phone_number:
          type: string
          maxLength: 20
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
        role_ids:
          type: array
          minItems: 1
          items:
            type: integer
          description: >
            _ids ของ roles (1=SUPER_ADMIN, 2=HEALTH_CENTER_ADMIN, 3=STAFF)
            หนึ่งบัญชีถือได้หลายบทบาทพร้อมกัน — เช่น ผู้ดูแลศูนย์ที่ให้บริการเอง
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    UpdateUserRequest:
      type: object
      properties:
        health_center_id:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          nullable: true
        phone_number:
          type: string
          maxLength: 20
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          nullable: true
          description: ส่งค่าว่างเพื่อไม่แก้ไข
        role_ids:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    UpdatePatientContactRequest:
      type: object
      required: [phone_number]
      properties:
        phone_number:
          type: string
          pattern: "^[0-9]{10}$"
          example: "0899999999"
          description: เบอร์โทรใหม่ 10 หลัก (ต้องไม่ซ้ำกับผู้รับบริการท่านอื่น — ใช้เป็น credentials login)
        health_center_id:
          type: integer
          description: |
            ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
            STAFF / HEALTH_CENTER_ADMIN ไม่ต้องส่ง — ระบบใช้ ศูนย์สุขภาพ ของตัวเอง

    UpdatePatientProfileRequest:
      type: object
      description: |
        Partial update — ส่งเฉพาะ field ที่ต้องการแก้ไข
        (แก้ไขได้เฉพาะ HEALTH_CENTER_ADMIN / SUPER_ADMIN)
      properties:
        health_center_id:
          type: integer
          description: |
            ศูนย์สุขภาพ เป้าหมาย (SUPER_ADMIN ต้องระบุเสมอ)
            HEALTH_CENTER_ADMIN ไม่ต้องส่ง — ระบบใช้ ศูนย์สุขภาพ ของตัวเอง
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        cid:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9]{13}$"
          description: เลขบัตรประชาชน 13 หลัก (แก้ไขเฉพาะกรณีพิมพ์ผิด; ต้อง unique — ซ้ำกับผู้อื่น → 422)
        birth_date:
          type: string
          format: date
          example: "1990-01-15"
          description: ต้องเป็นวันในอดีต (ก่อนวันนี้)
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
      example:
        first_name: "สมชาย"
        last_name: "ใจดี"
        birth_date: "1990-01-15"
        gender: "MALE"
        subdistrict: "ท่าพระ"
        district: "บางกอกใหญ่"
        province: "กรุงเทพมหานคร"
        full_address: "99/1 ถนนจรัญสนิทวงศ์"
        cid: "1234567890123"

    StaffPatientProfile:
      type: object
      description: ข้อมูลผู้รับบริการแบบ unmask (ตอบกลับจาก endpoint ฝั่ง staff — เฉพาะผู้มีสิทธิ์)
      properties:
        id:
          type: integer
        cid:
          type: string
          example: "1234567890123"
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
          example: "สมชาย ใจดี"
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        phone_number:
          type: string
          example: "0812345678"
        subdistrict:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true

    PatientRegisterRequest:
      type: object
      required: [cid, first_name, last_name, phone_number, birth_date, right_type_id]
      properties:
        cid:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9]{13}$"
          description: เลขบัตรประชาชน 13 หลัก (unique)
          example: "1234567890123"
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          pattern: "^[0-9]{10}$"
          description: เบอร์โทร 10 หลัก (unique)
          example: "0812345678"
        birth_date:
          type: string
          format: date
          example: "1990-01-15"
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        subdistrict:
          type: string
          maxLength: 100
          nullable: true
        district:
          type: string
          maxLength: 100
          nullable: true
        province:
          type: string
          maxLength: 100
          nullable: true
        full_address:
          type: string
          nullable: true
        right_type_id:
          type: integer
          description: ID ของสิทธิ์การรักษา (ต้องมีอยู่ในระบบ)
        main_hospital_name:
          type: string
          maxLength: 255
          nullable: true
