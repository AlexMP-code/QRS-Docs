openapi: 3.0.3
info:
  title: QRS - Queue Reservation System API
  description: |
    ระบบจัดการคิวสำรองนัดหมาย รพ.สต. จ.ลำพูน
    Queue Reservation System for 71 Health Centers in Lamphun Province

    ## Authentication
    - **Staff**: Username + Password → Bearer Token (Sanctum)
    - **Patient**: Phone Number + Birth Date → Bearer Token (Sanctum)

    ## Role-Based Access
    - `SUPER_ADMIN` (role_id=1) — ผู้ดูแลระบบระดับจังหวัด จัดการทุกอย่างทุก รพ.สต. (cross-tenant)
    - `HEALTH_CENTER_ADMIN` (role_id=2) — ผู้ดูแล รพ.สต. จัดการข้อมูลของตัวเอง
    - `STAFF` (role_id=3) — เจ้าหน้าที่ห้องตรวจ จัดการคิว/นัดของตัวเอง
    - `patient` — ประชาชน / ผู้รับบริการ

    ## Rate Limiting
    - Staff login: 5 ครั้ง/30 นาที (ผิด 5 ครั้ง → ล็อกชั่วคราว 30 นาที)
    - Patient login: 10 req/min (key by เบอร์โทร)
    - Patient register: 5 req/min (key by IP)
    - Unmask patient data: 10 req/min (key by user)

    ## Role Tag Convention
    Tags ระบุ role ที่เข้าถึง endpoint นั้นได้:
    - `Public` — ไม่ต้อง login
    - `Staff (ทุกบทบาท)` — SUPER_ADMIN / HC_ADMIN / STAFF
    - `HEALTH_CENTER_ADMIN` — HC_ADMIN + SUPER_ADMIN (ข้ามศูนย์)
    - `SUPER_ADMIN` — SUPER_ADMIN เท่านั้น
    - `STAFF` — STAFF เท่านั้น
    - `Patient` — ผู้รับบริการ (login แล้ว)
  version: 1.0.0
  contact:
    name: QRS Team
  license:
    name: MIT

servers:
  - url: http://192.168.12.174:8000/api
    description: Local Development (e.g. Laravel Sail / docker compose)
  - url: https://qrs-api.lamphunpao.go.th/api
    description: Production (113.53.237.10)
    
security:
  - bearerAuth: []

tags:
  - name: Public
    description: |
      ไม่ต้องยืนยันตัวตน — login ของ staff/patient, ค้นหาบริการ/รพ.สต.
    x-roles: []
  - name: Staff (ทุกบทบาท)
    x-roles: [SUPER_ADMIN, HEALTH_CENTER_ADMIN, STAFF]
    description: |
      ทุก role ที่ login แล้ว — ข้อมูลส่วนตัว, dashboard, ดูรายการ, อัปเดตสถานะ
  - name: HEALTH_CENTER_ADMIN
    x-roles: [SUPER_ADMIN, HEALTH_CENTER_ADMIN]
    description: |
      จัดการข้อมูลศูนย์ — CRUD บริการ, มอบหมายเจ้าหน้าที่, จัดการเวร,
      ลงวันลาลูกน้อง, จัดการผู้ใช้ (SUPER_ADMIN ต้องระบุ health_center_id),
      ดูช่วงเวลาให้บริการ (Time Slots), ผูกหมอที่เลือกได้กับบริการ
      และเปิด/ปิดให้ผู้ป่วยเลือกหมอ (allow_staff_selection)
      รวมถึงย้ายคิวไปหมอคนอื่น (reassign-staff)
  - name: SUPER_ADMIN
    x-roles: [SUPER_ADMIN]
    description: |
      ข้ามศูนย์ — ตั้งค่า Discord Webhook, จัดการช่วงเวลาให้บริการ (CRUD Time Slots)
  - name: STAFF
    x-roles: [STAFF]
    description: |
      เจ้าหน้าที่ห้องตรวจ — ออกคิว Walk-in, ลงวันลาตัวเอง
  - name: Patient
    x-roles: [patient]
    description: |
      ประชาชน/ผู้รับบริการ — ลงทะเบียน, เข้าสู่ระบบ, ค้นหา, จองคิว, ยกเลิก,
      ดูรายชื่อหมอที่เลือกได้และจองคิวกับหมอที่ต้องการ (staff selection)

paths:

  # ══════════════════════════════════════════════════════════
  #  PUBLIC — ไม่ต้อง login
  # ══════════════════════════════════════════════════════════

  /v1/staff/login:
    post:
      tags: [Public]
      summary: เข้าสู่ระบบเจ้าหน้าที่
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  format: password
                  example: "password"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      token:
                        type: string
                        example: "1|abc123..."
                      user:
                        $ref: "#/components/schemas/StaffUser"
        "422":
          description: |
            ข้อมูลไม่ถูกต้อง — ระบุ username/password ไม่ครบ หรือ
            ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง
            (`{'username': ['ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง']}`)
        "403":
          description: |
            ไม่สามารถเข้าสู่ระบบได้ —
            ยังไม่ได้ผูกกับ รพ.สต. (ยกเว้น SUPER_ADMIN) หรือ
            รพ.สต. ของบัญชีมีสถานะไม่ใช่ ACTIVE
        "429":
          description: |
            พยายามเข้าสู่ระบบมากเกินไป (throttle:staff) —
            5 ครั้ง/30 นาที key by username+IP → ล็อกชั่วคราว 30 นาที
      security: []

  /v1/patient/login:
    post:
      tags: [Public]
      summary: เข้าสู่ระบบผู้รับบริการ
      description: |
        ใช้ เบอร์โทรศัพท์ + วันเกิด
        ถ้าไม่พบประวัติในระบบ → is_registered = false
        (token=null, patient=null, message="ไม่พบประวัติผู้รับบริการ กรุณาลงทะเบียนใหม่")
        ระบุวันเกิดผิด 5 ครั้ง → ระงับการล็อกอินของเบอร์นี้ 30 นาที (423)
        Throttle: 10 req/min key by เบอร์โทร
      operationId: patientLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, birth_date]
              properties:
                phone_number:
                  type: string
                  pattern: "^[0-9]{10}$"
                  example: "0812345678"
                birth_date:
                  type: string
                  format: date
                  example: "1990-01-15"
      responses:
        "200":
          description: |
            สำเร็จ — ถ้ามีบัญชีจะได้ token, ถ้าไม่มีจะได้ is_registered = false
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PatientLoginSuccess"
                  - $ref: "#/components/schemas/PatientLoginNotRegistered"
        "422":
          $ref: "#/components/responses/ValidationError"
        "423":
          description: |
            ล็อกชั่วคราว 30 นาที — ระบุวันเกิดผิด 5 ครั้งต่อเนื่อง
            (เฉพาะส่วนของการตรวจสอบวันเกิด)
        "429":
          description: Rate limit exceeded (10 req/min) — key by เบอร์โทร
      security: []

  /v1/patient/register:
    post:
      tags: [Public]
      summary: ลงทะเบียนผู้รับบริการใหม่
      operationId: patientRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegisterRequest"
      responses:
        "201":
          description: ลงทะเบียนสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลงทะเบียนสำเร็จ"
                      token:
                        type: string
                      patient:
                        type: object
                        properties:
                          id:
                            type: integer
                          masked_name:
                            type: string
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limit exceeded (5 req/min)
      security: []

  /v1/patient/categories:
    get:
      tags: [Public]
      summary: หมวดหมู่บริการทั้งหมด
      operationId: patientGetCategories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
      security: []

  /v1/patient/right-types:
    get:
      tags: [Public]
      summary: สิทธิการรักษาทั้งหมด (dropdown สำหรับลงทะเบียน)
      operationId: patientGetRightTypes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RightType"
      security: []

  /v1/patient/nearby-centers:
    post:
      tags: [Public]
      summary: ค้นหา รพ.สต. ใกล้เคียง
      description: คำนวณระยะทางด้วย Haversine formula
      operationId: patientSearchNearby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, category_id]
              properties:
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  example: 18.5895
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  example: 98.9833
                category_id:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      count:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/NearbyCenter"
        "422":
          $ref: "#/components/responses/ValidationError"
      security: []

  /v1/patient/health-centers/{id}:
    get:
      tags: [Public]
      summary: รายละเอียด รพ.สต. (ชื่อ, ที่อยู่, พิกัด)
      operationId: patientGetCenterDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Health Center ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthCenterDetail"
        "404":
          $ref: "#/components/responses/NotFound"
      security: []

  /v1/patient/health-centers/{id}/services:
    get:
      tags: [Public]
      summary: บริการทั้งหมดของ รพ.สต. (dropdown เลือกบริการ)
      operationId: patientGetCenterServices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Health Center ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        description: บริการฉบับย่อ (projection ของ Service — ไม่มี is_active/allow_staff_selection/staff lists)
                        items:
                          $ref: "#/components/schemas/PatientServiceBrief"
        "404":
          $ref: "#/components/responses/NotFound"
      security: []

  /v1/patient/available-slots:
    get:
      tags: [Public]
      summary: ดูช่วงเวลาว่างของบริการ
      description: |
        หากศูนย์ของบริการนั้นอยู่ในสถานะไม่รับการจองใหม่ (CLOSING / INACTIVE)
        จะคืนค่า `slots` เป็นอาร์เรย์ว่าง (200) — ไม่มีช่วงเวลาให้เลือกจอง
        - สำหรับบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true):
          แต่ละ slot จะคืน `staff[]` เฉพาะหมอที่ว่าง (ไม่ลา/ไม่เต็ม) ในรอบนั้น
        - ถ้าไม่เปิดให้เลือกหมอ: slot ว่าง = ยังมีโควตาเหลือ (หมอประจำ/มอบหมายไม่ลาทั้งหมด)
      operationId: patientAvailableSlots
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: integer
          description: ID ของบริการ (ต้อง active)
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: วันที่ต้องการจอง (ต้อง >= วันนี้)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      service_name:
                        type: string
                      capacity_type:
                        type: string
                        enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
                      date:
                        type: string
                        format: date
                      slots:
                        type: array
                        items:
                          $ref: "#/components/schemas/AvailableSlot"
        "422":
          $ref: "#/components/responses/ValidationError"
      security: []

  # ══════════════════════════════════════════════════════════
  #  STAFF (ทุกบทบาท) — login แล้วใช้ได้ทุก role
  # ══════════════════════════════════════════════════════════

  /v1/staff/me:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: ข้อมูลผู้ใช้ปัจจุบัน
      operationId: staffMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/StaffResource"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: แก้ไขโปรไฟล์ตัวเอง (ชื่อ / รหัสผ่าน)
      operationId: staffUpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                current_password:
                  type: string
                  description: จำเป็นถ้าต้องการเปลี่ยนรหัสผ่าน
                password:
                  type: string
                  minLength: 6
                password_confirmation:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "อัปเดตโปรไฟล์สำเร็จ"
                      user:
                        $ref: "#/components/schemas/StaffResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/logout:
    post:
      tags: [Staff (ทุกบทบาท)]
      summary: ออกจากระบบ
      operationId: staffLogout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ออกจากระบบเรียบร้อยแล้ว"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/dashboard/summary:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: สรุปภาพรวมประจำวัน
      description: จำนวนคิว waiting, completed, cancelled, no_show ของวันที่ระบุ
      operationId: staffDashboardSummary
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: "2026-08-21"
          description: วันที่ต้องการดู (ถ้าไม่ระบุ = วันนี้)
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      date:
                        type: string
                        format: date
                      summary:
                        $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/services:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายการบริการทั้งหมดของ รพ.สต.
      description: |
        ถ้าระบุ date → ซ่อนบริการที่ไม่มี staff ว่างวันนั้น
        (staff-selection → หมอที่เลือกได้ลาทั้งหมด; ปกติ → staff มอบหมายลาทั้งหมด)
      operationId: staffListServices
      parameters:
        - $ref: "#/components/parameters/HealthCenterIdFilter"
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: วันที่ต้องการตรวจ (ซ่อนบริการที่ไม่มี staff ว่างวันนั้น)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Staff (ทุกบทบาท)]
      summary: เพิ่มบริการใหม่
      operationId: staffCreateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เพิ่มบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/Service"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายการนัดหมายประจำวัน
      description: |
        รายการคิว/นัดของศูนย์ในวันนั้น เรียงตาม appointment_number ASC
        - STAFF: เห็นเฉพาะคิวของบริการที่ตัวเองถูกมอบหมาย (assignees) — ส่ง service_id นอกเหนือ → 403
        - HC_ADMIN/SUPER_ADMIN: เห็นทุกคิวของศูนย์ (SA ระบุ ?health_center_id)
        - กรองด้วย date / service_id / status
      operationId: staffListAppointments
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: วันที่ (default = วันนี้)
        - name: service_id
          in: query
          schema:
            type: integer
          description: กรองตามบริการ
        - name: status
          in: query
          schema:
            type: string
            enum: [CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
          description: กรองตามสถานะ
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      date:
                        type: string
                        format: date
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/status:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: เปลี่ยนสถานะนัดหมาย
      description: |
        State machine:
        - CONFIRMED → COMPLETED
        - CONFIRMED → CANCELLED
        - CONFIRMED → NO_SHOW
      operationId: staffUpdateAppointmentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                      data:
                        $ref: "#/components/schemas/Appointment"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/reassign-staff:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: ย้ายคิวไปหมอ/เจ้าหน้าที่คนอื่น
      description: |
        ใช้กรณีหมอคนเดิมติดภารกิจกะทันหัน — เฉพาะบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true)

        ข้อกำหนด (422 ถ้าไม่ผ่าน):
        - คิวต้องยังเป็นสถานะ CONFIRMED
        - หมอคนใหม่ต้องผูกกับบริการ (service_staff) และว่างวันนั้น (ไม่ลา)
        - หมอคนใหม่ยังไม่เต็มคิวในรอบเวลานั้น (โควตา 1 คิว/รอบ/คน)
        - ย้ายเป็นหมอคนเดิมซ้ำไม่ได้
        - ทุกการย้ายถูกบันทึก Audit Log (APPOINTMENT_STAFF_REASSIGN)
      operationId: staffReassignStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignStaffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ย้ายคิวไปเจ้าหน้าที่คนใหม่สำเร็จ"
                      data:
                        type: object
                        properties:
                          staff:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              position:
                                type: string
                                nullable: true
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/unmask:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    post:
      tags: [Staff (ทุกบทบาท)]
      summary: เปิดเผยข้อมูลผู้ป่วย (PDPA Audit)
      description: |
        เปิดเผยข้อมูลจริงของผู้ป่วย (CID, ชื่อ, เบอร์โทร)
        ทุกครั้งจะถูกบันทึกใน audit_logs (staff_id, ip, user_agent)
        Throttle: 10 req/min ต่อผู้ใช้ (throttle:unmask)
      operationId: staffUnmaskPatient
      responses:
        "200":
          description: OK — ข้อมูลผู้ป่วย
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      patient:
                        $ref: "#/components/schemas/UnmaskedPatient"
        "403":
          description: ไม่มีสิทธิ์ (นัดหมายไม่ใช่ของ รพ.สต. นี้)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /v1/staff/roster:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายชื่อบุคลากรทั้งหมด
      description: |
        ถ้าระบุ `?date=` จะเพิ่ม field `effective_status` ให้แต่ละคน
        (คิดจาก status จริง ร่วมกับตารางลา staff_leaves ของวันนั้น
        — ถ้ามีวันลาในวันนั้นจะได้ effective_status = LEAVE) ตามลำดับ sort_order
        scope: non-SA เห็นเฉพาะของศูนย์ตัวเอง, SA ระบุ ?health_center_id
      operationId: staffListRoster
      parameters:
        - $ref: "#/components/parameters/HealthCenterIdFilter"
        - name: date
          in: query
          schema:
            type: string
            format: date
          example: "2026-08-25"
          description: วันที่ต้องการดูสถานะ (optional)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Staff (ทุกบทบาท)]
      summary: เพิ่มบุคลากร
      operationId: staffCreateRoster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StaffMember"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/patients/{id}/contact:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Patient ID

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: แก้ไขเบอร์โทรศัพท์ผู้รับบริการ
      description: |
        เจ้าหน้าที่แก้ไขเบอร์โทรให้ผู้รับบริการ (เช่น กรณีปลดซิม / เปลี่ยนเบอร์ใหม่)

        ข้อกำหนด:
        - Patient ต้องมีประวัติคิวที่ รพ.สต. เป้าหมายอย่างน้อย 1 ครั้ง (tenant isolation)
        - STAFF / HC_ADMIN — ใช้ รพ.สต. ของตัวเองโดยอัตโนมัติ
        - SUPER_ADMIN — ต้องระบุ health_center_id ใน body เสมอ
        - เบอร์โทรคือ credentials สำหรับ login จึงต้องไม่ซ้ำกับผู้รับบริการท่านอื่น
        - ทุกการเปลี่ยนถูกบันทึก audit_logs (UPDATE_PATIENT_CONTACT — เก็บเบอร์เก่า/ใหม่แบบ masked)
      operationId: staffUpdatePatientContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientContactRequest"
      responses:
        "200":
          description: OK — ส่งเบอร์เดิมจะได้ message "เบอร์โทรศัพท์ไม่มีการเปลี่ยนแปลง"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขเบอร์โทรศัพท์ผู้รับบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/PatientContactUpdate"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Patient ID

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขข้อมูลผู้รับบริการแบบเต็มรูปแบบ (Name / DOB / gender / ที่อยู่ / CID)
      description: |
        แก้ไขข้อมูลผู้รับบริการเพื่อแก้ไขข้อมูลให้ถูกต้อง (เช่น พิมพ์เลขบัตร/ชื่อ/วันเกิดผิด)

        สิทธิ์:
        - HEALTH_CENTER_ADMIN / SUPER_ADMIN เท่านั้น (STAFF ได้ 403)
        - ป้องกันการแก้ไขเลขบัตรประชาชนซ้ำกับผู้รับบริการท่านอื่น (422)

        ข้อกำหนด:
        - เลือกแก้ไขได้เฉพาะ field ที่ส่ง (partial update) — ส่งเฉพาะ field ที่ต้องการเปลี่ยน
        - `cid` แก้ไขได้เฉพาะกรณีพิมพ์ผิด (13 หลัก, ต้อง unique)
        - `phone_number` ไม่สามารถแก้ไขผ่าน endpoint นี้ — ใช้ `PATCH /v1/staff/patients/{id}/contact` (เป็น credentials ในการ login)
        - HEALTH_CENTER_ADMIN — ผู้ป่วยต้องมีประวัติคิวที่ศูนย์ของตัวเองอย่างน้อย 1 ครั้ง (tenant isolation)
        - SUPER_ADMIN — ต้องระบุ health_center_id ใน body เสมอ
        - ทุกการแก้ไขถูกบันทึก audit_logs (UPDATE_PATIENT_PROFILE — เก็บค่าก่อน/หลังแบบ masked)
      operationId: staffUpdatePatientProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientProfileRequest"
      responses:
        "200":
          description: OK — คืนข้อมูลผู้ป่วยแบบ unmask ทุก field
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขข้อมูลผู้รับบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/StaffPatientProfile"
        "403":
          description: STAFF ไม่มีสิทธิ์
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/leaves:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายการวันลาของเจ้าหน้าที่
      operationId: staffListLeaves
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: กรองตามวันที่
        - name: staff_user_id
          in: query
          schema:
            type: integer
          description: กรองตามเจ้าหน้าที่
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StaffLeaveResource"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [HEALTH_CENTER_ADMIN, STAFF, SUPER_ADMIN]
      summary: ลงวันลา (auto-approved, idempotent)
      description: |
        HC_ADMIN: ลงให้เจ้าหน้าที่ในศูนย์ตัวเอง
        STAFF: ลงให้ตัวเองเท่านั้น
        SUPER_ADMIN: ลงให้ใครก็ได้ (ระบุ health_center_id ของศูนย์นั้น)
        ลงซ้ำวันเดิม → idempotent (ไม่ error; คืน 200 ถ้ามีอยู่แล้ว, 201 ถ้าเพิ่งสร้าง)
        Guard (422): ถ้าเจ้าหน้าที่คนนั้นมีคิว CONFIRMED ในวันลานั้น
        → "ไม่สามารถลงวันลาได้ เนื่องจากมีคิวที่จองไว้แล้ว N คิวในวันนี้"
      operationId: staffCreateLeave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLeaveRequest"
      responses:
        "201":
          description: ลงวันลาสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลงวันลาสำเร็จ"
                      data:
                        $ref: "#/components/schemas/StaffLeaveResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/leaves/availability:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: ตรวจว่าวันที่-บริการ มีเจ้าหน้าที่ว่างหรือไม่
      description: |
        ใช้เช็คก่อนเปิด Walk-in / จอง — คืน available: true/false
        - allow_staff_selection=true → true เมื่อมีหมอที่เลือกได้ (service_staff, ACTIVE, ไม่ลา) ≥ 1
        - allow_staff_selection=false → true เมื่อมี staff มอบหมาย (service_user) อย่างน้อย 1 คนไม่ลาวันนั้น
        - false = ไม่มี staff ว่างเลย (จะถูกปฏิเสธการจอง/Walk-in)
      operationId: staffCheckAvailability
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: integer
          description: ID บริการ
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: วันที่ต้องการตรวจ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      available:
                        type: boolean
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/leaves/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags: [HEALTH_CENTER_ADMIN, STAFF, SUPER_ADMIN]
      summary: ยกเลิกวันลา
      description: |
        HC_ADMIN: ยกเลิกได้เฉพาะวันลาในศูนย์ตัวเอง
        STAFF: ยกเลิกได้เฉพาะวันลาของตัวเอง
        SUPER_ADMIN: ยกเลิกของใครก็ได้ (ระบุ health_center_id)
      operationId: staffDeleteLeave
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ยกเลิกวันลาสำเร็จ"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  HEALTH_CENTER_ADMIN — จัดการข้อมูลศูนย์ (+ SUPER_ADMIN)
  # ══════════════════════════════════════════════════════════

  /v1/staff/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ServiceId"

    put:
      tags: [Staff (ทุกบทบาท)]
      summary: แก้ไขข้อมูลบริการ
      description: |
        ใช้แก้ไขชื่อ/หมวดหมู่/คำอธิบาย/ราคา/ระยะเวลา/เตือน/สถานะ
        และเปิด-ปิด allow_staff_selection
        - ถ้า allow_staff_selection = true ต้องมี selectable staff ที่ ACTIVE
          อย่างน้อย 1 คน (ที่ผูกผ่าน PUT /v1/staff/services/{id}/staff)
        - ถ้าเปลี่ยนจาก true → false แต่มีคิวที่เลือกหมอไว้แล้วจะถูกกันไว้ (block)
        STAFF: แก้ไขได้เฉพาะบริการในศูนย์ตัวเอง
      operationId: staffUpdateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขข้อมูลบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/Service"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [Staff (ทุกบทบาท)]
      summary: ลบบริการ (Soft Delete)
      description: |
        ลบได้เฉพาะบริการที่ไม่มีคิวสถานะ CONFIRMED ตั้งแต่วันนี้เป็นต้นไป
        (ถ้ามี → 422 "ไม่สามารถลบบริการได้ เนื่องจากมีคิวล่วงหน้าอยู่ N คิว")
        STAFF: ลบได้เฉพาะบริการในศูนย์ตัวเอง
      operationId: staffDeleteService
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลบบริการเรียบร้อยแล้ว"
        "422":
          description: มีคิวล่วงหน้าอยู่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/services/{id}/toggle-status:
    parameters:
      - $ref: "#/components/parameters/ServiceId"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: เปิด/ปิดสถานะบริการ
      operationId: staffToggleServiceStatus
      description: |
        สลับ is_active ของบริการ
        STAFF: เปิด/ปิดได้เฉพาะบริการในศูนย์ตัวเอง
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ปรับปรุงสถานะบริการสำเร็จ"
                      is_active:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/services/{id}/assignees:
    parameters:
      - $ref: "#/components/parameters/ServiceId"

    put:
      tags: [Staff (ทุกบทบาท)]
      summary: มอบหมาย/ถอดเจ้าหน้าที่ดูแลบริการ
      description: |
        HC_ADMIN: กำหนดเฉพาะศูนย์ตัวเอง / STAFF role เท่านั้น
        SUPER_ADMIN: ต้องระบุ health_center_id
        STAFF: แก้ได้เฉพาะบริการในศูนย์ตัวเอง (ส่วนใหญ่ใช้เพื่อดู/กันหมอ)
        ส่ง user_ids=[] เพื่อถอดมอบหมายทั้งหมด
      operationId: staffSyncAssignees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAssigneesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Service"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/services/{id}/time-slot-days:
    parameters:
      - $ref: "#/components/parameters/ServiceId"

    put:
      tags: [HEALTH_CENTER_ADMIN]
      summary: ตั้งค่าวันเปิดให้บริการ (Operating Days) รายช่วงเวลาของบริการ
      description: |
        กำหนดวันเปิดให้บริการรายสัปดาห์ (1=จันทร์ … 7=อาทิตย์) สำหรับแต่ละช่วงเวลาของบริการ (Full Replace)
        HC_ADMIN: แก้บริการในศูนย์ของตนเองเท่านั้น
        SUPER_ADMIN: ต้องระบุ health_center_id
        - บริการ/ช่วงเวลาจะถูกใช้จอง ดู Available Slots และ Walk-in ได้เฉพาะในวันที่เปิดให้บริการเท่านั้น
        - ต้องเหลืออย่างน้อย 1 (ช่วงเวลา, วัน) ที่เปิดให้บริการ (ปฏิเสธ 422 ถ้าทิ้งว่าง)
        - ไม่สามารถลบ (ช่วงเวลา, วัน) ที่มีนัด CONFIRMED ในอนาคตค้างอยู่ได้ (422)
        - ทุกการตั้งค่าถูกบันทึก Audit Log (SERVICE_TIME_SLOT_DAYS_SYNC)
      operationId: staffSyncServiceTimeSlotDays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncServiceTimeSlotDaysRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ตั้งค่าวันเปิดให้บริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/Service"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/services/{id}/staff:
    parameters:
      - $ref: "#/components/parameters/ServiceId"

    put:
      tags: [HEALTH_CENTER_ADMIN]
      summary: ผูกหมอ/เจ้าหน้าที่ที่เลือกได้เข้ากับบริการ (Selectable Staff)
      description: |
        กำหนดรายชื่อหมอที่ผู้ป่วยเลือกได้ ประจำบริการที่เปิด allow_staff_selection

        สิทธิ์: HEALTH_CENTER_ADMIN (ศูนย์ตัวเอง) / SUPER_ADMIN (ต้องระบุ health_center_id)

        ข้อกำหนด:
        - ส่ง staff_ids = [] เพื่อถอดทั้งหมด
        - แต่ละคนต้องเป็นบุคลากรของศูนย์เดียวกันกับบริการ และอยู่ในหมวดหมู่เดียวกับบริการ (422)
        - แกะหมอที่มีคิว CONFIRMED ในอนาคตค้างอยู่ไม่ได้ (422)
        - ทุกการตั้งค่าถูกบันทึก Audit Log (SERVICE_SELECTABLE_STAFF_SYNC)
      operationId: staffSyncServiceStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncServiceStaffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ผูกเจ้าหน้าที่ที่เลือกได้เข้ากับบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/Service"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/roster/{id}/toggle-duty:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: สลับสถานะเวร ACTIVE ↔ LEAVE
      description: |
        สลับสถานะเวรของบุคลากรในศูนย์
        - ไม่สามารถสลับได้ถ้าสถานะเป็น INACTIVE (422)
        - สลับเป็น LEAVE ไม่ได้ถ้ายังมีคิว CONFIRMED ของบุคลากรนี้อยู่ตั้งแต่วันนี้เป็นต้นไป (422)
        STAFF: สลับเวรได้เฉพาะในศูนย์ตัวเอง
      operationId: staffToggleDuty
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: string
                        enum: [ACTIVE, LEAVE]
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "ไม่สามารถสลับได้ — สถานะ INACTIVE หรือมีคิว CONFIRMED อยู่ในอนาคต (ตั้งแต่วันนี้ขึ้นไป)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/admin/users:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายชื่อผู้ใช้ (หน้า/กรอง) — SUPER_ADMIN ทุกศูนย์ / HC_ADMIN ศูนย์ตัวเอง
      description: |
        แสดงเฉพาะผู้ใช้ที่ยัง **ไม่ถูกลบ** (soft delete) — บัญชีที่ลบไปแล้วจะไม่ปรากฏในผลลัพธ์หรือการค้นหา
      operationId: adminListUsers
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: ค้นหาตามชื่อหรือ username
        - name: health_center_id
          in: query
          schema:
            type: integer
          description: กรองตาม รพ.สต.
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
          description: กรองตามสถานะบัญชีผู้ใช้
        - name: role_ids
          in: query
          schema:
            type: array
            items:
              type: integer
          description: กรองตาม role (SUPER_ADMIN ใช้ได้; HC_ADMIN ถูกจำกัดให้เห็นเฉพาะ role STAFF ตามเดิม)
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
          description: จำนวนต่อหน้า
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [id, name, username, status, created_at]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PaginatedUsers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [HEALTH_CENTER_ADMIN]
      summary: สร้างผู้ใช้ใหม่ (role_ids ได้เฉพาะ STAFF)
      description: |
        ทุกการสร้างสำเร็จถูกบันทึก audit_logs (`USER_CREATED` — username, name, health_center_id, role_ids)
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUserRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "สร้างผู้ใช้สำเร็จ"
                      data:
                        $ref: "#/components/schemas/UserResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขผู้ใช้ (role_ids ได้เฉพาะ STAFF)
      description: |
        HC_ADMIN: อัปเดตเฉพาะผู้ใช้ในศูนย์ตัวเอง, role_ids จำกัดเฉพาะ STAFF,
        ไม่สามารถแก้ไข SUPER_ADMIN หรือย้ายผู้ใช้ข้ามศูนย์ได้
        - แก้ไขบัญชีที่ถูกลบไปแล้ว (soft delete) → 404 "ไม่พบผู้ใช้ที่ระบุ"
        - ถอด role SUPER_ADMIN หรือตั้ง status = INACTIVE ให้ SUPER_ADMIN คนสุดท้ายที่ยัง ACTIVE → 422 "ไม่สามารถแก้ไขบัญชี SUPER_ADMIN คนสุดท้ายได้"
        - ทุกการแก้ไขสำเร็จถูกบันทึก audit_logs (`USER_UPDATED` — เก็บ name/status/role_ids ก่อน-หลัง)
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขผู้ใช้สำเร็จ"
                      data:
                        $ref: "#/components/schemas/UserResource"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      tags: [HEALTH_CENTER_ADMIN]
      summary: ลบผู้ใช้ (soft delete — ห้ามลบตัวเอง / SUPER_ADMIN / มีคิวอนาคต)
      description: |
        **Soft delete** — ผู้ใช้ถูกลบแบบ soft (ตั้ง `deleted_at`) และไม่มี endpoint กู้คืน:
        - บัญชีหายจากรายชื่อผู้ใช้ และ login ไม่ได้อีกต่อไป
        - บุคลากรใน roster ของบัญชีถูกตัดออก: `staff.user_id` → null, `staff.status` → INACTIVE (ยังอยู่ใน roster)
        - เลิกผูกบริการที่ผู้ป่วยเลือกได้ (`service_user`) และเพิกถอน token (Sanctum) ทั้งหมด
        - เก็บประวัติ `user_roles` / `staff_leaves` / `audit_logs` ไว้; username/email เดิมไม่ถูกนำมาใช้ซ้ำ

        Guard ที่ห้ามลบ (422):
        - ลบบัญชีของตนเอง → "ไม่สามารถลบบัญชีของตนเองได้"
        - ลบ SUPER_ADMIN คนสุดท้ายที่ยัง ACTIVE → "ไม่สามารถลบบัญชี SUPER_ADMIN คนสุดท้ายได้"
        - บัญชีมีคิว CONFIRMED ในอนาคต (วันนี้เป็นต้นไป) ผูกกับบุคลากรใน roster → "ไม่สามารถลบบัญชีผู้ใช้ได้ เนื่องจากมีคิวที่จองไว้แล้ว N คิว กรุณาจัดการคิวก่อน"
        - HC_ADMIN พยายามลบ SUPER_ADMIN → 403 "ไม่สามารถลบบัญชี Super Admin ได้"

        ทุกการลบสำเร็จถูกบันทึก audit_logs (`USER_DELETED` — username, name, health_center_id, staff_ids)
      operationId: adminDeleteUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลบผู้ใช้สำเร็จ"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "ไม่สามารถลบได้ต่อเมื่อ — ลบบัญชีของตนเอง / SUPER_ADMIN คนสุดท้ายที่ ACTIVE / มีคิว CONFIRMED อนาคตใน roster"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/admin/roles:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายชื่อ role ที่มองเห็น (dropdown สำหรับจัดการผู้ใช้)
      description: |
        เฉพาะ SUPER_ADMIN / HEALTH_CENTER_ADMIN เท่านั้น (STAFF เข้าไม่ได้ — 403)
        SUPER_ADMIN: เห็นทุก role (SUPER_ADMIN, HEALTH_CENTER_ADMIN, STAFF)
        HC_ADMIN: เห็นเฉพาะ STAFF
      operationId: adminListRoles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            display_name:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/admin/patients:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายชื่อผู้รับบริการ (ค้นหาเพื่อแก้ไข) — SUPER_ADMIN ทุกศูนย์ / HC_ADMIN ศูนย์ตัวเอง (มีประวัติคิว)
