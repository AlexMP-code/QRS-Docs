  /v1/staff/health-centers:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายชื่อ ศูนย์สุขภาพ (dropdown สำหรับ walk-in / จัดการผู้ใช้ / แก้ไขศูนย์) — role:STAFF,HEALTH_CENTER_ADMIN,SUPER_ADMIN
      description: |
        เฉพาะ staff token (STAFF / HC_ADMIN / SUPER_ADMIN) — Patient token → 403
        SUPER_ADMIN: เห็นทุกศูนย์ **แบบรายละเอียดเต็ม** (รวมถึงศูนย์ที่ปิดสมบูรณ์ INACTIVE) —ไม่ต้องส่ง health_center_id
        HC_ADMIN/STAFF: เห็นเฉพาะศูนย์ตัวเอง **แบบย่อ (dropdown)** — เห็นเฉพาะศูนย์ที่เปิดรับจอง (ACTIVE) หรืออยู่ระหว่างปิดรับจอง (CLOSING) เท่านั้น; ศูนย์ที่ปิดสมบูรณ์ (INACTIVE) จะถูกซ่อน
      operationId: staffListHealthCenters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        description: SUPER_ADMIN → HealthCenterDetail (ทุกศูนย์); อื่น ๆ → object ย่อ (dropdown)
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/StaffHealthCenterDropdown"
                            - $ref: "#/components/schemas/HealthCenterDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/health-centers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Health Center ID

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขข้อมูล ศูนย์สุขภาพ (ชื่อ, ที่อยู่, พิกัด / SUPER_ADMIN เพิ่มรหัสศูนย์)
      description: |
        แก้ไขข้อมูลศูนย์บริการสุขภาพแบบ full-profile (partial update — ส่งเฉพาะ field ที่ต้องการ)

        สิทธิ์:
        - HEALTH_CENTER_ADMIN: แก้ไขเฉพาะศูนย์ของตนเอง — ชื่อ, เบอร์โทร, ตำบล/อำเภอ/จังหวัด, ที่อยู่เต็ม, ละติจูด/ลองจิจูด
        - SUPER_ADMIN: แก้ไขศูนย์ใดก็ได้ และเพิ่มได้เฉพาะของตนเอง: รหัสศูนย์ `code`
        - `status` และ `discord_webhook_url` ไม่สามารถแก้ไขผ่าน endpoint นี้ (status → toggle-status; webhook → route แยกต่างหาก)

        ข้อกำหนด:
        - HEALTH_CENTER_ADMIN — ไม่ต้องส่ง health_center_id (ระบบใช้ศูนย์ของตัวเอง); ไม่ตรงกับ `{id}` → 404
        - SUPER_ADMIN — ต้องส่ง `health_center_id` ให้ตรงกับ `{id}` (ไม่ตรง → 404) และสามารถส่ง `code` ได้
        - การใช้ `code` ที่ซ้ำกับศูนย์อื่น → 422
        - ทุกการแก้ไขถูกบันทึก audit_logs (UPDATE_HEALTH_CENTER — เก็บค่าก่อน/หลัง เฉพาะ field ที่เปลี่ยน)
      operationId: staffUpdateHealthCenter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHealthCenterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขข้อมูลสถานพยาบาลสำเร็จ"
                      data:
                        $ref: "#/components/schemas/HealthCenterDetail"
        "403":
          description: STAFF ไม่มีสิทธิ์ / SUPER_ADMIN ส่ง code ผิดเงื่อนไข เป็นต้น
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  SUPER_ADMIN เท่านั้น — ข้ามศูนย์
  # ══════════════════════════════════════════════════════════

  /v1/staff/admin/health-centers/{id}/toggle-status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Health Center ID

    patch:
      tags: [SUPER_ADMIN]
      summary: สลับสถานะเปิด/ปิดรับการจองของศูนย์ (ACTIVE ↔ CLOSING / INACTIVE → ACTIVE)
      description: |
        ควบคุมสถานะเปิด/ปิดรับการจองของศูนย์บริการสุขภาพ (SUPER_ADMIN เท่านั้น)

        สถานะ 3 ระดับ:
        - ACTIVE: เปิดรับจอง
        - CLOSING: ปิดรับการจองใหม่ แต่ยังให้บริกร (เคลียร์คิวที่ค้าง) — ผู้รับบริการ/เจ้าหน้าที่ยังเห็นและจัดการคิวค้างได้
        - INACTIVE: ปิดสมบูรณ์ (ซ่อนจากผู้รับบริการ)

        ผลการสลับ (toggle):
        - ACTIVE → CLOSING (เริ่มปิดรับจอง)
        - CLOSING → ACTIVE (ยกเลิกการปิดรับจอง)
        - INACTIVE → ACTIVE (เปิดใหม่) — สถานะ INACTIVE จะถูกตั้งให้อัตโนมัติเท่านั้น เมื่อคิว CONFIRMED ทั้งหมดสิ้นสุด

        เงื่อนไข:
        - ต้องส่ง `health_center_id` ให้ตรงกับ `{id}` (ไม่ตรง → 404)
        - ในสถานะ CLOSING: บล็อกการจองใหม่ / Available Slots / Walk-in (422) แต่ยังดู/ยกเลิกคิวเดิมได้
        - ทุกการสลับถูกบันทึก audit_logs (UPDATE_HEALTH_CENTER_STATUS — เก็บจาก/เป็น)
      operationId: staffToggleHealthCenterStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health_center_id]
              properties:
                health_center_id:
                  type: integer
                  description: ต้องตรงกับ id ใน path เสมอ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เปิดให้บริการรับการจองแล้ว"
                      data:
                        $ref: "#/components/schemas/HealthCenterStatusToggle"
        "403":
          description: ไม่ใช่ SUPER_ADMIN
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/discord/webhook:
    patch:
      tags: [SUPER_ADMIN]
      summary: ตั้งค่า/ลบ Discord Webhook ของ ศูนย์สุขภาพ
      description: |
        ตั้งค่า Discord Webhook URL สำหรับรับแจ้งเตือนนัดหมายใหม่
        - ระบุ health_center_id เพื่อเลือก ศูนย์สุขภาพ ที่จะแก้ (cross-tenant)
        - ส่ง null เพื่อลบ webhook
      operationId: staffUpdateDiscordWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiscordWebhookRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ตั้งค่า Discord Webhook สำเร็จ"
                      data:
                        type: object
                        properties:
                          health_center:
                            type: string
                            example: "ศูนย์สุขภาพ บ้านดงแสน"
                          webhook_url_set:
                            type: boolean
                            description: true = มี webhook, false = ลบแล้ว
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  TIME SLOT MANAGEMENT — SUPER_ADMIN / HEALTH_CENTER_ADMIN
  # ══════════════════════════════════════════════════════════

  /v1/staff/admin/time-slots:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายการช่วงเวลาของศูนย์เดียว
      description: |
        ดึงรายการ time slots ของศูนย์ **หนึ่งศูนย์** (เรียงตามเวลาเริ่ม)
        - HC_ADMIN: เฉพาะศูนย์ของตนเอง ไม่ต้องส่ง health_center_id
        - SUPER_ADMIN: **ต้องระบุ health_center_id** — ไม่ส่ง = 422 "SUPER_ADMIN ต้องระบุ health_center_id", ศูนย์ไม่มีอยู่ = 404
        - ไม่มีการดูข้ามศูนย์ในคำขอเดียว — ผู้ดูแลระบบเลือกศูนย์จาก `GET /v1/staff/health-centers`
        - เฉพาะ SUPER_ADMIN / HEALTH_CENTER_ADMIN เท่านั้น (STAFF เข้าไม่ได้ — 403)
        - ทุกรายการมี `health_center` ของตัวเอง (เฉพาะ endpoint นี้ — ที่อื่นที่ฝัง time_slot เช่น นัดหมายของผู้รับบริการ จะไม่มี field นี้)
      operationId: staffListTimeSlots
      parameters:
        - $ref: "#/components/parameters/HealthCenterIdRequired"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TimeSlotResource"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [SUPER_ADMIN]
      summary: เพิ่มช่วงเวลาใหม่
      description: |
        เพิ่ม time slot ให้ศูนย์สุขภาพ (label และ sort_order คำนวณอัตโนมัติจาก start_time/end_time)
        - SUPER_ADMIN เท่านั้น
        - **ต้องระบุ health_center_id** — ไม่ส่ง = 422, ศูนย์ไม่มีอยู่ = 404
        - ห้าม start_time/end_time **ทับซ้อน** กับ slot ที่มีอยู่แล้วในศูนย์เดียวกัน (ตรวจการทับจริง — ช่วงที่ต่อกันพอดีเช่น 09:00-09:30 กับ 09:30-10:00 ไม่ถือว่าทับ; ทับกับ slot ของศูนย์อื่นได้)
        - ส่ง `is_active: false` เพื่อสร้างช่วงเวลาที่ปิดใช้งานตั้งแต่แรก (ไม่ส่ง = เปิดใช้งาน)
      operationId: staffCreateTimeSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTimeSlotRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เพิ่มช่วงเวลาสำเร็จ"
                      data:
                        $ref: "#/components/schemas/TimeSlotResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/admin/time-slots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Time Slot ID

    put:
      tags: [SUPER_ADMIN]
      summary: แก้ไขช่วงเวลา
      description: |
        แก้ไข time slot (start_time, end_time, is_active)
        - SUPER_ADMIN เท่านั้น
        - **ต้องระบุ health_center_id และ slot ต้องเป็นของศูนย์นั้น** — ไม่ส่ง = 422, ศูนย์ไม่มี = 404, slot ของศูนย์อื่น = 404
        - label และ sort_order จะถูกคำนวณใหม่ถ้าแก้ start/end time
        - ห้ามแก้ให้ **ทับซ้อน** กับ slot อื่นของศูนย์เดียวกัน (ตรวจการทับจริง) — แก้เป็นเวลาเดิมของตัวเองได้
      operationId: staffUpdateTimeSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeSlotRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขช่วงเวลาสำเร็จ"
                      data:
                        $ref: "#/components/schemas/TimeSlotResource"
        "404":
          description: ไม่พบช่วงเวลาของศูนย์ที่ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [SUPER_ADMIN]
      summary: ลบช่วงเวลา (ไม่รองรับ — ใช้ปิดใช้งานแทน)
      description: |
        **ไม่รองรับการลบช่วงเวลา** — endpoint นี้เก็บไว้เพื่อให้ client ที่ยังเรียกอยู่ได้รับคำแนะนำที่แก้ตามได้ แทนที่จะเจอ 405
        - ตอบ 422 **ทุกกรณี** ไม่ว่าจะมีนัดหมายอ้างอิงหรือไม่
        - เหตุผล: ช่วงเวลาถูกนัดหมายและถูกกำหนดวันให้บริการอ้างอิงอยู่ การลบจะทำให้ประวัตินัดหมายหาย หรือทำให้วันให้บริการหายโดยไม่เตือน (ADR-0001)
        - **วิธีที่ถูกต้อง: เรียก `PATCH /v1/staff/admin/time-slots/{id}/toggle-status`** — เมื่อปิด ช่วงเวลาจะหายจากผู้รับบริการทันที แต่วันให้บริการที่ตั้งไว้ยังอยู่ครบ และกลับมาใช้ทันทีเมื่อเปิดคืน
      operationId: staffDeleteTimeSlot
      responses:
        "422":
          description: "ไม่รองรับการลบช่วงเวลา — กรุณาเปลี่ยนสถานะเป็นปิดใช้งานแทน"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ไม่สามารถลบช่วงเวลาได้ กรุณาเปลี่ยนสถานะเป็นปิดใช้งานแทน"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/admin/time-slots/{id}/toggle-status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Time Slot ID

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: เปิด/ปิดสถานะช่วงเวลา
      description: |
        สลับ is_active ของ time slot (true ↔ false)
        - **นี่คือวิธีที่ถูกต้องแทนการลบช่วงเวลา** — เมื่อปิด ช่วงเวลาจะหายจากผู้รับบริการทันทีทุกบริการของศูนย์ แต่วันให้บริการที่ตั้งไว้กับช่วงเวลานี้ **ไม่ถูกลบ** และกลับมาใช้ทันทีเมื่อเปิดคืน
        - HC_ADMIN: เฉพาะศูนย์ของตนเอง (ข้ามศูนย์ไม่ได้ — 404)
        - SUPER_ADMIN: **ต้องระบุ health_center_id** — ไม่ส่ง = 422, ศูนย์ไม่มี = 404, slot ของศูนย์อื่น = 404
      operationId: staffToggleTimeSlotStatus
