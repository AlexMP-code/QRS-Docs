openapi: 3.0.3
info:
  title: QRS - Queue Reservation System API
  description: |
    ระบบจัดการคิวสำรองนัดหมาย ศูนย์สุขภาพ จ.ลำพูน
    Queue Reservation System for 71 Health Centers in Lamphun Province

    ## Authentication
    - **Staff**: Username + Password → Bearer Token (Sanctum)
    - **Patient**: Phone Number + Birth Date → Bearer Token (Sanctum)

    ## Role-Based Access
    - `SUPER_ADMIN` (role_id=1) — ผู้ดูแลระบบระดับจังหวัด จัดการทุกอย่างทุก ศูนย์สุขภาพ (cross-tenant)
      รวมถึงดูแลรายการบริการกลาง ซึ่งเป็นของทั้งจังหวัด ไม่สังกัดศูนย์ใดศูนย์หนึ่ง
    - `HEALTH_CENTER_ADMIN` (role_id=2) — ผู้ดูแล ศูนย์สุขภาพ จัดการข้อมูลของตัวเอง
    - `STAFF` (role_id=3) — เจ้าหน้าที่ห้องตรวจ จัดการคิว/นัดของตัวเอง
    - `patient` — ประชาชน / ผู้รับบริการ

    ## Rate Limiting
    - Staff login: 5 ครั้ง/30 นาที (key by username+IP) — **เฉพาะ response 401/403 เท่านั้นที่ถูกนับ (การกรอกรหัสผิดที่คืน 422 ไม่ถูกนับ — ต้องแก้ที่โค้ด ThrottleStaffLogin ให้นับ 422 ด้วย)**
    - Patient login: 10 req/min (key by เบอร์โทร)
    - Patient register: 5 req/min (key by IP)
    - Unmask patient data: 10 req/min (key by user)

    ## Role Tag Convention
    Tags ระบุ role ที่เข้าถึง endpoint นั้นได้:
    - `Public` — ไม่ต้อง login
    - `Staff (ทุกบทบาท)` — SUPER_ADMIN / HC_ADMIN / STAFF
    - `HEALTH_CENTER_ADMIN` — HC_ADMIN + SUPER_ADMIN (ข้ามศูนย์)
    - `SUPER_ADMIN` — SUPER_ADMIN เท่านั้น
    - `STAFF` — STAFF เท่านั้น
    - `Patient` — ผู้รับบริการ (login แล้ว)
  version: 1.0.0
  contact:
    name: QRS Team
  license:
    name: MIT

servers:
  - url: http://192.168.12.174:8000/api
    description: Local Development (e.g. Laravel Sail / docker compose)
  - url: https://qrs-api.lamphunpao.go.th/api
    description: Production (113.53.237.10)
    
security:
  - bearerAuth: []

tags:
  - name: Public
    description: |
      ไม่ต้องยืนยันตัวตน — login ของ staff/patient, ค้นหาบริการ/ศูนย์สุขภาพ
    x-roles: []
  - name: Staff (ทุกบทบาท)
    x-roles: [SUPER_ADMIN, HEALTH_CENTER_ADMIN, STAFF]
    description: |
      ทุก role ที่ login แล้ว — ข้อมูลส่วนตัว, dashboard, ดูรายการ, อัปเดตสถานะ
  - name: HEALTH_CENTER_ADMIN
    x-roles: [SUPER_ADMIN, HEALTH_CENTER_ADMIN]
    description: |
      จัดการข้อมูลศูนย์ — **ค่าตั้งบริการรายศูนย์** (เปิดให้บริการ แก้ค่าตั้ง ปิด/เปิด เอาออก),
      อ่านรายการบริการของศูนย์ตัวเอง (เจ้าหน้าที่ปฏิบัติงานอ่านได้อย่างเดียว),
      มอบหมายเจ้าหน้าที่, จัดการเวร, ลงวันลาลูกน้อง, จัดการผู้ใช้
      (SUPER_ADMIN ต้องระบุ health_center_id), ดูช่วงเวลาให้บริการ (Time Slots),
      ย้ายคิวไปบุคลากรคนอื่น (reassign-staff)
      > บริการในรายการกลางสร้าง แก้ และลบได้ผู้ดูแลระบบเท่านั้น (ดู tag SUPER_ADMIN)
  - name: SUPER_ADMIN
    x-roles: [SUPER_ADMIN]
    description: |
      ข้ามศูนย์ — **รายการบริการกลาง (สร้าง/แก้/ลบ ที่ /v1/staff/admin/services)**,
      ตั้งค่า Discord Webhook, จัดการช่วงเวลาให้บริการ (CRUD Time Slots)
  - name: STAFF
    x-roles: [STAFF]
    description: |
      เจ้าหน้าที่ห้องตรวจ — ออกคิว Walk-in, ลงวันลาตัวเอง
  - name: Patient
    x-roles: [patient]
    description: |
      ประชาชน/ผู้รับบริการ — ลงทะเบียน, เข้าสู่ระบบ, ค้นหา, จองคิว, ยกเลิก,
      ดูรายชื่อหมอที่เลือกได้และจองคิวกับหมอที่ต้องการ (staff selection)

paths:

  # ══════════════════════════════════════════════════════════
  #  PUBLIC — ไม่ต้อง login
  # ══════════════════════════════════════════════════════════

  /v1/staff/login:
    post:
      tags: [Public]
      summary: เข้าสู่ระบบเจ้าหน้าที่
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  format: password
                  example: "password"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      token:
                        type: string
                        example: "1|abc123..."
                      user:
                        $ref: "#/components/schemas/StaffUser"
        "422":
          description: |
            ข้อมูลไม่ถูกต้อง — ระบุ username/password ไม่ครบ หรือ
            ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง
            (`{'username': ['ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง']}`)
        "403":
          description: |
            ไม่สามารถเข้าสู่ระบบได้ —
            ยังไม่ได้ผูกกับ ศูนย์สุขภาพ (ยกเว้น SUPER_ADMIN) หรือ
            ศูนย์สุขภาพ ของบัญชีมีสถานะ INACTIVE (CLOSING ยัง login ได้ — ให้ staff จัดการคิวที่เหลือ)
        "429":
          description: |
            พยายามเข้าสู่ระบบมากเกินไป (throttle:staff) — 5 ครั้ง/30 นาที key by username+IP
            **หมายเหตุ: ลิมิตนี้จะนับเฉพาะ response 401/403 เท่านั้น — การกรอกรหัสผิด (422) ไม่ถูกนับในปัจจุบัน (ต้องแก้ที่โค้ด)**
      security: []

  /v1/patient/login:
    post:
      tags: [Public]
      summary: เข้าสู่ระบบผู้รับบริการ
      description: |
        ใช้ เบอร์โทรศัพท์ + วันเกิด
        ถ้าไม่พบประวัติในระบบ → is_registered = false
        (token=null, patient=null, message="ไม่พบประวัติผู้รับบริการ กรุณาลงทะเบียนใหม่")
        ระบุวันเกิดผิด 5 ครั้ง → ระงับการล็อกอินของเบอร์นี้ 30 นาที (423)
        Throttle: 10 req/min key by เบอร์โทร
      operationId: patientLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, birth_date]
              properties:
                phone_number:
                  type: string
                  pattern: "^[0-9]{10}$"
                  example: "0812345678"
                birth_date:
                  type: string
                  format: date
                  example: "1990-01-15"
      responses:
        "200":
          description: |
            สำเร็จ — ถ้ามีบัญชีจะได้ token, ถ้าไม่มีจะได้ is_registered = false
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PatientLoginSuccess"
                  - $ref: "#/components/schemas/PatientLoginNotRegistered"
        "401":
          description: |
            ระบุวันเกิดไม่ถูกต้อง (ก่อนครบ 5 ครั้ง) —
            "ข้อมูลวันเดือนปีเกิดไม่ถูกต้อง (เหลือโอกาสอีก N ครั้ง)"
            (ครบ 5 ครั้ง → 423 ล็อก 30 นาที)
        "422":
          $ref: "#/components/responses/ValidationError"
        "423":
          description: |
            ล็อกชั่วคราว 30 นาที — ระบุวันเกิดผิด 5 ครั้งต่อเนื่อง
            (เฉพาะส่วนของการตรวจสอบวันเกิด)
        "429":
          description: Rate limit exceeded (10 req/min) — key by เบอร์โทร
      security: []

  /v1/patient/register:
    post:
      tags: [Public]
      summary: ลงทะเบียนผู้รับบริการใหม่
      operationId: patientRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegisterRequest"
      responses:
        "201":
          description: ลงทะเบียนสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลงทะเบียนสำเร็จ"
                      token:
                        type: string
                      patient:
                        type: object
                        properties:
                          id:
                            type: integer
                          masked_name:
                            type: string
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limit exceeded (5 req/min)
      security: []

  /v1/patient/categories:
    get:
      tags: [Public]
      summary: หมวดหมู่บริการทั้งหมด
      operationId: patientGetCategories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
      security: []

  /v1/patient/right-types:
    get:
      tags: [Public]
      summary: สิทธิการรักษาทั้งหมด (dropdown สำหรับลงทะเบียน)
      operationId: patientGetRightTypes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RightType"
      security: []

  /v1/patient/nearby-centers:
    post:
      tags: [Public]
      summary: ค้นหา ศูนย์สุขภาพ ใกล้เคียง
      description: คำนวณระยะทางด้วย Haversine formula
      operationId: patientSearchNearby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, category_id]
              properties:
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  example: 18.5895
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  example: 98.9833
                category_id:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      count:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/NearbyCenter"
        "422":
          $ref: "#/components/responses/ValidationError"
      security: []

  /v1/patient/health-centers/{id}:
    get:
      tags: [Public]
      summary: รายละเอียด ศูนย์สุขภาพ (ชื่อ, ที่อยู่, พิกัด)
      operationId: patientGetCenterDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Health Center ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthCenterDetail"
        "404":
          $ref: "#/components/responses/NotFound"
      security: []

  /v1/patient/health-centers/{id}/services:
    get:
      tags: [Public]
      summary: บริการที่ศูนย์นี้ให้บริการจริง (dropdown เลือกบริการ)
      description: |
        ระบบส่งเฉพาะบริการที่ผ่านเงื่อนไขพร้อมกัน:
        ศูนย์เปิดบริการนั้นอยู่ · ศูนย์มีช่วงเวลาเปิดอย่างน้อยหนึ่งช่วง
        และหมวดหมู่ของบริการยังเปิดใช้งานอยู่
        ศูนย์ที่ปิดสมบูรณ์ → 404
        ค่าของศูนย์ไม่ได้อยู่แบนรวมกับบริการ แต่อยู่ใต้คีย์ `center_service`
      operationId: patientGetCenterServices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Health Center ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      health_center_status:
                        type: string
                        enum: [ACTIVE, CLOSING, INACTIVE]
                        description: สถานะปัจจุบันของศูนย์ (ACTIVE = เปิดรับจอง / CLOSING = กำลังปิด — ยังเห็นบริการได้)
                      data:
                        type: array
                        description: บริการที่ศูนย์นี้เปิดอยู่จริง พร้อมค่าของศูนย์ใต้คีย์ center_service
                        items:
                          $ref: "#/components/schemas/PatientServiceBrief"
        "404":
          $ref: "#/components/responses/NotFound"
      security: []

  /v1/patient/available-slots:
    get:
      tags: [Public]
      summary: ดูช่วงเวลาว่างของบริการ
      description: |
        หากศูนย์ของบริการนั้นอยู่ในสถานะไม่รับการจองใหม่ (CLOSING / INACTIVE)
        จะคืนค่า `slots` เป็นอาร์เรย์ว่าง (200) — ไม่มีช่วงเวลาให้เลือกจอง
        - สำหรับบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true):
          แต่ละ slot จะคืน `staff[]` เฉพาะหมอที่ว่าง (ไม่ลา/ไม่เต็ม) ในรอบนั้น
        - ถ้าไม่เปิดให้เลือกหมอ: slot ว่าง = ยังมีโควตาเหลือ (หมอประจำ/มอบหมายไม่ลาทั้งหมด)
      operationId: patientAvailableSlots
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: integer
          description: ID ของบริการ
        - name: health_center_id
          in: query
          required: true
          schema:
            type: integer
          description: |
            ID ของศูนย์ที่ต้องการดูช่วงเวลาว่าง — **required**
            ช่วงเวลาและโควตาเป็นของศูนย์นั้น ไม่ใช่ของบริการ
            บริการในรายการกลางไม่มีศูนย์ในตัวเอง คำขอจึงต้องระบุเสมอ
            ไม่ระบุ → 422 "กรุณาระบุศูนย์สุขภาพ"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: วันที่ต้องการจอง (ต้อง >= วันนี้)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      service_name:
                        type: string
                      capacity_type:
                        type: string
                        enum: [PER_MASSEUSE, PER_SLOT, PER_DAY]
                      date:
                        type: string
                        format: date
                      slots:
                        type: array
                        items:
                          $ref: "#/components/schemas/AvailableSlot"
        "422":
          $ref: "#/components/responses/ValidationError"
      security: []

  # ══════════════════════════════════════════════════════════
  #  STAFF (ทุกบทบาท) — login แล้วใช้ได้ทุก role
  # ══════════════════════════════════════════════════════════

  /v1/staff/me:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: ข้อมูลผู้ใช้ปัจจุบัน
      operationId: staffMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/StaffResource"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: แก้ไขโปรไฟล์ตัวเอง (ชื่อ / รหัสผ่าน)
      operationId: staffUpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                current_password:
                  type: string
                  description: จำเป็นถ้าต้องการเปลี่ยนรหัสผ่าน
                password:
                  type: string
                  minLength: 6
                password_confirmation:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "อัปเดตโปรไฟล์สำเร็จ"
                      user:
                        $ref: "#/components/schemas/StaffResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/logout:
    post:
      tags: [Staff (ทุกบทบาท)]
      summary: ออกจากระบบ
      operationId: staffLogout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ออกจากระบบเรียบร้อยแล้ว"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/dashboard/summary:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: สรุปภาพรวมประจำวัน
      description: จำนวนคิว waiting, completed, cancelled, no_show ของวันที่ระบุ
      operationId: staffDashboardSummary
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: "2026-08-21"
          description: วันที่ต้องการดู (ถ้าไม่ระบุ = วันนี้)
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      date:
                        type: string
                        format: date
                      summary:
                        $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/dashboard/bundle:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: หน้าจอหนึ่งจอ — สรุป คิว และรายชื่อบุคลากรในคำขอเดียว
      description: |
        รวม `summary` + `appointments` + `roster` ไว้ด้วยกัน เพื่อลดจำนวนคำขอของหน้าจอ
        และให้ทุกชิ้นใช้ `date` เดียวกันเสมอ (ถ้าเรียกแยกทีละ endpoint
        แต่ละคำขออาจได้วันที่ต่างกันและตัวเลขจะไม่ตรงกับรายการที่เห็น)

        **การรวมไม่ได้เปิดสิทธิ์ให้กว้างขึ้น — ขอบเขตของแต่ละชิ้นเหมือนเดิม:**

        | ชิ้น | STAFF | ผู้ดูแล |
        |---|---|---|
        | `summary` | นับเฉพาะบริการที่ได้รับมอบหมาย | ทั้งศูนย์ |
        | `appointments` | เฉพาะบริการที่ได้รับมอบหมาย | ทั้งศูนย์ |
        | `roster` | ทั้งศูนย์ | ทั้งศูนย์ |

        - `summary.total` เท่ากับจำนวนใน `appointments` เสมอ
        - `roster` เป็นทั้งศูนย์เพราะเจ้าหน้าที่ต้องเห็นว่าใครเข้าเวรหรือลาวันนี้
        - ข้อมูลผู้รับบริการใน `appointments` ยังถูกปิดบังเหมือนเดิม — ไม่มี `cid` หรือที่อยู่
        - `roster` คืนค่า `effective_status` (คำนวณรวมวันลา) เมื่อส่ง `date`; ไม่ส่ง `date` จะไม่มีฟิลด์นี้
        - endpoint เดิม (`/dashboard/summary`, `/appointments`, `/roster`) ยังทำงานเหมือนเดิม
      operationId: staffDashboardBundle
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: "2026-08-21"
          description: วันที่ต้องการดู ใช้กับทั้งสามชิ้น (ถ้าไม่ระบุ = วันนี้)
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      date:
                        type: string
                        format: date
                      summary:
                        $ref: "#/components/schemas/DashboardSummary"
                      appointments:
                        type: array
                        items:
                          $ref: "#/components/schemas/Appointment"
                      roster:
                        type: array
                        items:
                          $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/staff/admin/services:
    get:
      tags: [SUPER_ADMIN]
      summary: รายการบริการในรายการกลาง
      description: |
        บริการเป็นของทั้งจังหวัด ไม่สังกัดศูนย์ — ศูนย์หนึ่งแห่งจะเปิดบริการไหนได้
        ขึ้นกับแถวตั้งค่าของศูนย์นั้น ไม่ใช่บริการนี้
        - ไม่ระบุ `health_center_id` → ทั้งรายการกลาง และแต่ละรายการมีแต่ `centers[]` ว่าศูนย์ไหนเปิดอยู่
        - ระบุ `health_center_id` → เฉพาะบริการที่ศูนย์นั้นมีแถวตั้งค่า
          และค่าของศูนย์ถูกทับลงรายการนั้น (config_id, is_configured, is_active, capacity_type,
          allow_staff_selection, max_per_slot, max_per_day, time_slots, assigned_staff, selectable_staff)
        - ระบุศูนย์ที่ไม่มีอยู่จริง → **404** ไม่ใช่รายการว่าง
          เพราะรายการว่างจะถูกอ่านว่า "ศูนย์นี้ไม่มีบริการ" ทั้งที่จริงคือพิมพ์ผิด
        - `centers[].is_configured` บอกว่าศูนย์นั้นตั้งค่าครบจนเปิดให้บริการได้หรือยัง
      operationId: adminListServices
      parameters:
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CatalogService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ไม่พบศูนย์สุขภาพที่ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: health_center_id ไม่ใช่ตัวเลข
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [SUPER_ADMIN]
      summary: เพิ่มบริการเข้ารายการกลาง
      description: |
        สร้างได้เฉพาะตัวบริการคือหมวดหมู่ ชื่อ และคำอธิบาย
        โควตา ช่วงเวลา ผู้รับผิดชอบ และบุคลากรที่ผู้รับบริการเลือกได้ เป็นค่าของศูนย์
        จึงตั้งตอนเปิดบริการให้ศูนย์หนึ่งแห่ง ไม่ใช่ตอนสร้างบริการ
        - ชื่อต้องไม่ซ้ำทั้งระบบ และนับแถวที่ลบออกจากรายการกลางไปแล้วด้วย (422)
      operationId: adminCreateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCatalogServiceRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เพิ่มบริการในรายการกลางสำเร็จ"
                      data:
                        $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"


  /v1/staff/appointments:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายการนัดหมายประจำวัน
      description: |
        รายการคิว/นัดของศูนย์ในวันนั้น เรียงตาม appointment_number ASC
        - STAFF: เห็นเฉพาะคิวของบริการที่ตัวเองถูกมอบหมาย (assignees) — ส่ง service_id นอกเหนือ → 403
        - HC_ADMIN/SUPER_ADMIN: เห็นทุกคิวของศูนย์ (SA ระบุ ?health_center_id)
        - กรองด้วย date / service_id / status
        - **`date` ไม่จำกัดวัน** — ส่งวันอนาคตเพื่อดูคิวที่หมอจองไว้ล่วงหน้าให้ผู้รับบริการได้
      operationId: staffListAppointments
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: วันที่ (default = วันนี้ · ไม่จำกัดวัน)
        - name: service_id
          in: query
          schema:
            type: integer
          description: กรองตามบริการ
        - name: status
          in: query
          schema:
            type: string
            enum: [CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
          description: กรองตามสถานะ
        - $ref: "#/components/parameters/HealthCenterIdFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      date:
                        type: string
                        format: date
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/status:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: เปลี่ยนสถานะนัดหมาย
      description: |
        State machine:
        - CONFIRMED → COMPLETED
        - CONFIRMED → CANCELLED
        - CONFIRMED → NO_SHOW
        - NO_SHOW (ที่ระบบเป็นคนเปลี่ยน) → COMPLETED เท่านั้น

        **ขอบเขตการแตะคิว (ใช้เกณฑ์เดียวกับ reassign-staff และ unmask):**
        คิวเป็นของศูนย์ แต่ "ใครทำกับคิวนี้ได้" ขึ้นกับสองเงื่อนไข เข้าได้อย่างน้อยหนึ่งทาง
        1. ได้รับมอบหมายบริการนั้น (`health_center_service_user`)
        2. เป็นผู้ถูกระบุในคิวนั้น (`appointments.staff_id`)

        STAFF ที่ไม่เข้าเงื่อนไขทั้งสองทาง → **403**
        บริการที่ไม่ผูกชื่อบุคลากรจะไม่มีเงื่อนไขที่ 2
        HC_ADMIN / SUPER_ADMIN ไม่ถูกจำกัด
      operationId: staffUpdateAppointmentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                      data:
                        $ref: "#/components/schemas/Appointment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/reassign-staff:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: ย้ายคิวไปหมอ/เจ้าหน้าที่คนอื่น
      description: |
        ใช้กรณีหมอคนเดิมติดภารกิจกะทันหัน — เฉพาะบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true)

        **ขอบเขตการแตะคิว (ใช้เกณฑ์เดียวกับ update-status และ unmask):**
        STAFF ที่ไม่เข้าเงื่อนไขทั้งสองทาง → **403**
        1. ได้รับมอบหมายบริการนั้น (`health_center_service_user`)
        2. เป็นผู้ถูกระบุในคิวนั้น (`appointments.staff_id`) — คนที่ให้บริการจริง

        ข้อกำหนด (422 ถ้าไม่ผ่าน):
        - คิวต้องยังเป็นสถานะ CONFIRMED
        - บุคลากรคนใหม่ต้องอยู่ในรายชื่อที่ศูนย์นั้นให้เลือก (`health_center_service_staff`) และว่างวันนั้น (ไม่ลา)
        - บุคลากรคนใหม่ยังไม่เต็มคิวในรอบเวลานั้น (โควตา 1 คิว/รอบ/คน)
        - ย้ายเป็นบุคลากรคนเดิมซ้ำไม่ได้
        - ทุกการย้ายถูกบันทึก Audit Log (APPOINTMENT_STAFF_REASSIGN)
      operationId: staffReassignStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignStaffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ย้ายคิวไปเจ้าหน้าที่คนใหม่สำเร็จ"
                      data:
                        type: object
                        properties:
                          staff:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              position:
                                type: string
                                nullable: true
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/reschedule:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: เลื่อนคิวไปวันอื่น
      description: |
        ใช้เมื่อหมอติดงานด่วนจนให้บริการไม่ได้ จึงโทรคุยกับผู้รับบริการแล้วย้ายวันมา
        **แก้คิวเดิม** — ไม่สร้างคิวใหม่ ไม่ยกเลิกคิวเดิม จึงใช้ได้ทั้งคิวที่หมอจองให้ไว้ล่วงหน้า
        (ดู `POST /walk-in` ที่รับ `appointment_date`) และคิวที่ผู้รับบริการจองเองผ่านระบบ

        **ขอบเขตการแตะคิว (ใช้เกณฑ์เดียวกับ update-status, reassign-staff และ unmask):**
        STAFF ที่ไม่เข้าเงื่อนไขทั้งสองทาง → **403**
        1. ได้รับมอบหมายบริการนั้น (`health_center_service_user`)
        2. เป็นผู้ถูกระบุในคิวนั้น (`appointments.staff_id`) — คนที่ให้บริการจริง

        ข้อกำหนด (422 ถ้าไม่ผ่าน):
        - คิวต้องยังเป็นสถานะ CONFIRMED (เสร็จ/ยกเลิก/ไม่มาแล้วเลื่อนไม่ได้)
        - `appointment_date` ต้องไม่ย้อนหลังกว่าวันนี้
        - ช่วงเวลาใหม่ต้องเปิดให้บริการในวันนั้น และต้องเป็นของศูนย์เดิม
        - ไม่มีอะไรเปลี่ยนเลย (วันเดิม + รอบเดิม + หมอเดิม) — กันไว้เพราะเลขคิวจะถูกคำนวณใหม่
        - ถ้าระบุ staff_id ต้องผูกกับบริการ ไม่ลาวันนั้น และยังไม่เต็มคิวในรอบเวลานั้น
        - ผู้รับบริการต้องไม่มีคิวอื่นของบริการนี้ในวันที่ระบุ
        - ทุกอย่างอยู่ในธุรกรรมเดียว พร้อมล็อกแถวศูนย์สุขภาพและแถวนัดหมาย

        **เลขคิวคำนวณใหม่จากวันใหม่ทุกครั้ง** — เลขเดิมนับรวมคิวของวันที่ย้ายออกไปแล้ว

        ⚠️ **ผลที่ต้องยอมรับ: ใบนัดที่พิมพ์ไปแล้วจะบอกเลขคิวผิด**
        เพราะระบบไม่เก็บประวัติการเลื่อน จึงย้อนกลับไม่ได้ ควรพิมพ์ใบนัดใหม่ทุกครั้งหลังเลื่อน
      operationId: staffRescheduleAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleAppointmentRequest"
      responses:
        "200":
          description: เลื่อนสำเร็จ — คืนนัดหมายใหม่ทั้งใบ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เลื่อนคิวไปวันที่ 2026-10-05 เรียบร้อยแล้ว"
                      data:
                        $ref: "#/components/schemas/Appointment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/appointments/{id}/unmask:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

    post:
      tags: [Staff (ทุกบทบาท)]
      summary: เปิดเผยข้อมูลผู้รับบริการ (PDPA Audit)
      description: |
        เปิดเผยข้อมูลจริงของผู้รับบริการ (CID, ชื่อ, เบอร์โทร) — **ข้อมูลอ่อนไหวตาม PDPA**
        ทุกครั้งที่สำเร็จจะถูกบันทึกใน audit_logs (staff_id, ip, user_agent)
        Throttle: 10 req/min ต่อผู้ใช้ (throttle:unmask)

        **ขอบเขตการแตะคิว (ใช้เกณฑ์เดียวกับ update-status, reassign-staff และ reschedule):**
        STAFF ที่ไม่ได้รับมอบหมายบริการของคิวนั้น และไม่ได้เป็นผู้ถูกระบุในคิว → **403**
        การถูกปฏิเสธจะ**ไม่เขียน audit log** เพราะการเขียน log แปลว่ามีการเปิดข้อมูล ซึ่งไม่ได้เกิดขึ้น
        HC_ADMIN / SUPER_ADMIN ไม่ถูกจำกัด
      operationId: staffUnmaskPatient
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                health_center_id:
                  type: integer
                  description: จำเป็นสำหรับ SUPER_ADMIN เท่านั้น (คนอื่นไม่ต้องส่ง — ระบบใช้ศูนย์ตัวเอง)
      responses:
        "200":
          description: OK — ข้อมูลผู้รับบริการ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      patient:
                        $ref: "#/components/schemas/UnmaskedPatient"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ไม่พบข้อมูล — นัดหมายไม่ใช่ของ ศูนย์สุขภาพ ที่ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /v1/staff/roster:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายชื่อบุคลากรทั้งหมด
      description: |
        ถ้าระบุ `?date=` จะเพิ่ม field `effective_status` ให้แต่ละคน
        (คิดจาก status จริง ร่วมกับตารางลา staff_leaves ของวันนั้น
        — ถ้ามีวันลาในวันนั้นจะได้ effective_status = LEAVE) ตามลำดับ sort_order
        scope: non-SA เห็นเฉพาะของศูนย์ตัวเอง, SA ระบุ ?health_center_id
      operationId: staffListRoster
      parameters:
        - $ref: "#/components/parameters/HealthCenterIdFilter"
        - name: date
          in: query
          schema:
            type: string
            format: date
          example: "2026-08-25"
          description: วันที่ต้องการดูสถานะ (optional)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [HC Admin, Super Admin]
      summary: เพิ่มโปรไฟล์บุคลากรให้บัญชีที่มีอยู่แล้ว
      description: |
        เพิ่มโปรไฟล์บุคลากรให้บัญชีเจ้าหน้าที่ที่มีอยู่แล้วแต่ยังไม่มีโปรไฟล์
        - STAFF (เจ้าหน้าที่ปฏิบัติงาน) ถูกปฏิเสธ (403) — การเพิ่มบุคลากรเป็นอำนาจของผู้ดูแลศูนย์
        - `user_id` ต้องเป็นบัญชีที่ยังไม่ถูกลบและยังไม่เคยมีโปรไฟล์ (422)
        - ศูนย์สุขภาพมาจากบัญชีเจ้าของเสมอ ไม่รับ `health_center_id` จากผู้เรียก
        - ผู้ดูแลศูนย์ที่ยืมบัญชีของอีกศูนย์มา → 404
      operationId: staffCreateRoster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StaffMember"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/patients/{id}/contact:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Patient ID

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: แก้ไขเบอร์โทรศัพท์ผู้รับบริการ
      description: |
        เจ้าหน้าที่แก้ไขเบอร์โทรให้ผู้รับบริการ (เช่น กรณีปลดซิม / เปลี่ยนเบอร์ใหม่)

        ข้อกำหนด:
        - Patient ต้องมีประวัติคิวที่ ศูนย์สุขภาพ เป้าหมายอย่างน้อย 1 ครั้ง (tenant isolation)
        - STAFF / HC_ADMIN — ใช้ ศูนย์สุขภาพ ของตัวเองโดยอัตโนมัติ
        - SUPER_ADMIN — ต้องระบุ health_center_id ใน body เสมอ
        - เบอร์โทรคือ credentials สำหรับ login จึงต้องไม่ซ้ำกับผู้รับบริการท่านอื่น
        - ทุกการเปลี่ยนถูกบันทึก audit_logs (UPDATE_PATIENT_CONTACT — เก็บเบอร์เก่า/ใหม่แบบ masked)

        **ขอบเขตการแก้ข้อมูลผู้รับบริการ (STAFF เท่านั้น):**
        ผู้รับบริการไม่ได้ผูกกับบริการโดยตรง เขาผูกกับผ่านประวัติคิว
        จึงต้องเคยมีนัดหมายอย่างน้อยหนึ่งครั้งในบริการที่ได้รับมอบหมาย (`health_center_service_user`) ของศูนย์นั้น
        - ไม่จำกัดวัน เพราะเบอร์ที่ผิดมักถูกแก้หลังการมาเยือนเสร็จไปแล้ว
        - STAFF ที่ไม่ผ่านเงื่อนไข → **403** "ไม่ได้รับมอบหมายให้ดูแลบริการนี้" และไม่เขียน audit log
        - Patient ที่ไม่มีประวัติคิวในศูนย์นี้เลย → **404**
        - HC_ADMIN / SUPER_ADMIN ไม่ถูกจำกัด

        หมายเหตุ: การตรวจเบอร์ซ้ำเกิดก่อนการตรวจขอบเขต จึงตอบ 422 "เบอร์นี้ถูกใช้งานแล้ว" โดยไม่ตรวจขอบเขตของผู้เรียก
      operationId: staffUpdatePatientContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientContactRequest"
      responses:
        "200":
          description: OK — ส่งเบอร์เดิมจะได้ message "เบอร์โทรศัพท์ไม่มีการเปลี่ยนแปลง"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขเบอร์โทรศัพท์ผู้รับบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/PatientContactUpdate"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Patient ID

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขข้อมูลผู้รับบริการแบบเต็มรูปแบบ (Name / DOB / gender / ที่อยู่ / CID)
      description: |
        แก้ไขข้อมูลผู้รับบริการเพื่อแก้ไขข้อมูลให้ถูกต้อง (เช่น พิมพ์เลขบัตร/ชื่อ/วันเกิดผิด)

        สิทธิ์:
        - HEALTH_CENTER_ADMIN / SUPER_ADMIN เท่านั้น (STAFF ได้ 403)
        - ป้องกันการแก้ไขเลขบัตรประชาชนซ้ำกับผู้รับบริการท่านอื่น (422)

        ข้อกำหนด:
        - เลือกแก้ไขได้เฉพาะ field ที่ส่ง (partial update) — ส่งเฉพาะ field ที่ต้องการเปลี่ยน
        - `cid` แก้ไขได้เฉพาะกรณีพิมพ์ผิด (13 หลัก, ต้อง unique)
        - `phone_number` ไม่สามารถแก้ไขผ่าน endpoint นี้ — ใช้ `PATCH /v1/staff/patients/{id}/contact` (เป็น credentials ในการ login)
        - HEALTH_CENTER_ADMIN — ผู้รับบริการต้องมีประวัติคิวที่ศูนย์ของตัวเองอย่างน้อย 1 ครั้ง (tenant isolation)
        - SUPER_ADMIN — ต้องระบุ health_center_id ใน body เสมอ
        - ทุกการแก้ไขถูกบันทึก audit_logs (UPDATE_PATIENT_PROFILE — เก็บค่าก่อน/หลังแบบ masked)
      operationId: staffUpdatePatientProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientProfileRequest"
      responses:
        "200":
          description: OK — คืนข้อมูลผู้รับบริการแบบ unmask ทุก field
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขข้อมูลผู้รับบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/StaffPatientProfile"
        "403":
          description: STAFF ไม่มีสิทธิ์
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/leaves:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายการวันลาของเจ้าหน้าที่
      operationId: staffListLeaves
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: กรองตามวันที่
        - name: staff_user_id
          in: query
          schema:
            type: integer
          description: กรองตามเจ้าหน้าที่
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StaffLeaveResource"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [HEALTH_CENTER_ADMIN, STAFF, SUPER_ADMIN]
      summary: ลงวันลา (auto-approved, idempotent)
      description: |
        HC_ADMIN: ลงให้เจ้าหน้าที่ในศูนย์ตัวเอง
        STAFF: ลงให้ตัวเองเท่านั้น
        SUPER_ADMIN: ลงให้ใครก็ได้ (ระบุ health_center_id ของศูนย์นั้น)
        ลงซ้ำวันเดิม → idempotent (ไม่ error; คืน 200 ถ้ามีอยู่แล้ว, 201 ถ้าเพิ่งสร้าง)
        Guard (422): ถ้าเจ้าหน้าที่คนนั้นมีคิว CONFIRMED ในวันลานั้น
        → "ไม่สามารถลงวันลาได้ เนื่องจากมีคิวที่จองไว้แล้ว N คิวในวันนี้"
        Guard (422): ถ้าบัญชีนั้นยังไม่มีโปรไฟล์บุคลากรในศูนย์นั้น
        → "บัญชีนี้ยังไม่มีโปรไฟล์บุคลากรในศูนย์สุขภาพนี้ กรุณาเพิ่มโปรไฟล์ก่อนลงวันลา"
        ระบบไม่เดาว่าบัญชีไหนคือบุคลากรคนไหน: การผูกบัญชีกับโปรไฟล์เกิดได้เฉพาะตอนสร้างบัญชี
        หรือตอนเพิ่มโปรไฟล์ที่ระบุ `user_id` เท่านั้น การลงวันลาไม่ผูกอะไร
      operationId: staffCreateLeave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLeaveRequest"
      responses:
        "201":
          description: ลงวันลาสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลงวันลาสำเร็จ"
                      data:
                        $ref: "#/components/schemas/StaffLeaveResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/leaves/availability:
    get:
      tags: [Staff (ทุกบทบาท)]
      summary: ตรวจว่าวันที่-บริการ มีเจ้าหน้าที่ว่างหรือไม่
      description: |
        ใช้เช็คก่อนเปิด Walk-in / จอง — คืน available: true/false
        - allow_staff_selection=true → true เมื่อมีบุคลากรที่เลือกได้ (health_center_service_staff, ACTIVE, ไม่ลา) ≥ 1
        - allow_staff_selection=false → true เมื่อมีบุคลากรที่ได้รับมอบหมาย (health_center_service_user) อย่างน้อย 1 คนไม่ลาวันนั้น
        - false = ไม่มีบุคลากรว่างเลย (จะถูกปฏิเสธการจอง/Walk-in)
        - ความพร้อมเป็นคำถามของศูนย์หนึ่ง — HC_ADMIN/STAFF ใช้ศูนย์จาก token เอง
          SUPER_ADMIN ต้องส่ง health_center_id มา ไม่งั้นได้ 422
      operationId: staffCheckAvailability
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: integer
          description: ID บริการ
        - name: health_center_id
          in: query
          required: false
          schema:
            type: integer
          description: |
            ID ของศูนย์ที่ต้องการตรวจ — ไม่บังคับสำหรับ HC_ADMIN/STAFF (ใช้ศูนย์จาก token)
            SUPER_ADMIN ต้องส่งมา ถ้าไม่ส่งจะได้ 422 "กรุณาระบุศูนย์สุขภาพที่ต้องการตรวจสอบ"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: วันที่ต้องการตรวจ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      available:
                        type: boolean
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/leaves/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags: [HEALTH_CENTER_ADMIN, STAFF, SUPER_ADMIN]
      summary: ยกเลิกวันลา
      description: |
        HC_ADMIN: ยกเลิกได้เฉพาะวันลาในศูนย์ตัวเอง
        STAFF: ยกเลิกได้เฉพาะวันลาของตัวเอง
        SUPER_ADMIN: ยกเลิกของใครก็ได้ (ไม่ต้องส่ง health_center_id — ระบุ {id} อย่างเดียว)
      operationId: staffDeleteLeave
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ยกเลิกวันลาสำเร็จ"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ══════════════════════════════════════════════════════════
  #  HEALTH_CENTER_ADMIN — จัดการข้อมูลศูนย์ (+ SUPER_ADMIN)
  # ══════════════════════════════════════════════════════════

  # ══════════════════════════════════════════════════════════
  #  HEALTH_CENTER_ADMIN — ค่าตั้งบริการรายศูนย์ (+ SUPER_ADMIN ข้ามศูนย์)
  # ══════════════════════════════════════════════════════════

  /v1/staff/admin/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ServiceId"

    put:
      tags: [SUPER_ADMIN]
      summary: แก้ไขบริการในรายการกลาง
      description: |
        แก้ได้เฉพาะหมวดหมู่ ชื่อ และคำอธิบาย — ส่งเฉพาะช่องที่ต้องการเปลี่ยน
        ค่าที่เป็นของศูนย์ (โควตา วันให้บริการ ผู้รับผิดชอบ บุคลากรที่เลือกได้) แก้ที่นี่ไม่ได้
        ชื่อซ้ำทั้งระบบ (รวมชื่อที่เคยลบออกไปแล้ว) → 422
      operationId: adminUpdateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogServiceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขข้อมูลบริการในรายการกลางสำเร็จ"
                      data:
                        $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [SUPER_ADMIN]
      summary: ลบบริการออกจากรายการกลาง (Soft Delete)
      description: |
        - ลบได้ต่อเมื่อ **ไม่มีศูนย์ไหนเปิดบริการนี้ไว้** แม้จะปิดบริการแล้วก็ตาม
          เพราะแถวตั้งค่ายังอยู่ → 422 "ไม่สามารถลบบริการได้ เนื่องจากมีศูนย์สุขภาพกำลังใช้บริการนี้อยู่
          กรุณาให้ศูนย์สุขภาพเลิกใช้ก่อน"
        - ต้องไม่มีคิว CONFIRMED ตั้งแต่วันนี้ขึ้นไป **ข้ามทุกศูนย์** (นับรวมกันทั้งจังหวัด)
        - soft delete — หายจากรายการกลางและจากรายการบริการของทุกศูนย์ทันที
          ประวัติการจองเดิมยังอ้างถึงบริการนี้ได้
        - ชื่อที่ลบแล้วถูกสงวนไว้ ใช้ซ้ำไม่ได้
      operationId: adminDeleteService
      responses:
        "204":
          description: ลบสำเร็จ (ไม่มีเนื้อหาในคำตอบ)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: ยังมีศูนย์ใช้บริการนี้อยู่ หรือมีคิวยืนยันในอนาคต
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/staff/health-centers/{id}/services:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Health Center ID

    get:
      tags: [Staff (ทุกบทบาท)]
      summary: รายการบริการของศูนย์หนึ่งแห่ง พร้อมค่าตั้งของศูนย์
      description: |
        คืนรายการกลางทั้งหมด ทับด้วยค่าตั้งของศูนย์นี้
        บริการที่ศูนย์นี้ยังไม่ได้ตั้งค่าจะ**ไม่มี**คีย์ค่าของศูนย์ ซึ่งถูกต้อง
        เพราะผู้ดูแลศูนย์ต้องเห็นบริการที่ยังเลือกเปิดได้
        - เจ้าหน้าที่ปฏิบัติงานอ่านได้เฉพาะศูนย์ของตนเสมอ
          ไม่ใช่ศูนย์ที่ระบุในพาธ (ต่างกัน → 403) พาธมีไว้ยืนยันว่าไม่ได้ขอศูนย์อื่น
        - ผู้ดูแลระบบยึดศูนย์จากพาธ จึงอ่านข้ามศูนย์ได้
        - ระบุ `date` → เหลือเฉพาะบริการที่ศูนย์เปิดอยู่ **และ** มีช่วงเวลาเปิดในวันนั้น
          อย่างน้อยหนึ่งช่วง รูปแบบวันที่ผิด → 422
        - `assigned_staff` และ `selectable_staff` คืนชื่อบุคลากรพร้อมกัน
          หน้าจอจึงแสดงได้ว่าใครอยู่เวรโดยไม่ต้องเรียกอีก endpoint
      operationId: staffListCenterServices
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: ถ้าระบุ จะเหลือเฉพาะบริการที่ศูนย์ให้บริการได้จริงในวันนั้น
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CenterService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: รูปแบบวันที่ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [HEALTH_CENTER_ADMIN]
      summary: เปิดบริการในรายการกลางให้ศูนย์นี้ พร้อมตั้งค่าให้ครบ
      description: |
        ศูนย์เลือกจากรายการกลางว่าจะเปิดบริการไหน แล้วตั้งค่าให้ครบในคำขอเดียว
        ศูนย์หนึ่งเปิดบริการนี้ไว้แล้วจะเปิดซ้ำไม่ได้ ให้ใช้ปุ่มเปิด/ปิดแทน
        - ผู้ดูแลศูนย์เปิดได้เฉพาะศูนย์ตัวเอง (ต่างจากพาธ → 403)
        - ผู้ดูแลระบบยึดศูนย์จากพาธ
        - ถ้าตั้งค่าไม่ครบจริงจะไม่เหลือแถวค้าง และข้อความปฏิเสธจะระบุรายการที่ขาด
          **ทั้งหมดพร้อมกัน** ไม่ใช่ทีละช่อง
        - ถ้าเปิดให้ผู้รับบริการเลือกบุคลากร ต้องนับโควตาตามบุคลากร
          และต้องส่ง selectable_staff_ids มาอย่างน้อย 1 คน
        - ทุกครั้งที่เปิด ระบบเขียน Audit Log (`SERVICE_CENTER_ACTIVATE`)
      operationId: staffActivateCenterService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateCenterServiceRequest"
      responses:
        "201":
          description: เปิดให้บริการแล้ว
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เปิดบริการของศูนย์สุขภาพนี้แล้ว"
                      data:
                        $ref: "#/components/schemas/HealthCenterService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: ตั้งค่าไม่ครบ หรือชนกติการะหว่างช่อง — ข้อความระบุรายการที่ขาดทั้งหมด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/staff/health-center-services/{id}:
    parameters:
      - $ref: "#/components/parameters/CenterServiceConfigId"

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขค่าตั้งของบริการที่ศูนย์เปิดไว้
      description: |
        `id` ในพาธคือ **แถวตั้งค่าของศูนย์** ไม่ใช่รหัสบริการในรายการกลาง
        ส่งเฉพาะช่องที่ต้องการเปลี่ยน
        - ผู้ดูแลศูนย์แก้ได้เฉพาะแถวของศูนย์ตัวเอง (ต่าง → 403) · ผู้ดูแลระบบแก้ได้ทุกศูนย์
        - แถวที่**เปิดอยู่**ต้องยังให้บริการได้จริงหลังแก้ ค่าที่ขาดจะถูกปฏิเสธ
          พร้อมรายการที่ขาดทั้งหมด
        - แถวที่**ปิดอยู่**เก็บค่าตั้งค้างไว้ได้ เพื่อเปิดใหม่วันหลัง
        - การแกะบุคลากรออกจากรายชื่อที่เลือกได้ **ตรวจคิวค้างเฉพาะตอนสวิตช์เป็น `false`**
          (เป็น `false` อยู่แล้ว หรือกำลังส่ง `allow_staff_selection: false` มากับคำขอนี้)
          — 422 และคำขอทั้งคำขอไม่ถูกเขียน
        - ⚠️ ถ้าสวิตช์ยังเป็น `true` ระบบ**ไม่ตรวจ**คิวค้างของคนที่ถูกแกะ
          แกะบุคลากรที่ยังมีนัดหมายรอได้ และนัดหมายยังผูกกับเขาอยู่
          เป็นช่องโหว่ของกติกา ต้องแก้ที่โค้ด
        - ทุกครั้งที่แก้ไข ระบบเขียน Audit Log (`SERVICE_CENTER_CONFIG_UPDATE`)
          เก็บค่าก่อนและหลัง
      operationId: staffUpdateCenterServiceConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCenterServiceConfigRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขค่าตั้งบริการสำเร็จ"
                      data:
                        $ref: "#/components/schemas/HealthCenterService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: ตั้งค่าไม่ครบ หรือชนกติการะหว่างช่อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [HEALTH_CENTER_ADMIN]
      summary: เอาบริการออกจากศูนย์นี้ (ค่าตั้งหายไป)
      description: |
        `id` ในพาธคือแถวตั้งค่าของศูนย์
        - ต้องไม่มีคิวค้างของบริการนั้นในศูนย์นี้ (422)
        - ต่างจากการ **ปิด**: ค่าตั้งหายไปด้วย (โควตา วันให้บริการ ผู้รับผิดชอบ
          บุคลากรที่ผู้รับบริการเลือกได้) เปิดใหม่ต้องกรอกให้ครบอีกครั้ง
          การปิดแทนคงค่าตั้งไว้ เปิดคืนแล้วใช้ค่าเดิมได้ทันที
        - บริการในรายการกลางยังอยู่เสมอ ไม่ได้ถูกลบ
        - ทุกครั้งที่เอาออก ระบบเขียน Audit Log (`SERVICE_CENTER_REMOVE`)
      operationId: staffRemoveCenterService
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลบบริการออกจากศูนย์สุขภาพนี้แล้ว"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: ยังมีคิวค้างของบริการนั้นในศูนย์นี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/staff/health-center-services/{id}/toggle-status:
    parameters:
      - $ref: "#/components/parameters/CenterServiceConfigId"

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: เปิด/ปิดบริการของศูนย์ (ค่าตั้งยังอยู่)
      description: |
        `id` ในพาธคือแถวตั้งค่าของศูนย์
        - **เปิด** → ต้องตั้งค่าครบ ไม่งั้นปฏิเสธพร้อมรายการที่ขาดทั้งหมด
          กติกานี้ถูกบังคับตรงนี้ ไม่ใช่ตอนกรอกฟอร์ม
          ค่าตั้งที่ทำค้างไว้แล้วกลับมาเปิดอีกครั้ง ต้องผ่านเงื่อนไขเดียวกับการเปิดครั้งแรก
        - **ปิด** → ต้องไม่มีคิวค้างของบริการนั้นในศูนย์นี้
          เพราะการปิดจะทำให้ผู้รับบริการที่จองไว้ถูกทิ้งเงียบ ๆ (422)
        - ค่าตั้งเดิมยังอยู่ทั้งหมด — เปิดคืนแล้วใช้ค่าเดิมได้ทันที
        - ทุกครั้งที่สลับ ระบบเขียน Audit Log (`SERVICE_CENTER_TOGGLE_STATUS`)
      operationId: staffToggleCenterServiceStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "เปิดบริการแล้ว"
                      is_active:
                        type: boolean
                        description: สถานะหลังสลับ
                      is_configured:
                        type: boolean
                        description: ตอนนี้ค่าตั้งครบจนเปิดให้บริการได้หรือยัง
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: เปิดไม่ได้เพราะตั้งค่าไม่ครบ หรือปิดไม่ได้เพราะมีคิวค้าง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /v1/staff/roster/{id}/toggle-duty:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags: [Staff (ทุกบทบาท)]
      summary: สลับสถานะเวร ACTIVE ↔ LEAVE
      description: |
        สลับสถานะเวรของบุคลากรในศูนย์
        - ไม่สามารถสลับได้ถ้าสถานะเป็น INACTIVE (422)
        - สลับเป็น LEAVE ไม่ได้ถ้ายังมีคิว CONFIRMED ของบุคลากรนี้อยู่ตั้งแต่วันนี้เป็นต้นไป (422)
        STAFF: สลับเวรได้เฉพาะในศูนย์ตัวเอง
      operationId: staffToggleDuty
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                health_center_id:
                  type: integer
                  description: จำเป็นสำหรับ SUPER_ADMIN เท่านั้น (คนอื่นไม่ต้องส่ง — ระบบใช้ศูนย์ตัวเอง)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: string
                        enum: [ACTIVE, LEAVE]
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "ไม่สามารถสลับได้ — สถานะ INACTIVE หรือมีคิว CONFIRMED อยู่ในอนาคต (ตั้งแต่วันนี้ขึ้นไป)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/staff/admin/users:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายชื่อผู้ใช้ (หน้า/กรอง) — SUPER_ADMIN ทุกศูนย์ / HC_ADMIN ศูนย์ตัวเอง
      description: |
        แสดงเฉพาะผู้ใช้ที่ยัง **ไม่ถูกลบ** (soft delete) — บัญชีที่ลบไปแล้วจะไม่ปรากฏในผลลัพธ์หรือการค้นหา
      operationId: adminListUsers
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: ค้นหาตามชื่อหรือ username
        - name: health_center_id
          in: query
          schema:
            type: integer
          description: กรองตาม ศูนย์สุขภาพ
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
          description: กรองตามสถานะบัญชีผู้ใช้
        - name: role_ids[]
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: >
            กรองตาม role (SUPER_ADMIN ใช้ได้; HC_ADMIN ถูกจำกัดให้เห็นเฉพาะ role STAFF)
            **ต้องใช้ชื่อพารามิเตอร์ `role_ids[]` และเรียกซ้ำได้หลายครั้ง** เช่น `?role_ids[]=3&role_ids[]=5`
            ถ้าส่งเป็น `?role_ids=3` จะได้ 422 เพราะ Laravel มองเป็น string ไม่ใช่ array
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
          description: จำนวนต่อหน้า
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [id, name, username, status, created_at]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PaginatedUsers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [HEALTH_CENTER_ADMIN]
      summary: สร้างบัญชีพร้อมโปรไฟล์บุคลากร (role_ids ได้เฉพาะ STAFF)
      description: |
        สร้างบัญชีเจ้าหน้าที่พร้อมโปรไฟล์บุคลากรใน transaction เดียว
        เพราะทุกบัญชีที่สร้างต้องระบุว่าเป็นบุคลากรคนไหน
        - ต้องระบุ `name` (ชื่อบุคลากร), `category_id`, `position`, `role_ids`
        - `role_ids` ห้ามว่าง (422)
        - `health_center_id` ต้องไม่ว่าง (422) — ทุกบัญชีต้องมีศูนย์ เพราะโปรไฟล์บุคลากรต้องอยู่ในศูนย์
        - HC_ADMIN สร้างได้เฉพาะ role STAFF และบังคับศูนย์ของตัวเอง
        ทุกการสร้างสำเร็จถูกบันทึก audit_logs (`USER_CREATED` — username, name, health_center_id, role_ids, staff_id)
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUserRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "สร้างผู้ใช้สำเร็จ"
                      data:
                        $ref: "#/components/schemas/UserResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags: [HEALTH_CENTER_ADMIN]
      summary: แก้ไขผู้ใช้ (role_ids ได้เฉพาะ STAFF)
      description: |
        HC_ADMIN: อัปเดตเฉพาะผู้ใช้ในศูนย์ตัวเอง, role_ids จำกัดเฉพาะ STAFF,
        ไม่สามารถแก้ไข SUPER_ADMIN หรือย้ายผู้ใช้ข้ามศูนย์ได้
        - แก้ไขบัญชีที่ถูกลบไปแล้ว (soft delete) → 404 "ไม่พบผู้ใช้ที่ระบุ"
        - **ให้หรือถอด `HEALTH_CENTER_ADMIN` ได้เฉพาะ SUPER_ADMIN** (403 ถ้า HC_ADMIN พยายามเปลี่ยนบทบาทนี้) — HC_ADMIN แก้ข้อมูลอื่นของผู้ดูแลศูนย์ได้ถ้ายังคงบทบาทนั้นไว้
        - ถอด role `HEALTH_CENTER_ADMIN` หรือตั้ง status = INACTIVE ให้ผู้ดูแลศูนย์คนสุดท้ายที่ยัง ACTIVE ในศูนย์นั้น → 422
        - `role_ids` ห้ามว่าง (422)
        - เปลี่ยนรหัสผ่าน หรือตั้ง status = INACTIVE → ลบ token ทั้งหมดของบัญชีนั้นทันที; แก้ชื่อหรือเบอร์โทรไม่ลบ token
        - ทุกการแก้ไขสำเร็จถูกบันทึก audit_logs (`USER_UPDATED` — เก็บ name/status/role_ids ก่อน-หลัง)
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "แก้ไขผู้ใช้สำเร็จ"
                      data:
                        $ref: "#/components/schemas/UserResource"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      tags: [HEALTH_CENTER_ADMIN]
      summary: ลบผู้ใช้ (soft delete — ห้ามลบตัวเอง / SUPER_ADMIN / มีคิวอนาคต)
      description: |
        **Soft delete** — ผู้ใช้ถูกลบแบบ soft (ตั้ง `deleted_at`) และไม่มี endpoint กู้คืน:
        - บัญชีหายจากรายชื่อผู้ใช้ และ login ไม่ได้อีกต่อไป
        - บุคลากรใน roster ของบัญชีถูกตัดออก: `staff.user_id` → null, `staff.status` → INACTIVE (ยังอยู่ใน roster)
        - เลิกผูกบริการที่ผู้รับบริการเลือกได้ (`health_center_service_user`) และเพิกถอน token (Sanctum) ทั้งหมด
        - เก็บประวัติ `user_roles` / `staff_leaves` / `audit_logs` ไว้; username เดิมถูกสงวนถาวร ใช้ซ้ำไม่ได้

        Guard ที่ห้ามลบ (422):
        - ลบบัญชีของตนเอง → "ไม่สามารถลบบัญชีของตนเองได้"
        - ลบ SUPER_ADMIN คนสุดท้ายที่ยัง ACTIVE → "ไม่สามารถลบบัญชี SUPER_ADMIN คนสุดท้ายได้"
        - ลบผู้ดูแลศูนย์คนสุดท้ายที่ยัง ACTIVE ในศูนย์นั้น → "ไม่สามารถถอดหรือปิดผู้ดูแลศูนย์คนสุดท้ายของศูนย์สุขภาพนี้ได้" (การลบเป็นการถอดบทบาทและปิดบัญชีพร้อมกัน และกู้คืนไม่ได้)
        - บัญชีมีคิว CONFIRMED ในอนาคต (วันนี้เป็นต้นไป) ผูกกับบุคลากรใน roster → "ไม่สามารถลบบัญชีผู้ใช้ได้ เนื่องจากมีคิวที่จองไว้แล้ว N คิว กรุณาจัดการคิวก่อน"
        - HC_ADMIN พยายามลบ SUPER_ADMIN → 403 "ไม่สามารถลบบัญชีผู้ดูแลระบบได้"

        ทุกการลบสำเร็จถูกบันทึก audit_logs (`USER_DELETED` — username, name, health_center_id, staff_ids)
      operationId: adminDeleteUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "ลบผู้ใช้สำเร็จ"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "ไม่สามารถลบได้ต่อเมื่อ — ลบบัญชีของตนเอง / SUPER_ADMIN คนสุดท้ายที่ ACTIVE / มีคิว CONFIRMED อนาคตใน roster"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/admin/roles:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายชื่อ role ที่มองเห็น (dropdown สำหรับจัดการผู้ใช้)
      description: |
        เฉพาะ SUPER_ADMIN / HEALTH_CENTER_ADMIN เท่านั้น (STAFF เข้าไม่ได้ — 403)
        SUPER_ADMIN: เห็นทุก role (SUPER_ADMIN, HEALTH_CENTER_ADMIN, STAFF)
        HC_ADMIN: เห็นเฉพาะ STAFF
      operationId: adminListRoles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            display_name:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/staff/admin/patients:
    get:
      tags: [HEALTH_CENTER_ADMIN]
      summary: รายชื่อผู้รับบริการ — SUPER_ADMIN ทุกศูนย์ / HC_ADMIN ศูนย์ตัวเอง
      description: |
        ใช้สองทาง:
        - **ค้นด้วย `cid`** = การยืนยันตัวตนที่หน้าเคาน์เตอร์ คืนผู้รับบริการที่ลงทะเบียนไว้
          แม้ยังไม่เคยมาที่ศูนย์นั้น (ไม่จำกัดศูนย์) พร้อม `patient_rights` เพื่อเติมฟอร์ม
          การค้นแล้วพบจะถูกบันทึกลง `audit_logs` ด้วย `action = LOOKUP_PATIENT_BY_CID`
        - **ค้นด้วย `q` / `phone` / `province` / `district`** = ค้นในข้อมูลของศูนย์
          ผู้ดูแลศูนย์เห็นเฉพาะผู้ที่มีประวัติคิวที่ศูนย์ตน
        การค้นแล้วไม่พบไม่ถูกบันทึก เพราะไม่มีข้อมูลถูกเปิดออกไป
      operationId: adminListPatients
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: ค้นหาตามชื่อ/นามสกุล (จำกัดศูนย์ — ต้องมีประวัติคิวที่ศูนย์)
        - name: cid
          in: query
          schema:
            type: string
          description: |
            เลขบัตรประชาชน 13 หลัก (ค้นหาแบบตรง ไม่จำกัดศูนย์)
            ใช้ที่หน้าเคาน์เตอร์เพื่อเติมข้อมูลผู้รับบริการเดิมก่อนออกนัดหมายเดินเข้ารับบริการ
        - name: phone
          in: query
          schema:
            type: string
          description: ค้นหาเบอร์โทรบางส่วน
        - name: health_center_id
          in: query
          schema:
            type: integer
          description: SUPER_ADMIN กรองเฉพาะผู้ที่มีประวัติคิวที่ศูนย์นี้
        - name: gender
          in: query
          schema:
            type: string
            enum: [MALE, FEMALE, OTHER]
        - name: province
          in: query
          schema:
            type: string
        - name: district
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, first_name, last_name, id]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PaginatedPatients"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

