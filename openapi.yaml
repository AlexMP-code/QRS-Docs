  # ══════════════════════════════════════════════════════════
  #  STAFF เท่านั้น — เจ้าหน้าที่ห้องตรวจ
  # ══════════════════════════════════════════════════════════

  /v1/staff/appointments/walk-in:
    post:
      tags: [Staff (ผู้ดูแลศูนย์ + ผู้ดูแลระบบ)]
      summary: นัดหมายเดินเข้ารับบริการ (ผู้ดูแลศูนย์สร้างให้ผู้รับบริการที่หน้าเคาน์เตอร์)
      description: |
        **ผู้ที่เรียกได้**: `HEALTH_CENTER_ADMIN` (ศูนย์ของตนเอง) และ `SUPER_ADMIN` (ต้องระบุ `health_center_id`)
        เจ้าหน้าที่ปฏิบัติงาน (`STAFF`) เรียกไม่ได้ → 403 เพราะหน้าที่นี้เป็นของผู้ดูแลศูนย์
        ผู้ดูแลศูนย์ถือตารางเวลาและบุคลากรของศูนย์ทั้งหมด จึงออกนัดหมายได้ทุกบริการโดยไม่ต้องได้รับมอบหมาย

        **ข้อมูลผู้รับบริการที่เก็บไว้เหมือนการลงทะเบียน**
        บังคับ: `cid`, `first_name`, `last_name`, `phone_number`, `birth_date`
        ส่วนที่อยู่ จังหวัด ที่อยู่ เพศ และสถานพยาบาลหลัก เป็นข้อมูลเสริม (ไม่บังคับ)
        `right_type_id` เป็นข้อมูลเสริม (ไม่บังคับ) — ถ้าไม่ส่ง ผู้รับบริการเข้าจองได้ก่อน
        และจะยังไม่มีสิทธิการรักษาผูกกับนัดหมาย (นัดหมายถูกเรียกเก็บค่าใช้จ่ายไม่ได้)
        ถ้าส่งมาแล้วผู้รับบริการยังไม่มีสิทธิหลัก ระบบจะสร้างให้เป็นสิทธิหลัก
        ถ้ามีสิทธิหลักอยู่แล้ว ระบบใช้สิทธิหลักเดิม และค่า `right_type_id` ที่ส่งมาจะไม่ถูกใช้
        จุดประสงค์คือให้ผู้รับบริการใช้ `phone_number` + `birth_date`
        เข้าสู่ระบบเพื่อจองเองในครั้งถัดไปได้ โดยไม่ต้องลงทะเบียนซ้ำ

        **ผู้รับบริการเดิม** (พบจาก `cid`): เติมเฉพาะช่องที่ยังว่าง ไม่ทับข้อมูลเดิม
        และใช้สิทธิหลักเดิม ไม่สร้างสิทธิซ้ำ
        ถ้า `phone_number` หรือ `birth_date` ไม่ตรงกับที่มีอยู่ → 422
        (เพราะหมายความว่าไม่ใช่ผู้รับบริการคนเดียวกัน)
        ค้นข้อมูลเดิมก่อนกรอกได้ที่ `GET /v1/staff/admin/patients?cid=...` ซึ่งคืนโปรไฟล์พร้อม
        `patient_rights` และไม่จำกัดศูนย์ (เพราะการค้นด้วยเลขบัตรประชาชนคือการยืนยันตัวตน
        ไม่ใช่การค้นในข้อมูลของศูนย์ — ผู้รับบริการที่ลงทะเบียนเองที่ศูนย์อื่นก็ต้องหาเจอ)
        การค้นด้วย `cid` แล้วพบจะถูกบันทึกลง `audit_logs` ด้วย `action = LOOKUP_PATIENT_BY_CID`

        **เบอร์โทรศัพท์ชนผู้รับบริการคนอื่น** (เลขบัตรประชาชนใหม่ แต่เบอร์ไปตรงกับที่มีอยู่) → 422
        พร้อมข้อความที่ระบุเลขบัตรประชาชนของเจ้าของเบอร์ ให้ตรวจสอบได้ทันที

        เงื่อนไขปฏิเสธ (422): ศูนย์ของบริการนั้นอยู่ในสถานะไม่รับการจองใหม่ (CLOSING / INACTIVE),
        บริการ/ช่วงเวลาไม่อยู่ใน Operating Days, staff ประจำบริการลาทั้งหมด (หรือหมอที่ส่งลาทั้งหมด), ศูนย์เต็ม เป็นต้น
        - สำหรับบริการที่เปิดให้เลือกหมอ (allow_staff_selection=true): ต้องส่ง staff_id
          (หมอที่ผูกกับบริการ, สถานะ ACTIVE, ไม่ลา, ยังไม่เต็ม round นั้น) — ไม่ส่ง/ส่งซ้ำ/หมอลา/ไม่ผูก → 422
        - booked_by_type = STAFF เสมอสำหรับ walk-in
        - SUPER_ADMIN: ต้องระบุ health_center_id ใน body (ข้ามศูนย์)
          ไม่ส่ง → 422 `{"success": false, "message": "SUPER_ADMIN ต้องระบุ health_center_id"}`
          ส่งศูนย์ที่ไม่มีอยู่ → 404 `{"success": false, "message": "ไม่พบข้อมูลศูนย์สุขภาพ ที่ระบุ"}`
        - HEALTH_CENTER_ADMIN: ไม่ต้องส่ง และถูกบังคับให้เป็นศูนย์ตนเอง
          (การส่ง `health_center_id` ของศูนย์อื่นไม่ทำให้นัดหมายไปตกศูนย์อื่น เพราะศูนย์ที่บันทึกมาจากบริการที่เลือก)
        - **ศูนย์ที่บันทึกในนัดหมายมาจากบริการที่เลือกเสมอ** ไม่ได้มาจากค่าใน body

        **จองล่วงหน้าให้ผู้รับบริการที่ไม่มีอุปกรณ์** — ส่ง `appointment_date`
        ใช้เมื่อผู้รับบริการโทรมานัดล่วงหน้า (ไม่มีอินเทอร์เน็ตหรือสมาร์ทโฟน)
        จึงต้องพิมพ์ใบนัดให้จากหน้าจอนี้ ครั้งหน้าเขาเข้าสู่ระบบเองด้วยเบอร์ + วันเกิดได้
        ไม่ส่ง `appointment_date` = วันนี้ ซึ่งเป็นการมาถึงหน้าเคาน์เตอร์ (พฤติกรรมเดิม)
        - ย้อนหลังกว่าวันนี้ → 422
        - ทุกอย่างที่เกี่ยวกับวันที่ (วันเปิดบริการ วันลาของบุคลากร) ตรวจด้วยวันที่จอง ไม่ใช่วันที่กด
      operationId: staffWalkInBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkInBookingRequest"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "สร้างนัดหมายสำเร็จ"
                      appointment:
                        type: object
                        properties:
                          id:
                            type: integer
                          queue_no:
                            type: string
                            example: "Q-001"
                          patient_name:
                            type: string
                            example: "สมชาย ใจดี"
        "403":
          description: |
            ผู้เรียกไม่ใช่ผู้ดูแลศูนย์หรือผู้ดูแลระบบ (เจ้าหน้าที่ปฏิบัติงานเรียกไม่ได้)
            ข้อความจริงจาก role middleware: "ไม่มีสิทธิ์เข้าถึง"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบศูนย์สุขภาพที่ระบุ (SUPER_ADMIN ส่ง health_center_id ที่ไม่มีอยู่)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            ข้อมูลไม่ผ่านการตรวจ หรือเงื่อนไขการออกคิวไม่ผ่าน
            หมายเหตุ: ไม่ระบุ `health_center_id` จะได้ข้อความ `{"success": false, "message": "SUPER_ADMIN ต้องระบุ health_center_id"}`
            ไม่ใช่รูปแบบ validation error — เพราะถูกตรวจที่ชั้นการระบุศูนย์ก่อนตรวจข้อมูล
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

