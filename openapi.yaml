        เพราะผู้รับบริการอาจเข้าจากหลายเครื่อง และเครื่องอื่นไม่ได้ขอออกจากระบบ
        ตรงกับ `POST /v1/staff/logout`

        token ที่ถูกยกเลิกแล้วใช้ซ้ำไม่ได้ → 401
      operationId: patientLogout
